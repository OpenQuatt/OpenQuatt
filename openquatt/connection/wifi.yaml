# ==============================================================================
# OpenQuatt - Connection Profile: Wi-Fi
# ==============================================================================
# Wi-Fi targets keep ESP Web Tools provisioning and AP fallback enabled.
# ==============================================================================

substitutions:
  oq_connection: "wifi"

external_components:
  - source:
      type: local
      path: ${external_components_path}
    components: [openquatt_captive_portal_router]

wifi:
  power_save_mode: none
  min_auth_mode: wpa2
  ap:
    ssid: "OpenQuatt"
    password: "openquatt"

captive_portal:

# Keep captive provisioning ahead of the normal web app while fallback AP mode is active.
openquatt_captive_portal_router:

# Enable ESP Web Tools Wi-Fi provisioning while keeping AP fallback available.
improv_serial:
  next_url: "http://{{ip_address}}/"

sensor:
  - platform: wifi_signal
    id: oq_wifi_signal
    name: WiFi Signal
    icon: mdi:wifi-arrow-left-right
    update_interval: 300s
    entity_category: diagnostic

openquatt_usage_telemetry:
  wifi_signal_sensor: oq_wifi_signal

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address
      icon: mdi:ip-network-outline
      entity_category: diagnostic
    ssid:
      name: WiFi SSID
      icon: mdi:wifi
      entity_category: diagnostic
