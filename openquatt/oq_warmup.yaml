# ==============================================================================
# OpenQuatt - Controlled Warmup
# ==============================================================================
# Controlled warmup is shared by both automatic heating strategies.
# Settings persist; the runtime session and previous setpoint never persist.
# Pack the six settings in one NVS blob (3 entries, rather than 18).
# Ignore template setup callbacks until the restored block is applied.
esphome:
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // Reject a corrupt or incompatible settings block before enabling.
          auto &saved = id(oq_warmup_settings);
          oq_warmup::normalize_stored_settings(saved);
          id(oq_warmup_trigger_c).publish_state(saved[1]);
          id(oq_warmup_step_c).publish_state(saved[2]);
          id(oq_warmup_step_minutes).publish_state(saved[3]);
          id(oq_warmup_max_offset_c).publish_state(saved[4]);
          id(oq_warmup_max_hours).publish_state(saved[5]);
          id(oq_warmup_enabled).publish_state(saved[0] == 1.0f);
          id(oq_warmup_settings_ready) = true;
          oq_warmup_runtime::runtime().cancel(oq_warmup::Status::IDLE);

globals:
  - id: oq_warmup_settings
    type: float[6]
    restore_value: true
    initial_value: '{0.0f, 1.5f, 0.1f, 45.0f, 0.5f, 8.0f}'
  - id: oq_warmup_settings_ready
    type: bool
    restore_value: false
    initial_value: 'false'

switch:
  - platform: template
    id: oq_warmup_enabled
    name: "Controlled warmup enabled"
    icon: mdi:heat-wave
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lambda: |-
          if (id(oq_warmup_settings_ready)) id(oq_warmup_settings)[0] = 1.0f;
          oq_warmup_runtime::runtime().cancel(oq_warmup::Status::IDLE);
    on_turn_off:
      - lambda: |-
          if (id(oq_warmup_settings_ready)) id(oq_warmup_settings)[0] = 0.0f;
          oq_warmup_runtime::runtime().cancel(oq_warmup::Status::DISABLED);

number:
  - platform: template
    id: oq_warmup_trigger_c
    name: "Controlled warmup trigger"
    icon: mdi:tune
    unit_of_measurement: "°C"
    min_value: 0.5
    max_value: 5
    step: 0.1
    initial_value: 1.5
    optimistic: true
    restore_value: false
    entity_category: config
    on_value:
      - lambda: |-
          if (id(oq_warmup_settings_ready)) id(oq_warmup_settings)[1] = x;
          oq_warmup_runtime::runtime().cancel(oq_warmup::Status::SETTINGS_CHANGED);

  - platform: template
    id: oq_warmup_step_c
    name: "Controlled warmup step"
    icon: mdi:tune
    unit_of_measurement: "°C"
    min_value: 0.1
    max_value: 0.5
    step: 0.1
    initial_value: 0.1
    optimistic: true
    restore_value: false
    entity_category: config
    on_value:
      - lambda: |-
          if (id(oq_warmup_settings_ready)) id(oq_warmup_settings)[2] = x;
          oq_warmup_runtime::runtime().cancel(oq_warmup::Status::SETTINGS_CHANGED);

  - platform: template
    id: oq_warmup_step_minutes
    name: "Controlled warmup step time"
    icon: mdi:tune
    unit_of_measurement: "min"
    min_value: 5
    max_value: 120
    step: 5
    initial_value: 45
    optimistic: true
    restore_value: false
    entity_category: config
    on_value:
      - lambda: |-
          if (id(oq_warmup_settings_ready)) id(oq_warmup_settings)[3] = x;
          oq_warmup_runtime::runtime().cancel(oq_warmup::Status::SETTINGS_CHANGED);

  - platform: template
    id: oq_warmup_max_offset_c
    name: "Controlled warmup maximum offset"
    icon: mdi:tune
    unit_of_measurement: "°C"
    min_value: 0.1
    max_value: 2
    step: 0.1
    initial_value: 0.5
    optimistic: true
    restore_value: false
    entity_category: config
    on_value:
      - lambda: |-
          if (id(oq_warmup_settings_ready)) id(oq_warmup_settings)[4] = x;
          oq_warmup_runtime::runtime().cancel(oq_warmup::Status::SETTINGS_CHANGED);

  - platform: template
    id: oq_warmup_max_hours
    name: "Controlled warmup maximum duration"
    icon: mdi:tune
    unit_of_measurement: "h"
    min_value: 1
    max_value: 24
    step: 1
    initial_value: 8
    optimistic: true
    restore_value: false
    entity_category: config
    on_value:
      - lambda: |-
          if (id(oq_warmup_settings_ready)) id(oq_warmup_settings)[5] = x;
          oq_warmup_runtime::runtime().cancel(oq_warmup::Status::SETTINGS_CHANGED);

select:
  - id: !extend room_temp_source
    on_value:
      - lambda: |-
          oq_warmup_runtime::runtime().cancel(oq_warmup::Status::SOURCE_CHANGED);
  - id: !extend room_setpoint_source
    on_value:
      - lambda: |-
          oq_warmup_runtime::runtime().cancel(oq_warmup::Status::SOURCE_CHANGED);
  - id: !extend external_heat_demand_source
    on_value:
      - lambda: |-
          oq_warmup_runtime::runtime().cancel(oq_warmup::Status::MODE_CHANGED);
  - id: !extend heating_supply_target_source
    on_value:
      - lambda: |-
          oq_warmup_runtime::runtime().cancel(oq_warmup::Status::MODE_CHANGED);
  - id: !extend heating_enable_source
    on_value:
      - lambda: |-
          oq_warmup_runtime::runtime().cancel(oq_warmup::Status::SOURCE_CHANGED);

binary_sensor:
  - platform: template
    id: oq_warmup_active
    name: "Controlled warmup active"
    icon: mdi:heat-wave
    entity_category: diagnostic
    lambda: |-
        return oq_warmup_runtime::runtime().active();

sensor:
  - platform: template
    id: oq_warmup_effective_target
    name: "Controlled warmup effective target"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
        return oq_warmup_runtime::runtime().effective_target();
  - platform: template
    id: oq_warmup_offset
    name: "Controlled warmup offset"
    unit_of_measurement: "°C"
    state_class: measurement
    accuracy_decimals: 2
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
        return oq_warmup_runtime::runtime().offset();

text_sensor:
  - platform: template
    id: oq_warmup_status
    name: "Controlled warmup status"
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
        return std::string(oq_warmup_runtime::runtime().status());

# Evaluate independently of demand cadence, including cooling/service/standby.
interval:
  - interval: 1s
    then:
      - lambda: |-
          oq_warmup_runtime::runtime().target(
              (${oq_ot_room_temperature_fresh_expr}), (${oq_ot_room_setpoint_fresh_expr}));
