  - platform: template
    id: ${hp_id}_power_input
    name: "${prefix}Power Input"
    icon: mdi:flash
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      // Keep model coefficients exactly as before; only readability/safety is improved.
      const float standby_power_w = 5.150232354845286f;
      const float compressor_calibration = 1.1240096401010435f;
      const float fan_calibration = -0.04858859969715763f;
      const float bottom_plate_heater_w = 150.06430841218332f;
      const float crankcase_heater_w = 40.0f;

      auto nz = [](float value) -> float { return isnan(value) ? 0.0f : value; };

      const float voltage_v = nz(id(${hp_id}_voltage).state);
      const float current_a = nz(id(${hp_id}_current).state);
      const float fan_speed = nz(id(${hp_id}_fan_speed).state);

      float pump_power_w = 0.0f;
      if (id(${hp_id}_pump_relay).has_state() && id(${hp_id}_pump_relay).state) {
        pump_power_w = nz(id(${hp_id}_pump_power).state);
      }

      const float bottom_plate_w = id(${hp_id}_bottom_plate_heater).state ? bottom_plate_heater_w : 0.0f;
      const float crankcase_w = id(${hp_id}_crankcase_heater).state ? crankcase_heater_w : 0.0f;

      const float p_input_w = standby_power_w
                            + (voltage_v * current_a * compressor_calibration)
                            + (fan_speed * fan_calibration)
                            + pump_power_w
                            + bottom_plate_w
                            + crankcase_w;

      // Physical lower bound: electrical input power cannot be negative.
      return (p_input_w < 0.0f) ? 0.0f : p_input_w;

  - platform: template
    id: ${hp_id}_heat_power
    name: "${prefix}Heat Power"
    icon: mdi:radiator
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      // Heat power follows measured HP working mode (2 = Heating), not supervisory CM.
      const float working_mode = id(${hp_id}_working_mode).state;
      if (working_mode != 2.0f) return 0.0f;

      const float t_in_c = id(${hp_id}_water_in_temp).state;
      const float t_out_c = id(${hp_id}_water_out_temp).state;
      const float flow_lph = id(flow_rate_selected).state;

      if (isnan(t_in_c) || isnan(t_out_c) || isnan(flow_lph)) return 0.0f;

      const float water_cp_j_per_kgk = ${oq_water_cp_j_per_kgk};  // J/(kg·K)
      const float mass_flow_kgps = flow_lph / 3600.0f;  // kg/s (≈ L/h)
      const float delta_t_k = t_out_c - t_in_c;         // K
      return mass_flow_kgps * water_cp_j_per_kgk * delta_t_k;

  - platform: template
    id: ${hp_id}_cooling_power
    name: "${prefix}Cooling Power"
    icon: mdi:snowflake
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      // Cooling power follows measured HP working mode (1 = Cooling), not supervisory CM.
      const float working_mode = id(${hp_id}_working_mode).state;
      if (working_mode != 1.0f) return 0.0f;

      const float t_in_c = id(${hp_id}_water_in_temp).state;
      const float t_out_c = id(${hp_id}_water_out_temp).state;
      const float flow_lph = id(flow_rate_selected).state;

      if (isnan(t_in_c) || isnan(t_out_c) || isnan(flow_lph)) return 0.0f;

      const float water_cp_j_per_kgk = ${oq_water_cp_j_per_kgk};  // J/(kg·K)
      const float mass_flow_kgps = flow_lph / 3600.0f;            // kg/s (≈ L/h)
      const float delta_t_k = t_in_c - t_out_c;                   // K, positive while cooling
      const float cooling_power_w = mass_flow_kgps * water_cp_j_per_kgk * delta_t_k;

      // During startup the water outlet can briefly still be warmer than the inlet.
      // That is not cooling output, so do not expose or integrate it as negative power.
      return (cooling_power_w < 0.0f) ? 0.0f : cooling_power_w;

  - platform: template
    id: ${hp_id}_cop
    name: "${prefix}COP"
    icon: mdi:chart-bell-curve
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      const float p_el_w = id(${hp_id}_power_input).state;
      const float p_th_w = id(${hp_id}_heat_power).state;
      const float min_valid_input_w = 5.0f;

      if (isnan(p_el_w) || isnan(p_th_w)) return NAN;

      // Avoid extreme COP values at (near) 0 W electrical input.
      if (fabsf(p_el_w) < min_valid_input_w) return NAN;

      return p_th_w / p_el_w;

  - platform: template
    id: ${hp_id}_eer
    name: "${prefix}EER"
    icon: mdi:chart-bell-curve
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      const float p_el_w = id(${hp_id}_power_input).state;
      const float p_cool_w = id(${hp_id}_cooling_power).state;
      const float min_valid_input_w = 5.0f;

      if (isnan(p_el_w) || isnan(p_cool_w)) return NAN;

      // Avoid extreme EER values at (near) 0 W electrical input.
      if (fabsf(p_el_w) < min_valid_input_w) return NAN;

      return p_cool_w / p_el_w;

  # Internal raw diagnostic words. We keep these hidden and derive the compact
  # diagnostics we actually use from them instead of exposing dozens of
  # individual Modbus bit entities per heat pump.
  - platform: modbus_controller
    modbus_controller_id: ${hp_id}
    id: ${hp_id}_status_2108_raw
    register_type: holding
    address: 2108
    value_type: U_WORD
    register_count: 2  # 2108-2109; bridge reserved register 2109.
    skip_updates: ${oq_modbus_telemetry_skip}
    internal: true
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            const uint16_t status = static_cast<uint16_t>(lroundf(x));
            id(${hp_id}_fan_low_speed_mode).publish_state((status & 0x0001u) != 0u);
            id(${hp_id}_bottom_plate_heater).publish_state((status & 0x0004u) != 0u);
            id(${hp_id}_crankcase_heater).publish_state((status & 0x0008u) != 0u);
            id(${hp_id}_fan_defrost_mode).publish_state((status & 0x0010u) != 0u);
            id(${hp_id}_fan_high_speed_mode).publish_state((status & 0x0020u) != 0u);
            id(${hp_id}_4_way_valve).publish_state((status & 0x0040u) != 0u);
            id(${hp_id}_pump_relay).publish_state((status & 0x0800u) != 0u);

  - platform: modbus_controller
    modbus_controller_id: ${hp_id}
    id: ${hp_id}_status_2119_raw
    register_type: holding
    address: 2119
    value_type: U_WORD
    skip_updates: ${oq_modbus_telemetry_skip}
    internal: true
    on_value:
      then:
        - lambda: |-
            id(oq_incident_manager).observe_fault_word(
                ${hp_index}, 2119U,
                static_cast<uint16_t>(lroundf(x)), millis());

  - platform: modbus_controller
    modbus_controller_id: ${hp_id}
    id: ${hp_id}_status_2115_raw
    register_type: holding
    # Share the existing 2113-2115 range; byte offset 4 is register R2115.
    address: 2113
    offset: 4
    value_type: U_WORD
    register_count: 3
    skip_updates: ${oq_modbus_telemetry_skip}
    internal: true

  - platform: modbus_controller
    modbus_controller_id: ${hp_id}
    id: ${hp_id}_status_2120_raw
    register_type: holding
    address: 2120
    value_type: U_WORD
    skip_updates: ${oq_modbus_telemetry_skip}
    internal: true
    on_value:
      then:
        - lambda: |-
            id(oq_incident_manager).observe_fault_word(
                ${hp_index}, 2120U,
                static_cast<uint16_t>(lroundf(x)), millis());

  - platform: modbus_controller
    modbus_controller_id: ${hp_id}
    id: ${hp_id}_status_2121_raw
    register_type: holding
    address: 2121
    value_type: U_WORD
    skip_updates: ${oq_modbus_telemetry_skip}
    internal: true
    on_value:
      then:
        - lambda: |-
            // Capture pump evidence only while the ODU reports its pump-related fault bit.
            if (isnan(x)) return;
            const uint32_t now_ms = millis();
            const uint16_t fault_word = static_cast<uint16_t>(lroundf(x));
            if ((fault_word & 0x2000u) != 0u) {
              const bool request_valid = id(${hp_id}_set_pump_mode).has_state();
              const bool request_on = request_valid &&
                  id(${hp_id}_set_pump_mode).current_option() == "On";
              const float relay_raw = id(${hp_id}_status_2108_raw).state;
              const bool relay_valid = !isnan(relay_raw);
              const bool relay_on = relay_valid &&
                  (static_cast<uint16_t>(lroundf(relay_raw)) & 0x0800u) != 0u;
              const float flow_switch_raw = id(${hp_id}_status_2115_raw).state;
              const bool flow_switch_valid = !isnan(flow_switch_raw);
              const bool flow_switch_on = flow_switch_valid &&
                  (static_cast<uint16_t>(lroundf(flow_switch_raw)) & 0x2000u) != 0u;
              const float feedback_raw = id(${hp_id}_pump_ipwm_feedback_raw).state;
              const bool feedback_valid = !isnan(feedback_raw);
              const float flow_lph = id(${hp_id}_flow).state;
              id(oq_incident_manager).observe_pump_context(
                  ${hp_index}, request_valid, request_on, relay_valid, relay_on,
                  flow_switch_valid, flow_switch_on, feedback_valid,
                  feedback_valid ? static_cast<uint16_t>(lroundf(feedback_raw)) : 0U,
                  !isnan(flow_lph), flow_lph);
            }
            id(oq_incident_manager).observe_fault_word(
                ${hp_index}, 2121U, fault_word, now_ms);

