# ==============================================================================
# OpenQuatt – Per-HP Modbus Control & Entities
# ==============================================================================
#
# Goal:
#   Defines per-heat-pump Modbus registers, sensors, and actuators used by other packages.
#
# Role in architecture:
#   Hardware abstraction layer: exposes consistent entities for heat/flow/supervisory/power.
#
# What this package DOES do:
#   - Defines Modbus entities for HP1/HP2 (temperatures, pressures, status bits, etc.)
#   - Defines actuators (set_working_mode, compressor level select, etc.)
#   - Groups diagnostic entities for web_server/HA
#
# What this package DOES NOT do:
#   - Implements no system logic (no CM state machine, no split, no interlocks)
#   - Implements no PID/climate control
#
# Key assumptions:
#   - Modbus mapping matches the Quatt firmware/registers
#   - Entities are correctly used with their expected types elsewhere (select vs sensor vs text_sensor)
#
# Safety / fail-safe:
#   - Actuators are only controlled by the owner packages (heat-control/supervisory).
#
# ==============================================================================

esphome:
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // Runtime identity is deliberately not restored across boots.
          id(${hp_id}_odu_generation_detection_complete) = false;
          id(${hp_id}_odu_generation_request_pending) = false;
          id(${hp_id}_odu_generation_request_token) = 0U;
          id(${hp_id}_generation).publish_state("Unknown");
          id(${hp_id}_generation_variant_code) =
              static_cast<int>(oq_odu::Variant::UNKNOWN);
          id(${hp_id}_runtime_frequency_snapshot_storage) = {};
          id(${hp_id}_compressor_level_profile_request_pending) = false;
          id(${hp_id}_compressor_level_profile_request_token) = 0U;
          id(${hp_id}_runtime_frequency_retry_ms) = 0U;
          id(${hp_id}_compressor_level_profile).publish_state(
              oq_odu::compressor_level_profile_label(
                  oq_odu::CompressorLevelProfile::UNKNOWN));
          id(${hp_id}_generation_variant).publish_state("Unknown");
          id(${hp_id}_customer_model_code).publish_state("Unknown");
      - lambda: |-
          // The HP1 package owns restoration of the four shared caps so this
          // also works before a runtime ODU table is available.
          if (${hp_index} != 1) return;
          const auto &storage = id(oq_frequency_caps_migrated);
          auto restore_cap = [&](auto* number,
                                 oq_frequency_policy::StorageIndex index,
                                 uint8_t flag) {
            if (!oq_frequency_policy::storage_has_migration(storage, flag))
              return;
            number->publish_state(oq_frequency_policy::stored_frequency_hz(
                storage, index, 120));
          };
          restore_cap(id(oq_day_heating_max_frequency_hz),
                      oq_frequency_policy::DAY_HEATING_MAX_HZ,
                      oq_frequency_policy::DAY_HEATING_CAP_MIGRATED);
          restore_cap(id(oq_day_cooling_max_frequency_hz),
                      oq_frequency_policy::DAY_COOLING_MAX_HZ,
                      oq_frequency_policy::DAY_COOLING_CAP_MIGRATED);
          restore_cap(id(oq_silent_heating_max_frequency_hz),
                      oq_frequency_policy::SILENT_HEATING_MAX_HZ,
                      oq_frequency_policy::SILENT_HEATING_CAP_MIGRATED);
          restore_cap(id(oq_silent_cooling_max_frequency_hz),
                      oq_frequency_policy::SILENT_COOLING_MAX_HZ,
                      oq_frequency_policy::SILENT_COOLING_CAP_MIGRATED);
      - lambda: |-
          // Restore this HP's eight range endpoints from the shared blob.
          const auto &storage = id(oq_frequency_caps_migrated);
          if (!oq_frequency_policy::storage_has_migration(
                  storage,
                  oq_frequency_policy::exclusions_migrated_flag(
                      ${hp_index})))
            return;
          auto publish_stored = [&](auto* number,
                                    oq_frequency_policy::StorageIndex hp1_index) {
            number->publish_state(oq_frequency_policy::stored_frequency_hz(
                storage,
                oq_frequency_policy::storage_index_for_hp(
                    ${hp_index}, hp1_index),
                0));
          };
          publish_stored(id(${hp_id}_excluded_heating_range_a_min_hz),
                         oq_frequency_policy::HP1_HEATING_A_MIN_HZ);
          publish_stored(id(${hp_id}_excluded_heating_range_a_max_hz),
                         oq_frequency_policy::HP1_HEATING_A_MAX_HZ);
          publish_stored(id(${hp_id}_excluded_heating_range_b_min_hz),
                         oq_frequency_policy::HP1_HEATING_B_MIN_HZ);
          publish_stored(id(${hp_id}_excluded_heating_range_b_max_hz),
                         oq_frequency_policy::HP1_HEATING_B_MAX_HZ);
          publish_stored(id(${hp_id}_excluded_cooling_range_a_min_hz),
                         oq_frequency_policy::HP1_COOLING_A_MIN_HZ);
          publish_stored(id(${hp_id}_excluded_cooling_range_a_max_hz),
                         oq_frequency_policy::HP1_COOLING_A_MAX_HZ);
          publish_stored(id(${hp_id}_excluded_cooling_range_b_min_hz),
                         oq_frequency_policy::HP1_COOLING_B_MIN_HZ);
          publish_stored(id(${hp_id}_excluded_cooling_range_b_max_hz),
                         oq_frequency_policy::HP1_COOLING_B_MAX_HZ);
      - script.execute: ${hp_id}_detect_odu_generation_once

# ----------------------------
# MODBUS CONTROLLER
# ----------------------------
modbus_controller:
  - id: ${hp_id}
    address: ${device_address}
    modbus_id: mod_bus
    update_interval: never
    max_cmd_retries: ${oq_modbus_max_cmd_retries}
    offline_skip_updates: 5
    setup_priority: -10
    on_offline:
      then:
        - lambda: |-
            id(${hp_id}_is_online) = false;
            // A reconnected controller may belong to different ODU hardware.
            id(${hp_id}_odu_generation_request_token) =
                oq_odu::next_request_token(
                    id(${hp_id}_odu_generation_request_token));
            id(${hp_id}_odu_generation_request_pending) = false;
            id(${hp_id}_odu_generation_detection_complete) = false;
            id(${hp_id}_generation_variant_code) =
                static_cast<int>(oq_odu::Variant::UNKNOWN);
            id(${hp_id}_runtime_frequency_snapshot_storage) = {};
            id(${hp_id}_compressor_level_profile_request_token) =
                oq_odu::next_request_token(
                    id(${hp_id}_compressor_level_profile_request_token));
            id(${hp_id}_compressor_level_profile_request_pending) = false;
            id(${hp_id}_runtime_frequency_retry_ms) = 0U;
            ++id(${hp_id}_runtime_frequency_write_operation_token);
            if (id(${hp_id}_runtime_frequency_write_verification_pending)) {
              id(${hp_id}_runtime_frequency_write_verification_pending) = false;
              id(${hp_id}_odu_runtime_frequency_table_status)
                  ->publish_state("VERIFY_FAILED: ODU disconnected during write");
            }
            id(${hp_id}_compressor_level_profile).publish_state(
                oq_odu::compressor_level_profile_label(
                    oq_odu::CompressorLevelProfile::UNKNOWN));
            id(${hp_id}_generation).publish_state("Unknown");
            id(${hp_id}_generation_variant).publish_state("Unknown");
            id(${hp_id}_pump_relay).invalidate_state();
            id(${hp_id}_status_2108_raw).publish_state(NAN);
            id(${hp_id}_status_2115_raw).publish_state(NAN);
            id(${hp_id}_pump_ipwm_feedback_raw).publish_state(NAN);
            id(oq_incident_manager).observe_transport(${hp_index}, false, millis());
            ESP_LOGW("quatt", "%sModbus OFFLINE", "${prefix}");
    on_online:
      then:
        - lambda: |-
            id(${hp_id}_is_online) = true;
            id(oq_incident_manager).observe_transport(${hp_index}, true, millis());
            ESP_LOGI("quatt", "%sModbus ONLINE", "${prefix}");
        - script.execute: ${hp_id}_detect_odu_generation_once

openquatt_odu_eeprom_dump:
  - id: ${hp_id}_odu_eeprom_dump
    controller: ${hp_id}
    clock: oq_time
    web_auth: oq_web_auth_store
    hp_index: ${hp_index}
    device_address: ${device_address}

# ----------------------------
# GLOBALS
# ----------------------------
globals:
  # Runtime counter (minutes)
  - id: ${hp_id}_minutes
    type: int
    restore_value: true
    initial_value: '0'

  # Last stop timestamp (millis since boot) for min-runtime logic
  - id: ${hp_id}_last_stop_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # Last start timestamp (millis since boot) for min-runtime logic
  - id: ${hp_id}_last_start_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # Last applied levels (for start/stop logging)
  - id: ${hp_id}_last_applied_level
    type: int
    restore_value: false
    initial_value: '0'

  # Last physical F-level written to register 1999. Control bookkeeping above
  # deliberately remains in the independent 0..10 model-level domain.
  - id: ${hp_id}_last_commanded_physical_level
    type: int
    restore_value: false
    initial_value: '0'

  - id: ${hp_id}_outside_temp_last_change_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  - id: ${hp_id}_outside_temp_activity_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  - id: ${hp_id}_water_out_temp_last_update_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  - id: ${hp_id}_voltage_last_update_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  - id: ${hp_id}_current_last_update_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # Modbus controller online/offline
  - id: ${hp_id}_is_online
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: ${hp_id}_last_offline_probe_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # ODU generation is sampled once per boot or explicit detection request.
  # Generation alone never enables generation-dependent behavior.
  - id: ${hp_id}_odu_generation_detection_complete
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: ${hp_id}_odu_generation_request_pending
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: ${hp_id}_odu_generation_request_token
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: ${hp_id}_generation_variant_code
    type: int
    restore_value: no
    initial_value: '0'

  # Immutable control snapshot built from the read-only runtime frequency
  # table. It is never restored across boots or reconnects.
  - id: ${hp_id}_runtime_frequency_snapshot_storage
    type: std::array<uint8_t, 46>
    restore_value: no
    initial_value: 'std::array<uint8_t, 46>{}'

  - id: ${hp_id}_compressor_level_profile_request_pending
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: ${hp_id}_compressor_level_profile_request_token
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: ${hp_id}_runtime_frequency_retry_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # Set while an experimental runtime-table write has not passed its own
  # readback verification. Generic retries must not accept mixed values.
  - id: ${hp_id}_runtime_frequency_reload_blocked_after_write
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: ${hp_id}_runtime_frequency_write_verification_pending
    type: bool
    restore_value: no
    initial_value: 'false'

  # Invalidates delayed Modbus callbacks after an editor write timeout.
  - id: ${hp_id}_runtime_frequency_write_operation_token
    type: uint32_t
    restore_value: no
    initial_value: '0'

# ----------------------------
# ODU GENERATION DETECTION
# ----------------------------
script:
  - id: ${hp_id}_detect_odu_generation_once
    mode: restart
    then:
      - lambda: |-
          const uint32_t request_token =
              oq_odu::next_request_token(id(${hp_id}_odu_generation_request_token));
          id(${hp_id}_odu_generation_request_token) = request_token;
          id(${hp_id}_runtime_frequency_retry_ms) =
              millis() == 0U ? 1U : millis();
          id(${hp_id}_odu_generation_detection_complete) = false;
          id(${hp_id}_odu_generation_request_pending) = true;
          id(${hp_id}_generation).publish_state("Unknown");
          id(${hp_id}_generation_variant_code) =
              static_cast<int>(oq_odu::Variant::UNKNOWN);
          id(${hp_id}_compressor_level_profile_request_token) =
              oq_odu::next_request_token(
                  id(${hp_id}_compressor_level_profile_request_token));
          id(${hp_id}_compressor_level_profile_request_pending) = false;
          id(${hp_id}_generation_variant).publish_state("Unknown");
          id(${hp_id}_customer_model_code).publish_state("Unknown");

          // Do not interleave an identity request with an operation that owns the Modbus bus.
          if (id(${hp_id}_odu_eeprom_dump).is_active() || id(oq_runtime_polling_paused).state) {
            id(${hp_id}_odu_generation_request_pending) = false;
            id(${hp_id}_odu_generation_detection_complete) = false;
            ESP_LOGW("quatt.odu", "%sODU generation detection blocked while runtime polling is paused", "${prefix}");
            return;
          }

          auto command = esphome::modbus_controller::ModbusCommandItem::create_read_command(
              id(${hp_id}), esphome::modbus::EntityType::HOLDING,
              oq_odu::CORE_IDENTITY_REGISTER,
              oq_odu::CORE_IDENTITY_REGISTER_COUNT,
              [=](esphome::modbus::EntityType, uint16_t start_address,
                  std::span<const uint8_t> data) {
                if (request_token != id(${hp_id}_odu_generation_request_token) ||
                    !id(${hp_id}_odu_generation_request_pending) ||
                    start_address != oq_odu::CORE_IDENTITY_REGISTER) {
                  return;
                }

                const auto core = oq_odu::parse_core_identity_response(
                    data.data(), data.size());
                if (!core.available) {
                  id(${hp_id}_odu_generation_detection_complete) = false;
                  id(${hp_id}_odu_generation_request_pending) = false;
                  ESP_LOGW("quatt.odu", "%sODU core identity response incomplete", "${prefix}");
                  return;
                }

                // Keep the periodic raw diagnostic entities coherent with this
                // explicit atomic identity snapshot.
                id(${hp_id}_pcb_firmware_raw).publish_state(core.pcb_program);
                id(${hp_id}_control_board_item).publish_state(core.control_board_item);

                auto apply_detected_variant = [=](oq_odu::Variant detected_variant) {
                  const auto active_snapshot =
                      oq_odu::decode_runtime_frequency_snapshot(
                          id(${hp_id}_runtime_frequency_snapshot_storage));
                  if (active_snapshot.variant == detected_variant) return;

                  oq_odu::RuntimeFrequencySnapshot pending_snapshot;
                  pending_snapshot.variant = detected_variant;
                  id(${hp_id}_runtime_frequency_snapshot_storage) =
                      oq_odu::encode_runtime_frequency_snapshot(
                          pending_snapshot);
                  id(${hp_id}_compressor_level_profile).publish_state(
                      oq_odu::compressor_level_profile_label(
                          oq_odu::CompressorLevelProfile::UNKNOWN));
                };

                if (!oq_odu::requires_customer_model(core)) {
                  const auto detection = oq_odu::detect_generation(core);
                  apply_detected_variant(detection.variant);
                  id(${hp_id}_customer_model_code).publish_state("Not read");
                  id(${hp_id}_generation_variant_code) =
                      static_cast<int>(detection.variant);
                  id(${hp_id}_generation_variant).publish_state(
                      oq_odu::variant_label(detection.variant));
                  id(${hp_id}_generation).publish_state(
                      oq_odu::generation_label(detection.generation));
                  id(${hp_id}_odu_generation_detection_complete) = true;
                  id(${hp_id}_odu_generation_request_pending) = false;
                  id(${hp_id}_load_runtime_frequency_table_once).execute();
                  return;
                }

                auto customer_model_command =
                    esphome::modbus_controller::ModbusCommandItem::create_read_command(
                        id(${hp_id}), esphome::modbus::EntityType::HOLDING,
                        oq_odu::CUSTOMER_MODEL_REGISTER,
                        oq_odu::CUSTOMER_MODEL_REGISTER_COUNT,
                        [=](esphome::modbus::EntityType,
                            uint16_t customer_model_start_address,
                            std::span<const uint8_t> customer_model_data) {
                          if (request_token !=
                                  id(${hp_id}_odu_generation_request_token) ||
                              !id(${hp_id}_odu_generation_request_pending) ||
                              customer_model_start_address !=
                                  oq_odu::CUSTOMER_MODEL_REGISTER) {
                            return;
                          }

                          const auto customer_model =
                              oq_odu::parse_customer_model_response(
                                  customer_model_data.data(),
                                  customer_model_data.size());
                          id(${hp_id}_customer_model_code).publish_state(
                              oq_odu::customer_model_label(customer_model));
                          const auto detection =
                              oq_odu::detect_generation(core, customer_model);
                          if (customer_model.available) {
                            apply_detected_variant(detection.variant);
                          }
                          id(${hp_id}_generation_variant_code) =
                              static_cast<int>(detection.variant);
                          id(${hp_id}_generation_variant).publish_state(
                              oq_odu::variant_label(detection.variant));
                          id(${hp_id}_generation).publish_state(
                              oq_odu::generation_label(detection.generation));
                          id(${hp_id}_odu_generation_detection_complete) =
                              customer_model.available;
                          id(${hp_id}_odu_generation_request_pending) = false;
                          if (!customer_model.available) {
                            ESP_LOGW("quatt.odu",
                                     "%sODU customer model response incomplete",
                                     "${prefix}");
                          }
                          if (customer_model.available) {
                            id(${hp_id}_load_runtime_frequency_table_once).execute();
                          }
                        });
                id(${hp_id}).queue_command(std::move(customer_model_command));
              });
          id(${hp_id}).queue_command(std::move(command));
      - delay: 30s
      - lambda: |-
          if (!id(${hp_id}_odu_generation_request_pending)) return;

          // Reject a response that arrives after this bounded request window.
          id(${hp_id}_odu_generation_request_token) =
              oq_odu::next_request_token(id(${hp_id}_odu_generation_request_token));
          id(${hp_id}_odu_generation_request_pending) = false;
          id(${hp_id}_odu_generation_detection_complete) = false;
          ESP_LOGW("quatt.odu", "%sODU generation detection timed out", "${prefix}");

  - id: ${hp_id}_load_runtime_frequency_table_once
    mode: restart
    then:
      - lambda: |-
          if (id(${hp_id}_runtime_frequency_reload_blocked_after_write)) {
            ESP_LOGW("quatt.odu", "%sRuntime frequency table reload blocked until experimental write verification succeeds", "${prefix}");
            return;
          }
          const uint32_t request_token =
              oq_odu::next_request_token(
                  id(${hp_id}_compressor_level_profile_request_token));
          id(${hp_id}_compressor_level_profile_request_token) = request_token;
          id(${hp_id}_runtime_frequency_retry_ms) =
              millis() == 0U ? 1U : millis();
          id(${hp_id}_compressor_level_profile_request_pending) = true;
          const auto variant = static_cast<oq_odu::Variant>(
              id(${hp_id}_generation_variant_code));

          // Keep runtime table loading read-only and do not interleave it with
          // a task that temporarily owns the Modbus bus.
          if (id(${hp_id}_odu_eeprom_dump).is_active() ||
              id(oq_runtime_polling_paused).state) {
            id(${hp_id}_compressor_level_profile_request_pending) = false;
            ESP_LOGW("quatt.odu", "%sRuntime frequency table load blocked while runtime polling is paused", "${prefix}");
            return;
          }
          auto command =
              esphome::modbus_controller::ModbusCommandItem::create_read_command(
                  id(${hp_id}), esphome::modbus::EntityType::HOLDING,
                  oq_odu::BASE_FREQUENCY_TABLE_REGISTER,
                  oq_odu::BASE_FREQUENCY_TABLE_REGISTER_COUNT,
                  [=](esphome::modbus::EntityType, uint16_t start_address,
                      std::span<const uint8_t> data) {
                    if (request_token !=
                            id(${hp_id}_compressor_level_profile_request_token) ||
                        !id(${hp_id}_compressor_level_profile_request_pending) ||
                        start_address !=
                            oq_odu::BASE_FREQUENCY_TABLE_REGISTER) {
                      return;
                    }

                    const auto previous_snapshot =
                        oq_odu::decode_runtime_frequency_snapshot(
                            id(${hp_id}_runtime_frequency_snapshot_storage));
                    auto snapshot = oq_odu::parse_base_frequency_table_response(
                        data.data(), data.size(), variant);
                    if (!snapshot.heating.valid && !snapshot.cooling.valid) {
                      id(${hp_id}_compressor_level_profile_request_pending) = false;
                      ESP_LOGW("quatt.odu", "%sRuntime frequency base table invalid; keeping previous snapshot", "${prefix}");
                      return;
                    }

                    const bool defer_base_publish =
                        variant == oq_odu::Variant::V2_NEW_MODEL &&
                        previous_snapshot.variant == variant &&
                        (previous_snapshot.heating.valid ||
                         previous_snapshot.cooling.valid);
                    if (!defer_base_publish) {
                      id(${hp_id}_runtime_frequency_snapshot_storage) =
                          oq_odu::encode_runtime_frequency_snapshot(snapshot);
                      const auto profile =
                          oq_odu::compressor_level_profile(snapshot);
                      id(${hp_id}_compressor_level_profile).publish_state(
                          oq_odu::compressor_level_profile_label(profile));
                    }
                    if (!snapshot.heating.valid || !snapshot.cooling.valid) {
                      ESP_LOGW("quatt.odu", "%sRuntime frequency base table partially invalid", "${prefix}");
                    }

                    if (variant != oq_odu::Variant::V2_NEW_MODEL) {
                      id(${hp_id}_compressor_level_profile_request_pending) = false;
                      return;
                    }

                    auto extension_command =
                        esphome::modbus_controller::ModbusCommandItem::create_read_command(
                            id(${hp_id}), esphome::modbus::EntityType::HOLDING,
                            oq_odu::EXTENDED_FREQUENCY_TABLE_REGISTER,
                            oq_odu::EXTENDED_FREQUENCY_TABLE_REGISTER_COUNT,
                            [=](esphome::modbus::EntityType,
                                uint16_t extension_start_address,
                                std::span<const uint8_t> extension_data) {
                              if (request_token !=
                                      id(${hp_id}_compressor_level_profile_request_token) ||
                                  !id(${hp_id}_compressor_level_profile_request_pending) ||
                                  extension_start_address !=
                                      oq_odu::EXTENDED_FREQUENCY_TABLE_REGISTER) {
                                return;
                              }

                              auto extended_snapshot = snapshot;
                              const auto extension_result =
                                  oq_odu::apply_v2_extension_frequency_table_response(
                                      extended_snapshot,
                                      extension_data.data(),
                                      extension_data.size());
                              if (!extension_result.response_complete) {
                                id(${hp_id}_compressor_level_profile_request_pending) =
                                    false;
                                ESP_LOGW("quatt.odu", "%sV2 runtime frequency extension response incomplete; keeping previous snapshot", "${prefix}");
                                return;
                              }
                              id(${hp_id}_runtime_frequency_snapshot_storage) =
                                  oq_odu::encode_runtime_frequency_snapshot(
                                      extended_snapshot);
                              const auto extended_profile =
                                  oq_odu::compressor_level_profile(
                                      extended_snapshot);
                              id(${hp_id}_compressor_level_profile).publish_state(
                                  oq_odu::compressor_level_profile_label(
                                      extended_profile));
                              id(${hp_id}_compressor_level_profile_request_pending) =
                                  false;
                              if (!extension_result.heating_valid ||
                                  !extension_result.cooling_valid) {
                                ESP_LOGW("quatt.odu", "%sV2 runtime frequency extension partially invalid; affected mode limited to F10", "${prefix}");
                              }
                            });
                    id(${hp_id}).queue_command(std::move(extension_command));
                  });
          id(${hp_id}).queue_command(std::move(command));
      - delay: 30s
      - lambda: |-
          if (!id(${hp_id}_compressor_level_profile_request_pending)) return;

          id(${hp_id}_compressor_level_profile_request_token) =
              oq_odu::next_request_token(
                  id(${hp_id}_compressor_level_profile_request_token));
          id(${hp_id}_compressor_level_profile_request_pending) = false;
          ESP_LOGW("quatt.odu", "%sRuntime frequency table load timed out; keeping last validated snapshot", "${prefix}");

button:
