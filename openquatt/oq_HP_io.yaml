    name: "${prefix}Set Pump Speed"
    internal: true
    icon: "mdi:speedometer"
    register_type: holding
    address: 2015
    value_type: U_WORD
    min_value: 0
    max_value: 1000
    mode: slider
    skip_updates: ${oq_modbus_control_readback_skip}

# ----------------------------
# SENSOR
# ----------------------------
sensor:
  - platform: template
    id: ${hp_id}_pump_ipwm_command
    name: "${prefix}Pump iPWM command"
    icon: "mdi:speedometer"
    unit_of_measurement: "iPWM"
    state_class: "measurement"
    accuracy_decimals: 0
    update_interval: 30s
    force_update: true
    lambda: |-
      const float pump_speed = id(${hp_id}_pump_speed).state;
      if (isnan(pump_speed)) return {};
      return pump_speed;

  - platform: modbus_controller
    modbus_controller_id: ${hp_id}
    id: ${hp_id}_working_mode
    name: "${prefix}Working Mode"
    icon: mdi:heat-pump-outline
    state_class: measurement
    register_type: holding
    address: 2099
    skip_updates: ${oq_modbus_telemetry_skip}
    on_value:
      then:
        - lambda: |-
            id(${hp_id}_outside_temp_activity_ms) = millis();
            id(oq_incident_manager).observe_working_mode(
                ${hp_index}, x, millis());

  - platform: modbus_controller
    modbus_controller_id: ${hp_id}
    id: ${hp_id}_voltage
    name: "${prefix}AC voltage"
    icon: mdi:flash
    disabled_by_default: true
    register_type: holding
    address: 2100
    unit_of_measurement: "V"
    device_class: "voltage"
    state_class: "measurement"
    accuracy_decimals: 1
    filters:
      - multiply: 1
      - clamp:
          min_value: 0
          max_value: 300
          ignore_out_of_range: true
    skip_updates: ${oq_modbus_telemetry_skip}
    on_value:
      then:
        - lambda: |-
            id(${hp_id}_voltage_last_update_ms) = millis();

  - platform: modbus_controller
    modbus_controller_id: ${hp_id}
    id: ${hp_id}_current
    name: "${prefix}AC current"
    icon: mdi:current-ac
    disabled_by_default: true
    register_type: holding
    address: 2101
    unit_of_measurement: "A"
    device_class: "current"
    state_class: "measurement"
    accuracy_decimals: 2
    filters:
      - multiply: 0.1
      - clamp:
          min_value: 0
          max_value: 16
          ignore_out_of_range: true
    skip_updates: ${oq_modbus_telemetry_skip}
    on_value:
      then:
        - lambda: |-
            id(${hp_id}_current_last_update_ms) = millis();

  - platform: modbus_controller
    modbus_controller_id: ${hp_id}
    id: ${hp_id}_compressor_frequency_demand
    name: "${prefix}Compressor frequency demand"
    icon: mdi:sine-wave
    register_type: holding
    address: 2102
    unit_of_measurement: "Hz"
    device_class: "frequency"
    state_class: "measurement"
    accuracy_decimals: 0
    filters:
      - multiply: 1
      - clamp:
          min_value: 0
          max_value: 120
          ignore_out_of_range: true
    skip_updates: ${oq_modbus_telemetry_skip}

  - platform: modbus_controller
    modbus_controller_id: ${hp_id}
    id: ${hp_id}_compressor_frequency
    name: "${prefix}Compressor frequency"
    icon: mdi:sine-wave
    register_type: holding
    address: 2103
    unit_of_measurement: "Hz"
    device_class: "frequency"
    state_class: "measurement"
    accuracy_decimals: 0
    filters:
      - multiply: 1
      - clamp:
          min_value: 0
          max_value: 120
          ignore_out_of_range: true
    skip_updates: ${oq_modbus_telemetry_skip}
    on_value:
      then:
        - lambda: |-
            id(oq_incident_manager).observe_compressor_frequency(
                ${hp_index}, x, millis());
            if (oq_diagnostics::installation_monitor().observe_compressor_frequency(
                    ${hp_index}, x, millis())) {
              ESP_LOGI("oq_diag", "%sMeasured compressor start.", "${prefix}");
              id(oq_capture_compressor_cycling_alert).execute();
            }

  - platform: modbus_controller
