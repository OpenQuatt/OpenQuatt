  # TEXT SENSOR
  # ----------------------------
text_sensor:
  - platform: template
    id: ${hp_id}_generation
    name: "${prefix}ODU generation"
    internal: true
    icon: mdi:heat-pump-outline
    entity_category: diagnostic
    update_interval: never

  - platform: template
