        read_lambda: return oq_cic::read(oq_cic::scaled(id(${cic_compat_hp_id}_pump_ipwm_feedback_raw).state));
      - address: 2138
        value_type: U_WORD
        read_lambda: return oq_cic::read(oq_cic::flow(id(${cic_compat_hp_id}_flow).state));
      - address: 11006
