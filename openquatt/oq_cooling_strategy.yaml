    type: bool
    restore_value: false
    initial_value: 'false'

  - id: oq_cooling_min_off_stop_pending
    type: bool
    restore_value: false
    initial_value: 'false'

  # 0=idle, 1=owner_hp1, 2=owner_hp2
  - id: oq_cooling_request_reason_code
    type: int
    restore_value: false
    initial_value: '0'

