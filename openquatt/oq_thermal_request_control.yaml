# ==============================================================================
# OpenQuatt - Thermal Request Control
# ==============================================================================
#
# Goal:
#   Consume strategy outputs, publish an explicit thermal request interface,
#   and prepare final actuator requests for HP1/HP2.
#
# Role in architecture:
#   Owns shared thermal-request control between strategy modules and the
#   downstream thermal actuator.
#
# What this package DOES do:
#   - Consumes oq_demand_raw (published by oq_strategy_manager)
#   - Consumes strategy outputs from oq_cooling_strategy / oq_heating_curve_strategy / oq_power_house_strategy
#   - Applies demand filtering to damp noise/jitter in heat demand
#   - Applies caps/limits on `f` before split
#   - Publishes `oq_request_*` as the explicit pre-actuator request interface
#   - Publishes finalized actuator requests for the downstream thermal actuator
#   - Owns shared request filtering, caps, guards, and actuator input logic
#   - Consumes shared HP capacity/deficit (`oq_P_hp_cap_w`, `oq_P_deficit_w`) for supervisory/debug logic
#
# What this package DOES NOT do:
#   - Has no dedicated temperature PID loop (strategy owns temperature-loop behavior)
#   - Does not implement flow interlock (flow-control + supervisory are leading)
#   - Does not determine Control Mode
#   - Does not control boiler directly (boiler follows CM3/CM4)
#   - Does not write HP working mode or compressor levels directly
#
# Key assumptions:
#   - `oq_demand_raw` is available from strategy and scaled to `f` range (0-20)
#   - Compressor levels are `select` entities with options '0'..'10'
#
# Interaction with Control Modes:
#   - Active in CM2/CM3 (heating)
#   - In CM0/CM1/CM4/CM98/CM100, compressor levels are forced to 0
#
# Safety / fail-safe:
#   - With inactive CM: compressor levels 0 (no heat production)
#   - Thermal request control is always subordinate to flow interlock via CM1
#
# Notes:
#   - Demand filter and runtime guards intentionally favor stability over fast level changes.
#   - This file now mixes:
#     1) shared gating / runtime anchors
#     2) explicit request-interface publication
#     3) final actuator-request preparation and safety gating
#
# ==============================================================================

# ----------------------------
# INTERNAL STATE
# ----------------------------
globals:
  # Explicit pre-actuator thermal request interface.
  - id: oq_request_mode_code
    type: int
    restore_value: false
    initial_value: '0'

  - id: oq_request_hp1_level
    type: int
    restore_value: false
    initial_value: '0'

  - id: oq_request_hp2_level
    type: int
    restore_value: false
    initial_value: '0'

  - id: oq_request_owner_hp
    type: int
    restore_value: false
    initial_value: '0'

  - id: oq_request_topology_code
    type: int
    restore_value: false
    initial_value: '0'

  - id: oq_request_strategy_code
    type: int
    restore_value: false
    initial_value: '0'

  # Final per-HP requests consumed by oq_thermal_actuator.
  - id: oq_actuator_hp1_req
    type: int
    restore_value: false
    initial_value: '0'

  - id: oq_actuator_hp2_req
    type: int
    restore_value: false
    initial_value: '0'

  # Shared filtered demand owned by the active strategy module.
  - id: oq_demand_filtered
    type: int
    restore_value: false
    initial_value: '0'

  # Previous filtered demand sample published by the active strategy module.
  - id: oq_demand_filtered_prev
    type: int
    restore_value: false
    initial_value: '0'

  # Shared heating-only filtered demand, kept separate from CM5 cooling demand.
  - id: oq_heating_demand_filtered
    type: int
    restore_value: false
    initial_value: '0'

  # Power House telemetry (W)
  - id: oq_P_hp_cap_w
    type: float
    restore_value: false
    initial_value: '0.0'

  - id: oq_P_deficit_w
    type: float
    restore_value: false
    initial_value: '0.0'

  # Shared curve request state, currently published by the curve strategy.
  - id: oq_dual_hp_enabled
    type: bool
    restore_value: false
    initial_value: 'false'

  # Fractional elapsed minutes for dual-enable hold timing.
  - id: oq_dual_hp_enable_hold_elapsed_accum_min
    type: float
    restore_value: false
    initial_value: '0.0'
  - id: oq_dual_hp_disable_hold_elapsed_accum_min
    type: float
    restore_value: false
    initial_value: '0.0'

  # Emergency dual-enable hold timing (curve mode capacity/deficit override).
  - id: oq_dual_hp_emergency_hold_elapsed_accum_min
    type: float
    restore_value: false
    initial_value: '0.0'

  # Last loop timestamp for elapsed-time scaling.
  - id: oq_heat_last_loop_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # Last control flavor observed by heat-control loop (0=Power House, 1=Heating Curve, 2=Cooling).
  - id: oq_heat_last_mode_code
    type: int
    restore_value: false
    initial_value: '-1'

  # Fractional runtime accumulation; converted to whole minutes.
  - id: hp1_runtime_accum_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: hp2_runtime_accum_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # Per-HP timestamp of the last measured transition into working_mode=Heating.
  # Minimum runtime is enforced from this real heating start, not from an earlier
  # request/apply transition that can happen before the compressor truly runs.
  - id: hp1_last_real_heat_start_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: hp2_last_real_heat_start_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: hp1_prev_heating_mode_active
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: hp2_prev_heating_mode_active
    type: bool
    restore_value: false
    initial_value: 'false'

  # Diagnostic: last computed lead pump based on runtime minutes.
  - id: oq_last_lead_hp
    type: int
    restore_value: false
    initial_value: '0'

  # Latched single-HP owner in heating-curve mode (0=none, 1=HP1, 2=HP2).
  # This prevents lead handovers while demand is continuously active.
  - id: oq_curve_single_owner_hp
    type: int
    restore_value: false
    initial_value: '0'

  # Per-HP timestamp for explicit level slew limiting.
  - id: hp1_last_level_change_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: hp2_last_level_change_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # Holds the current single-vs-dual choice briefly after an actual topology change.
  - id: oq_duo_request_hold_until_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: oq_boot_startup_inhibit_logged
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: oq_boot_startup_inhibit_cleared_logged
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: oq_boot_startup_inhibit_event_active
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: oq_boot_startup_inhibit_event_started_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: oq_boot_startup_inhibit_event_subject
    type: uint8_t
    restore_value: false
    initial_value: '0'
  - id: oq_boot_startup_inhibit_event_mode
    type: uint8_t
    restore_value: false
    initial_value: '0'

# ----------------------------
# TUNING INPUTS
# ----------------------------
number:
  - platform: template
    id: oq_min_runtime_min
    name: "Minimum runtime"
    icon: mdi:timer-cog-outline
    entity_category: config
    unit_of_measurement: "s"
    min_value: 300
    max_value: 3600
    step: 30
    mode: slider
    restore_value: true
    optimistic: true
    initial_value: 300

  # Hold time before enabling dual-HP in curve mode.
  - platform: template
    id: oq_dual_hp_enable_hold_min
    name: "Dual HP Enable Hold"
    internal: ${hc_dual_tuning_internal}
    disabled_by_default: true
    entity_category: config
    icon: mdi:timer-plus-outline
    unit_of_measurement: "min"
    min_value: 1
    max_value: 60
    step: 1
    mode: slider
    restore_value: true
    optimistic: true
    initial_value: 3

  # Hold time before disabling dual-HP in curve mode.
  - platform: template
    id: oq_dual_hp_disable_hold_min
    name: "Dual HP Disable Hold"
    internal: ${hc_dual_tuning_internal}
    disabled_by_default: true
    entity_category: config
    icon: mdi:timer-minus-outline
    unit_of_measurement: "min"
    min_value: 1
    max_value: 60
    step: 1
    mode: slider
    restore_value: true
    optimistic: true
    initial_value: 5

# ----------------------------
# BUTTON
# ----------------------------
button:
  - platform: template
    id: oq_reset_runtime
    name: "${hc_runtime_reset_button_name}"
    icon: mdi:restart
    entity_category: config
    disabled_by_default: true
    on_press:
      - lambda: |-
          // Reset accumulated runtime counters and measured-start latches together,
          // so fairness and minimum-runtime diagnostics restart from a clean state.
          #if OQ_TOPOLOGY_DUO
          id(hp1_minutes) = 0;
          id(${secondary_minutes_id}) = 0;
          id(hp1_runtime_accum_ms) = 0;
          id(hp2_runtime_accum_ms) = 0;
          id(hp1_last_real_heat_start_ms) = 0;
          id(hp2_last_real_heat_start_ms) = 0;
          id(hp1_prev_heating_mode_active) = false;
          id(hp2_prev_heating_mode_active) = false;
          ESP_LOGI("quatt", "Runtime counters reset at boot (HP1+HP2).");
          #else
          id(hp1_minutes) = 0;
          id(hp1_runtime_accum_ms) = 0;
          id(hp1_last_real_heat_start_ms) = 0;
          id(hp1_prev_heating_mode_active) = false;
          ESP_LOGI("quatt", "Runtime counters reset at boot (HP1).");
          #endif

# ----------------------------
# SENSORS (energie + status)
# ----------------------------
sensor:
  - platform: template
    id: oq_total_power_input
    name: "Total Power Input"
    icon: mdi:flash
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      auto nz = [](float value) -> float { return isnan(value) ? 0.0f : value; };
      const float hp1_power_w = nz(id(hp1_power_input).state);
      #if OQ_TOPOLOGY_DUO
      const float hp2_power_w = nz(id(${secondary_power_input_id}).state);
      const float total_input_w = hp1_power_w + hp2_power_w;
      #else
      const float total_input_w = hp1_power_w;
      #endif
      // Safety clamp against tiny negative noise from upstream math/rounding.
      return (total_input_w < 0.0f) ? 0.0f : total_input_w;

  - platform: template
    id: oq_heating_power_input
    name: "Heating Power Input"
    icon: mdi:flash
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      auto nz = [](float value) -> float { return isnan(value) ? 0.0f : value; };
      if (id(oq_cooling_energy_session_active)) return 0.0f;
      const float hp1_mode = id(hp1_working_mode).state;
      const float hp1_power_w = (hp1_mode == 2.0f) ? nz(id(hp1_power_input).state) : 0.0f;
      #if OQ_TOPOLOGY_DUO
      const float hp2_mode = id(${secondary_working_mode_id}).state;
      const float hp2_power_w = (hp2_mode == 2.0f) ? nz(id(${secondary_power_input_id}).state) : 0.0f;
      return hp1_power_w + hp2_power_w;
      #else
      return hp1_power_w;
      #endif

  - platform: template
    id: oq_cooling_power_input
    name: "Cooling Power Input"
    icon: mdi:flash
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      auto nz = [](float value) -> float { return isnan(value) ? 0.0f : value; };
      if (!id(oq_cooling_energy_session_active)) return 0.0f;
      const float hp1_power_w = nz(id(hp1_power_input).state);
      #if OQ_TOPOLOGY_DUO
      const float hp2_power_w = nz(id(${secondary_power_input_id}).state);
      return hp1_power_w + hp2_power_w;
      #else
      return hp1_power_w;
      #endif

  - platform: template
    id: oq_total_heat_power
    name: "Total Heat Power"
    icon: mdi:radiator
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      const float hp1_heat_w = id(hp1_heat_power).state;
      #if OQ_TOPOLOGY_DUO
      const float hp2_heat_w = id(${secondary_heat_power_id}).state;

      if (isnan(hp1_heat_w) && isnan(hp2_heat_w)) return NAN;
      if (isnan(hp1_heat_w)) return hp2_heat_w;
      if (isnan(hp2_heat_w)) return hp1_heat_w;

      return hp1_heat_w + hp2_heat_w;
      #else
      if (isnan(hp1_heat_w)) return NAN;
      return hp1_heat_w;
      #endif

  - platform: template
    id: oq_total_cooling_power
    name: "Total Cooling Power"
    icon: mdi:snowflake
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      const float hp1_cooling_w = id(hp1_cooling_power).state;
      #if OQ_TOPOLOGY_DUO
      const float hp2_cooling_w = id(${secondary_cooling_power_id}).state;

      if (isnan(hp1_cooling_w) && isnan(hp2_cooling_w)) return NAN;
      if (isnan(hp1_cooling_w)) return hp2_cooling_w;
      if (isnan(hp2_cooling_w)) return hp1_cooling_w;

      return hp1_cooling_w + hp2_cooling_w;
      #else
      if (isnan(hp1_cooling_w)) return NAN;
      return hp1_cooling_w;
      #endif

  - platform: template
    id: oq_total_cop
    name: "Total COP"
    icon: mdi:chart-bell-curve-cumulative
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      const float total_input_w = id(oq_total_power_input).state;
      const float total_heat_w = id(oq_total_heat_power).state;

      if (isnan(total_input_w) || isnan(total_heat_w)) return NAN;
      if (fabsf(total_input_w) < ${oq_cop_min_input_w}) return NAN;

      return total_heat_w / total_input_w;

  - platform: template
    id: oq_total_eer
    name: "Total EER"
    icon: mdi:chart-bell-curve-cumulative
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      const float total_input_w = id(oq_cooling_power_input).state;
      const float total_cooling_w = id(oq_total_cooling_power).state;

      if (isnan(total_input_w) || isnan(total_cooling_w)) return NAN;
      if (fabsf(total_input_w) < ${oq_cop_min_input_w}) return NAN;

      return total_cooling_w / total_input_w;

  - platform: template
    id: oq_demand_raw_sensor
    name: "Demand raw"
    icon: mdi:chart-line
    unit_of_measurement: "step"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: ${oq_diagnostic_update_interval_s}s
    lambda: |-
      return (float) id(oq_demand_raw);

  - platform: template
    id: oq_demand_filtered_sensor
    name: "Demand filtered"
    icon: mdi:chart-line-variant
    unit_of_measurement: "step"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: ${oq_diagnostic_update_interval_s}s
    lambda: |-
      return (float) id(oq_demand_filtered);

  - platform: template
    id: oq_hp1_compressor_level_sensor
    name: "HP1 compressor level"
    icon: mdi:stairs
    unit_of_measurement: "lvl"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      if (!id(hp1_compressor_level).has_state()) return NAN;
      auto idx = id(hp1_compressor_level).active_index();
      if (!idx.has_value()) return NAN;
      return (float) idx.value();

  - platform: template
    id: oq_hp2_compressor_level_sensor
    name: "HP2 compressor level"
    internal: ${hc_hp2_diag_internal}
    icon: mdi:stairs
    unit_of_measurement: "lvl"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      #if OQ_TOPOLOGY_DUO
      if (!id(${secondary_compressor_level_id}).has_state()) return NAN;
      auto idx = id(${secondary_compressor_level_id}).active_index();
      if (!idx.has_value()) return NAN;
      return (float) idx.value();
      #else
      return NAN;
      #endif

# ----------------------------
# Extra overview sensors for capacity deficit
# ----------------------------

  - platform: template
    id: oq_hp_capacity_w_sensor
    name: "HP capacity (W)"
    icon: mdi:radiator
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: ${oq_diagnostic_update_interval_s}s
    lambda: |-
      return id(oq_P_hp_cap_w);

  - platform: template
    id: oq_hp_deficit_w_sensor
    name: "HP deficit (W)"
    icon: mdi:alert-circle-outline
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: ${oq_diagnostic_update_interval_s}s
    lambda: |-
      return id(oq_P_deficit_w);

text_sensor:
  - platform: template
    id: oq_request_reason
    name: "Request Reason"
    internal: true
    icon: mdi:source-branch
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: never
    lambda: |-
      return std::string("inactive");

  - platform: template
    id: oq_runtime_lead_hp_sensor
    name: "Runtime lead HP"
    icon: mdi:source-branch
    update_interval: 10s
    lambda: |-
      #if OQ_TOPOLOGY_DUO
      const bool lead_is_hp1 = (id(hp1_minutes) <= id(${secondary_minutes_id}));
      return std::string(lead_is_hp1 ? "HP1" : "HP2");
      #else
      return std::string("HP1");
      #endif

# ----------------------------
# MAIN LOOP
# ----------------------------
interval:

# ----------------------------
# LOOP (mode cadence on ${oq_heat_loop_tick_s}s scheduler)
# Fasen:
# - demand filtering + power cap
# - CM-gating (only CM2/CM3)
# - strategy pad:
#   heating curve => single-HP/split
#   power-house => compare best single-vs-duo candidates, prefer lower electrical input, then apply anti-flip guards
# - shared capacity/deficit publication
# - explicit request-interface publication
# - allowed-level mapping + min-runtime + apply + runtime bookkeeping
# ----------------------------
  - interval: ${oq_heat_loop_tick_s}s
    startup_delay: 4000ms
    then:
      - lambda: |-
          const uint32_t now_ms = (uint32_t) millis();
          const int cm_code = id(oq_control_mode_code);
          const bool is_cooling_mode = (cm_code == 5);
          const int heat_mode_code = id(oq_heat_mode_code);
          const bool is_curve_mode = (heat_mode_code == 1) || is_cooling_mode;
          const int control_flavor_code = is_cooling_mode ? 2 : heat_mode_code;
          const char* active_thermal_mode_opt = is_cooling_mode ? "Cooling" : "Heating";
          const int active_thermal_mode_code = is_cooling_mode ? 1 : 2;
          // Cooling has its own water-side dwell/limiter and must react quickly
          // after that limiter changes demand. Do not route CM5 through the
          // slower heating-curve cadence.
          const bool manual_hp_service_active = oq_manual_hp::owns_control();
          const uint32_t loop_target_ms = (uint32_t) (
              (manual_hp_service_active ? ${oq_heat_loop_tick_s} :
               is_cooling_mode ? ${oq_heat_loop_tick_s} :
               (is_curve_mode ? ${oq_heat_loop_curve_s} : ${oq_heat_loop_powerhouse_s})) * 1000UL);

          // After any controller reboot we intentionally keep the compressors blocked for a while.
          // This makes the compressor restart guard reboot-safe without relying on lost pre-crash timestamps.
          if (id(oq_boot_startup_inhibit_until_ms) == 0) {
            const uint32_t inhibit_ms = (uint32_t) ${oq_hp_min_off_s} * 1000UL;
            id(oq_boot_startup_inhibit_until_ms) = now_ms + inhibit_ms;
            id(oq_boot_startup_inhibit_active) = (inhibit_ms > 0);
            if (!id(oq_boot_startup_inhibit_logged) && inhibit_ms > 0) {
              ESP_LOGI("quatt", "Startup inhibit armed for %us after reboot; compressors remain blocked.", (unsigned int) ${oq_hp_min_off_s});
              id(oq_boot_startup_inhibit_logged) = true;
              id(oq_boot_startup_inhibit_cleared_logged) = false;
            }
          }
          const bool startup_inhibit_active =
              id(oq_boot_startup_inhibit_until_ms) > 0 &&
              now_ms < id(oq_boot_startup_inhibit_until_ms);
          id(oq_boot_startup_inhibit_active) = startup_inhibit_active;
          if (!startup_inhibit_active &&
              id(oq_boot_startup_inhibit_until_ms) > 0 &&
              id(oq_boot_startup_inhibit_logged) &&
              !id(oq_boot_startup_inhibit_cleared_logged)) {
            ESP_LOGI("quatt", "Startup inhibit cleared after reboot; compressors may resume.");
            id(oq_boot_startup_inhibit_cleared_logged) = true;
          }

          // On mode switch, execute immediately on this tick instead of waiting for previous cadence window.
          if (id(oq_heat_last_mode_code) != control_flavor_code) {
            id(oq_heat_last_mode_code) = control_flavor_code;
            id(oq_heat_last_loop_ms) = 0;
          }

          uint32_t dt_ms = loop_target_ms;
          if (id(oq_heat_last_loop_ms) > 0 && now_ms > id(oq_heat_last_loop_ms)) {
            const uint32_t elapsed_ms = now_ms - id(oq_heat_last_loop_ms);
            if (elapsed_ms < loop_target_ms) return;
            dt_ms = elapsed_ms;
            const uint32_t dt_cap_ms = loop_target_ms * 2UL;
            if (dt_cap_ms > 0 && dt_ms > dt_cap_ms) dt_ms = dt_cap_ms;
          }
          id(oq_heat_last_loop_ms) = now_ms;
          const int demand_max_f = (int) ${oq_strategy_demand_max_f};
          constexpr int request_strategy_inactive = 0;
          constexpr int request_strategy_cooling = 1;
          constexpr int request_strategy_curve = 2;
          constexpr int request_strategy_power_house = 3;
          constexpr int request_strategy_manual_hp = 4;

          // =========================
          // 1) Demand path (0..20)
          // Producer files now own the active demand path.
          // Thermal request control reads the shared filtered demand as strategy input.
          // =========================
          int raw = is_cooling_mode ? id(oq_cooling_demand_raw) : id(oq_demand_raw);
          raw = std::max(0, std::min(demand_max_f, raw));
          const int prev_f = id(oq_demand_filtered_prev);
          const bool is_power_house = !is_cooling_mode && (id(oq_heat_mode_code) != 1);
          int f = std::max(0, std::min(demand_max_f, id(oq_demand_filtered)));

          // =========================
          // 1a-2) Power limiter cap (diagnostic)
          // Producers already apply this cap before publishing requests.
          int f_cap = id(oq_power_cap_f);
          f_cap = std::max(0, std::min(demand_max_f, f_cap));
          const int f_post_cap = std::min(f, f_cap);

          // =========================
          // 1a-3) Shared runtime anchors
          // Track the moment each HP is actually measured in an active thermal mode.
          // This is the runtime anchor for the minimum runtime guard. It avoids
          // starting the timer too early on request/apply transitions that occur
          // before the compressor truly enters Heating/Cooling mode.
          // =========================
          const float hp1_mode_runtime_raw = id(hp1_working_mode).state;
          const bool hp1_measured_thermal =
              !isnan(hp1_mode_runtime_raw) &&
              ((((int) roundf(hp1_mode_runtime_raw)) == 1) || (((int) roundf(hp1_mode_runtime_raw)) == 2));
          if (hp1_measured_thermal && !id(hp1_prev_heating_mode_active)) {
            id(hp1_last_real_heat_start_ms) = now_ms;
          }
          id(hp1_prev_heating_mode_active) = hp1_measured_thermal;
          #if OQ_TOPOLOGY_DUO
          const float hp2_mode_runtime_raw = id(${secondary_working_mode_id}).state;
          const bool hp2_measured_thermal =
              !isnan(hp2_mode_runtime_raw) &&
              ((((int) roundf(hp2_mode_runtime_raw)) == 1) || (((int) roundf(hp2_mode_runtime_raw)) == 2));
          if (hp2_measured_thermal && !id(hp2_prev_heating_mode_active)) {
            id(hp2_last_real_heat_start_ms) = now_ms;
          }
          id(hp2_prev_heating_mode_active) = hp2_measured_thermal;
          #else
          const bool hp2_measured_thermal = false;
          #endif

          // =========================
          // 1b) Control Mode gating
          // CM2/CM3/CM5 may activate HPs.
          // In CM0/CM1/CM4/CM98: force Standby + level 0 and stop further HP control.
          // =========================
          const bool cm_allows_hp = (cm_code == 2 || cm_code == 3 || cm_code == 5);

          // =========================
          // 1c) Shared debug + actuator helper layer
          // These lambdas are strategy-agnostic and form the future extraction seam
          // for the dedicated thermal actuator package.
          // =========================
          auto publish_debug = [&](int req1, int req2, int app1, int app2)->void {
            static std::string last_debug = "";
            const int strategy_active_code = id(oq_strategy_active_code);
            const char *mode_s = "INACTIVE";
            if (strategy_active_code == 1) mode_s = "COOL";
            else if (strategy_active_code == 2) mode_s = "CURVE";
            else if (strategy_active_code == 3) mode_s = "PH";
            const char *phase_s =
                id(oq_strategy_phase_text).has_state() ? id(oq_strategy_phase_text).state.c_str() : "idle";
            const uint32_t off_since_ms = id(oq_curve_off_since_ms);
            uint32_t off_age_s = 0;
            if (off_since_ms > 0 && now_ms > off_since_ms) off_age_s = (now_ms - off_since_ms) / 1000UL;
            const float spw = id(oq_strategy_supply_target_temp);
            const float pv = id(oq_system_supply_temp).state;
            const float room_c = id(room_temp_selected).state;
            const float room_sp_c = id(room_setpoint_selected).state;
            const float phouse_w = is_power_house ? id(oq_phouse_house_w).state : NAN;
            const float preq_w = id(oq_strategy_requested_power_w);
            const float room_target_c = room_sp_c;
            const float tout_c = id(outside_temp_selected).state;
            const float wm1 = id(hp1_working_mode).state;
            float wm2 = 0.0f;
            int cur1 = -1;
            int cur2 = -1;
            int rt2 = 0;
            if (id(hp1_compressor_level).has_state()) cur1 = (int) id(hp1_compressor_level).active_index().value_or(-1);
            #if OQ_TOPOLOGY_DUO
            wm2 = id(${secondary_working_mode_id}).state;
            if (id(${secondary_compressor_level_id}).has_state()) cur2 = (int) id(${secondary_compressor_level_id}).active_index().value_or(-1);
            rt2 = id(${secondary_minutes_id});
            #endif
            char buf[768];
            snprintf(
              buf, sizeof(buf),
              "mode=%s cm=%d phase=%s raw=%d f=%d cap=%d pre=%d post=%d dual=%d on=%d off=%d em=%d lead=%d owner=%d req=%d+%d app=%d+%d cur=%d+%d wm=%.0f/%.0f sp=%.2f pv=%.2f room=%.2f/%.2f rtgt=%.2f phouse=%.0f preq=%.0f out=%.2f ri=%d off_age=%lus rt=%d/%d",
              mode_s, cm_code, phase_s, raw, f_post_cap, f_cap,
              id(oq_curve_demand_pre_guardrail), id(oq_demand_curve),
              (int) id(oq_dual_hp_enabled),
              oq_request::whole_minutes_floor(id(oq_dual_hp_enable_hold_elapsed_accum_min)),
              oq_request::whole_minutes_floor(id(oq_dual_hp_disable_hold_elapsed_accum_min)),
              oq_request::whole_minutes_floor(id(oq_dual_hp_emergency_hold_elapsed_accum_min)),
              id(oq_last_lead_hp), id(oq_curve_single_owner_hp),
              req1, req2, app1, app2,
              cur1, cur2, wm1, wm2, spw, pv, room_c, room_sp_c, room_target_c, phouse_w, preq_w, tout_c,
              (int) id(oq_curve_restart_inhibit_active),
              (unsigned long) off_age_s,
              id(hp1_minutes), rt2);
            const std::string s(buf);
            if (s != last_debug) {
              ESP_LOGD("quatt.req", "%s", s.c_str());
              last_debug = s;
            }
          };

          // DEBUG-RUNTIME: hidden text sensor that explains why the duo optimizer kept or changed the request path.
          auto publish_optimizer_reason = [&](const char* reason)->void {
            #if OQ_TOPOLOGY_DUO
            static std::string last_optimizer_reason = "";
            const std::string s(reason);
            if (s != last_optimizer_reason) {
              id(oq_duo_optimizer_reason).publish_state(s.c_str());
              ESP_LOGI("quatt.req", "Optimizer reason: %s", s.c_str());
              last_optimizer_reason = s;
            }
            #else
            (void) reason;
            #endif
          };

          const auto frequency_runtime = oq_frequency_runtime::capture();

          auto publish_request = [&](int mode_code, int req1, int req2, int strategy_code, int owner_hp, const char* reason)->void {
            (void) owner_hp;
            const bool manual_request = strategy_code == request_strategy_manual_hp;
            const int hp1_max_level = manual_request
                ? oq_odu::physical_level_limit(
                      frequency_runtime.configured_v2, frequency_runtime.snapshot(true), mode_code)
                : oq_odu::MODEL_LEVEL_MAX;
            const int hp2_max_level = manual_request
                ? oq_odu::physical_level_limit(
                      frequency_runtime.configured_v2, frequency_runtime.snapshot(false), mode_code)
                : oq_odu::MODEL_LEVEL_MAX;
            const auto published = oq_request::make_published_request(
                mode_code, req1, req2, strategy_code,
                hp1_max_level, hp2_max_level);

            id(oq_request_mode_code) = published.mode_code;
            id(oq_request_hp1_level) = published.hp1_level;
            id(oq_request_hp2_level) = published.hp2_level;
            id(oq_request_owner_hp) = published.owner_hp;
            id(oq_request_topology_code) = published.topology_code;
            id(oq_request_strategy_code) = published.strategy_code;

            static std::string last_request_reason = "";
            const std::string s = reason ? std::string(reason) : std::string("inactive");
            if (s != last_request_reason) {
              id(oq_request_reason).publish_state(s.c_str());
              ESP_LOGI("quatt.req", "Request reason: %s (mode=%d strategy=%d owner=%d topology=%d hp1=%d hp2=%d)",
                       s.c_str(),
                       published.mode_code,
                       published.strategy_code,
                       published.owner_hp,
                       published.topology_code,
                       published.hp1_level,
                       published.hp2_level);
              last_request_reason = s;
            }
          };

          auto update_startup_inhibit_event = [&](int target_mode_code, int desired_hp1, int desired_hp2)->void {
            const bool has_request = desired_hp1 > 0 || desired_hp2 > 0;
            const bool blocks_request = startup_inhibit_active && has_request;
            const uint8_t requested_subject = desired_hp1 > 0 && desired_hp2 > 0
                ? openquatt_decision_log::SUBJECT_BOTH
                : desired_hp1 > 0
                ? openquatt_decision_log::SUBJECT_HP1
                : desired_hp2 > 0
                ? openquatt_decision_log::SUBJECT_HP2
                : openquatt_decision_log::SUBJECT_UNKNOWN;
            const uint8_t requested_mode =
                (uint8_t) std::max(0, std::min(255, target_mode_code));
            const bool context_changed =
                blocks_request &&
                id(oq_boot_startup_inhibit_event_active) &&
                (id(oq_boot_startup_inhibit_event_subject) != requested_subject ||
                 id(oq_boot_startup_inhibit_event_mode) != requested_mode);

            if (context_changed) {
              uint16_t duration_s = 0;
              if (id(oq_boot_startup_inhibit_event_started_ms) > 0) {
                const uint32_t elapsed_s = (now_ms - id(oq_boot_startup_inhibit_event_started_ms)) / 1000UL;
                duration_s = elapsed_s > UINT16_MAX ? UINT16_MAX : (uint16_t) elapsed_s;
              }
              id(oq_decision_log).emit(
                  openquatt_decision_log::EVENT_STARTUP_INHIBIT_REFRESH,
                  requested_subject,
                  openquatt_decision_log::REASON_STARTUP_INHIBIT,
                  openquatt_decision_log::SEVERITY_NORMAL,
                  (uint8_t) std::max(0, std::min(255, cm_code)),
                  openquatt_decision_log::STATE_BLOCKED,
                  openquatt_decision_log::STATE_BLOCKED,
                  (int16_t) requested_mode,
                  (int16_t) std::min<uint32_t>(
                      id(oq_boot_startup_inhibit_until_ms) > now_ms
                          ? (id(oq_boot_startup_inhibit_until_ms) - now_ms + 999UL) / 1000UL
                          : 0,
                      INT16_MAX),
                  (int16_t) std::min<uint32_t>((uint32_t) ${oq_hp_min_off_s}, INT16_MAX),
                  duration_s);
              id(oq_boot_startup_inhibit_event_started_ms) = now_ms;
              id(oq_boot_startup_inhibit_event_subject) = requested_subject;
              id(oq_boot_startup_inhibit_event_mode) = requested_mode;
            } else if (id(oq_boot_startup_inhibit_event_active) && !blocks_request) {
              uint16_t duration_s = 0;
              if (id(oq_boot_startup_inhibit_event_started_ms) > 0) {
                const uint32_t elapsed_s = (now_ms - id(oq_boot_startup_inhibit_event_started_ms)) / 1000UL;
                duration_s = elapsed_s > UINT16_MAX ? UINT16_MAX : (uint16_t) elapsed_s;
              }
              id(oq_decision_log).emit(
                  openquatt_decision_log::EVENT_STARTUP_INHIBIT_CLEAR,
                  id(oq_boot_startup_inhibit_event_subject),
                  openquatt_decision_log::REASON_STARTUP_INHIBIT,
                  openquatt_decision_log::SEVERITY_NORMAL,
                  (uint8_t) std::max(0, std::min(255, cm_code)),
                  openquatt_decision_log::STATE_BLOCKED,
                  has_request
                      ? openquatt_decision_log::STATE_ACTIVE
                      : openquatt_decision_log::STATE_STANDBY,
                  (int16_t) id(oq_boot_startup_inhibit_event_mode),
                  0,
                  (int16_t) std::min<uint32_t>((uint32_t) ${oq_hp_min_off_s}, INT16_MAX),
                  duration_s);
              id(oq_boot_startup_inhibit_event_active) = false;
              id(oq_boot_startup_inhibit_event_started_ms) = 0;
              id(oq_boot_startup_inhibit_event_subject) = openquatt_decision_log::SUBJECT_UNKNOWN;
              id(oq_boot_startup_inhibit_event_mode) = 0;
            }

            if (blocks_request && !id(oq_boot_startup_inhibit_event_active)) {
              const uint32_t remaining_s = id(oq_boot_startup_inhibit_until_ms) > now_ms
                  ? (id(oq_boot_startup_inhibit_until_ms) - now_ms + 999UL) / 1000UL
                  : 0;
              id(oq_boot_startup_inhibit_event_active) = true;
              id(oq_boot_startup_inhibit_event_started_ms) = now_ms;
              id(oq_boot_startup_inhibit_event_subject) = requested_subject;
              id(oq_boot_startup_inhibit_event_mode) = requested_mode;
              id(oq_decision_log).emit(
                  openquatt_decision_log::EVENT_STARTUP_INHIBIT_START,
                  requested_subject,
                  openquatt_decision_log::REASON_STARTUP_INHIBIT,
                  openquatt_decision_log::SEVERITY_NORMAL,
                  (uint8_t) std::max(0, std::min(255, cm_code)),
                  openquatt_decision_log::STATE_STANDBY,
                  openquatt_decision_log::STATE_BLOCKED,
                  (int16_t) target_mode_code,
                  (int16_t) std::min<uint32_t>(remaining_s, INT16_MAX),
                  (int16_t) std::min<uint32_t>((uint32_t) ${oq_hp_min_off_s}, INT16_MAX));
            }
          };

          auto hp_selected_level = [&](bool is_hp1)->int {
            if (is_hp1) {
              if (!id(hp1_compressor_level).has_state()) return -1;
              auto idx = id(hp1_compressor_level).active_index();
              return idx.has_value() ? (int) idx.value() : -1;
            }
            if (!id(${secondary_compressor_level_id}).has_state()) return -1;
            auto idx = id(${secondary_compressor_level_id}).active_index();
            return idx.has_value() ? (int) idx.value() : -1;
          };

          auto hp_mode_is_cooling = [&](bool is_hp1)->bool {
            const float mode_raw = is_hp1 ? id(hp1_working_mode).state : id(${secondary_working_mode_id}).state;
            return oq_request::thermal_mode_matches(mode_raw, 1);
          };

          auto hp_mode_target_is_cooling = [&](bool is_hp1)->bool {
            if (is_hp1) {
              return oq_request::target_option_matches_mode(
                  id(hp1_set_working_mode).has_state(),
                  id(hp1_set_working_mode).current_option(),
                  1);
            }
            return oq_request::target_option_matches_mode(
                id(${secondary_set_working_mode_id}).has_state(),
                id(${secondary_set_working_mode_id}).current_option(),
                1);
          };

          auto hold_request_mode_code = [&](int hold1, int hold2)->int {
            const bool hp1_cooling_hold =
                (hold1 > 0) && (hp_mode_is_cooling(true) || hp_mode_target_is_cooling(true));
            #if OQ_TOPOLOGY_DUO
            const bool hp2_cooling_hold =
                (hold2 > 0) && (hp_mode_is_cooling(false) || hp_mode_target_is_cooling(false));
            #else
            const bool hp2_cooling_hold = false;
            #endif

            // Preserve cooling holds across CM5 -> CM1/CM0 transitions.
            // Otherwise the generic inactive-CM fallback would reinterpret the hold
            // as Heating and re-arm the compressor in the wrong thermal mode.
            return oq_request::hold_request_mode_code(
                hold1, hold2, hp1_cooling_hold, hp2_cooling_hold);
          };

          auto valve_defrost_active = [&](bool is_hp1)->bool {
            if (is_hp1) return id(hp1_4_way_valve).state;
            #if OQ_TOPOLOGY_DUO
            return id(${secondary_4_way_valve_id}).state;
            #else
            return false;
            #endif
          };

          auto defrost_stop_hold_level = [&](bool is_hp1)->int {
            // Only keep the last non-zero level during real defrost, i.e. once the
            // 4-way valve is active. The broader defrost bit can assert earlier and
            // caused the duo optimizer to pre-load far too aggressively.
            const bool defrost_active = valve_defrost_active(is_hp1);
            const int selected_physical_level = hp_selected_level(is_hp1);
            const int prev_applied = is_hp1 ? id(hp1_last_applied_level) : id(${secondary_last_applied_level_id});
            const int prev_physical = is_hp1
                ? id(hp1_last_commanded_physical_level)
                : id(${secondary_last_commanded_physical_level_id});
            const bool cooling_mode_active =
                hp_mode_is_cooling(is_hp1) || hp_mode_target_is_cooling(is_hp1);
            return oq_odu::resolve_retained_level(
                       defrost_active,
                       cooling_mode_active,
                       selected_physical_level,
                       prev_applied,
                       prev_physical,
                       frequency_runtime.configured_v2,
                       frequency_runtime.snapshot(is_hp1))
                .control_level;
          };

          int min_rt_s = (int) roundf(id(oq_min_runtime_min).state);
          // Keep the runtime floor hard in code as well. Older installs may still
          // restore a pre-migration numeric value such as 60, even though the UI
          // slider now starts at 300 s.
          if (min_rt_s > 0 && min_rt_s < 300) min_rt_s = 300;
          const uint32_t min_rt_ms = (min_rt_s > 0) ? ((uint32_t) min_rt_s * 1000UL) : 0;
          auto min_runtime_hold_level = [&](bool is_hp1)->int {
            const uint32_t last_real_start_ms = is_hp1 ? id(hp1_last_real_heat_start_ms) : id(hp2_last_real_heat_start_ms);
            const bool runtime_window_active =
                oq_request::min_runtime_window_active(now_ms, last_real_start_ms, min_rt_ms);
            const int last_applied = is_hp1 ? id(hp1_last_applied_level) : id(${secondary_last_applied_level_id});
            const bool measured_thermal = is_hp1 ? hp1_measured_thermal : hp2_measured_thermal;
            const bool runtime_hold_blocked =
                id(oq_water_temp_hard_trip_active) || id(oq_lowflow_fault_active) || startup_inhibit_active;
            return oq_request::min_runtime_hold_required(
                       0, runtime_hold_blocked, runtime_window_active, last_applied, measured_thermal)
                       ? 1
                       : 0;
          };

          // =========================
          // 1d) Manual HP service path
          // Keep CM100 circulation active while sending explicit requests through
          // the shared actuator. All downstream actuator guards remain normative.
          // =========================
          if (manual_hp_service_active) {
            const int hp1_mode_code = std::max(0, std::min(2, id(oq_manual_hp1_mode_code)));
            #if OQ_TOPOLOGY_DUO
            const int hp2_mode_code = std::max(0, std::min(2, id(oq_manual_hp2_mode_code)));
            #else
            const int hp2_mode_code = 0;
            #endif
            int hp1_req = (hp1_mode_code > 0)
                ? std::max(0, std::min(
                      oq_odu::physical_level_limit(
                          frequency_runtime.configured_v2,
                          frequency_runtime.snapshot(true),
                          hp1_mode_code),
                      (int) roundf(id(oq_manual_hp1_level).state)))
                : 0;
            int hp2_req = (hp2_mode_code > 0)
                ? std::max(0, std::min(
                      oq_odu::physical_level_limit(
                          frequency_runtime.configured_v2,
                          frequency_runtime.snapshot(false),
                          hp2_mode_code),
                      (int) roundf(id(oq_manual_hp2_level).state)))
                : 0;
            const bool manual_flow_ok =
                id(flow_rate_selected).has_state() &&
                !isnan(id(flow_rate_selected).state) &&
                id(flow_rate_selected).state >= (float) ${oq_cm_min_flow_lph};
            const bool safety_stop =
                id(oq_water_temp_hard_trip_active) ||
                id(oq_lowflow_fault_active) ||
                !manual_flow_ok;
            const bool manual_mode_conflict =
                hp1_mode_code > 0 &&
                hp2_mode_code > 0 &&
                hp1_mode_code != hp2_mode_code;
            id(oq_manual_hp_mode_allowed) =
                !id(oq_manual_hp_stop_requested) &&
                !safety_stop &&
                !startup_inhibit_active &&
                !manual_mode_conflict;
            const bool controlled_stop = id(oq_manual_hp_stop_requested);
            if (controlled_stop) {
              // Keep a recently started compressor alive at its technical
              // minimum until the runtime floor expires. Safety stops below
              // deliberately remain allowed to override this controlled hold.
              hp1_req = min_runtime_hold_level(true);
              #if OQ_TOPOLOGY_DUO
              hp2_req = min_runtime_hold_level(false);
              #else
              hp2_req = 0;
              #endif
            }
            update_startup_inhibit_event(
                hp1_mode_code > 0 ? hp1_mode_code : hp2_mode_code,
                (!controlled_stop && !safety_stop && !manual_mode_conflict) ? hp1_req : 0,
                (!controlled_stop && !safety_stop && !manual_mode_conflict) ? hp2_req : 0);
            if (safety_stop || startup_inhibit_active || manual_mode_conflict) {
              hp1_req = 0;
              hp2_req = 0;
            } else if (!controlled_stop) {
              if (hp1_req == 0) hp1_req = min_runtime_hold_level(true);
              #if OQ_TOPOLOGY_DUO
              if (hp2_req == 0) hp2_req = min_runtime_hold_level(false);
              #endif
            }
            int manual_mode_code = 0;
            if (hp1_req > 0 && hp1_mode_code > 0) manual_mode_code = hp1_mode_code;
            if (hp2_req > 0 && hp2_mode_code > 0) manual_mode_code = hp2_mode_code;
            if (manual_mode_code == 0 && (hp1_req > 0 || hp2_req > 0)) {
              manual_mode_code = hold_request_mode_code(hp1_req, hp2_req);
            }
            publish_optimizer_reason("manual_hp");
            publish_request(
              manual_mode_code,
              hp1_req,
              hp2_req,
              request_strategy_manual_hp,
              0,
              safety_stop ? "manual_hp_safety_stop" :
              (startup_inhibit_active ? "manual_hp_startup_inhibit" :
              (manual_mode_conflict ? "manual_hp_mode_conflict" : "manual_hp")));
            id(oq_actuator_hp1_req) = hp1_req;
            id(oq_actuator_hp2_req) = hp2_req;
            #if OQ_TOPOLOGY_DUO
            const int debug_hp2_applied = id(${secondary_last_applied_level_id});
            #else
            const int debug_hp2_applied = 0;
            #endif
            publish_debug(hp1_req, hp2_req, id(hp1_last_applied_level), debug_hp2_applied);
            return;
          }

          // =========================
          // 1e) Inactive-CM fast exit
          // Shared standby/hold behavior runs before any request-selection logic.
          // =========================
          if (!cm_allows_hp) {
            // Outside CM2/CM3/CM5 we normally request Standby + level 0.
            // Two exceptions may keep a unit alive in the downstream actuator:
            // 1) real defrost hold while the 4-way valve is active
            // 2) per-compressor minimum runtime, so a recent real heating start is not
            //    cut short by a quick fallback to CM1/CM0 after a marginal start
            const int hp1_runtime_hold_level = min_runtime_hold_level(true);
            const int hp1_hold_level =
                (hp1_runtime_hold_level > 0) ? hp1_runtime_hold_level : defrost_stop_hold_level(true);
            #if OQ_TOPOLOGY_DUO
            const int hp2_runtime_hold_level = min_runtime_hold_level(false);
            const int hp2_hold_level =
                (hp2_runtime_hold_level > 0) ? hp2_runtime_hold_level : defrost_stop_hold_level(false);
            const bool any_hold = (hp1_hold_level > 0) || (hp2_hold_level > 0);
            #else
            const int hp2_hold_level = 0;
            const bool any_hold = (hp1_hold_level > 0);
            #endif
            oq_request::reset_dual_runtime_state(
                id(oq_dual_hp_enabled),
                id(oq_dual_hp_enable_hold_elapsed_accum_min),
                id(oq_dual_hp_disable_hold_elapsed_accum_min),
                id(oq_dual_hp_emergency_hold_elapsed_accum_min),
                id(oq_curve_single_owner_hp),
                id(oq_duo_request_hold_until_ms),
                0);
            #if OQ_TOPOLOGY_DUO
            publish_optimizer_reason(any_hold ? "keep_current" : "inactive");
            #else
            publish_optimizer_reason(hp1_hold_level > 0 ? "keep_current" : "inactive");
            #endif
            const int hold_mode_code = hold_request_mode_code(hp1_hold_level, hp2_hold_level);
            update_startup_inhibit_event(0, 0, 0);
            publish_request(
              any_hold ? hold_mode_code : 0,
              hp1_hold_level,
              hp2_hold_level,
              request_strategy_inactive,
              0,
              any_hold ? "inactive_cm_hold" : "inactive_cm");
            id(oq_actuator_hp1_req) = hp1_hold_level;
            id(oq_actuator_hp2_req) = hp2_hold_level;
            #if OQ_TOPOLOGY_DUO
            const int debug_hp2_applied = id(${secondary_last_applied_level_id});
            #else
            const int debug_hp2_applied = 0;
            #endif
            publish_debug(hp1_hold_level, hp2_hold_level, id(hp1_last_applied_level), debug_hp2_applied);
            return;
          }
          // =========================
          // 2) HP level selection
          //    - WATER TEMP: single-HP-first with dual-enable hysteresis
          //    - POWER HOUSE: level optimization on thermal power (W) via hp_perf_map.h
          // =========================

          // =========================
          // 2a) Shared request context
          // From here down we only decide requested compressor levels per strategy.
          // Cooling must never inherit the selected heating strategy path.
          // =========================
          const int active_request_strategy_code =
              is_cooling_mode ? request_strategy_cooling
                              : (is_power_house ? request_strategy_power_house : request_strategy_curve);

          // Lead HP = fewest runtime minutes
          #if OQ_TOPOLOGY_DUO
          const bool lead_is_hp1 = (id(hp1_minutes) <= id(${secondary_minutes_id}));
          #else
          const bool lead_is_hp1 = true;
          #endif

          const int lead_code = lead_is_hp1 ? 1 : 2;
          if (id(oq_last_lead_hp) != lead_code) {
            id(oq_last_lead_hp) = lead_code;
            #if OQ_TOPOLOGY_DUO
            ESP_LOGI("quatt", "Runtime lead changed: %s (hp1_minutes=%d, hp2_minutes=%d)",
                     lead_is_hp1 ? "HP1" : "HP2", id(hp1_minutes), id(${secondary_minutes_id}));
            #else
            ESP_LOGI("quatt", "Runtime lead changed: HP1 (single topology)");
            #endif
          }

          int hp1_req = 0;
          int hp2_req = 0;
          int request_owner_hp = 0;
          const char* request_reason =
              is_cooling_mode ? "cooling_idle"
                              : (is_power_house ? "ph_idle" : "curve_idle");
          const int max_level = 10;

          const bool hp1_valve_def = valve_defrost_active(true);
          #if OQ_TOPOLOGY_DUO
          const bool hp2_valve_def = valve_defrost_active(false);
          #else
          const bool hp2_valve_def = false;
          #endif

          #if OQ_TOPOLOGY_DUO
          if (!is_power_house) {
            id(oq_duo_request_hold_until_ms) = 0;
            publish_optimizer_reason("curve_mode");
            if (is_cooling_mode) {
              hp1_req = id(oq_cooling_request_hp1_level);
              hp2_req = id(oq_cooling_request_hp2_level);
              request_owner_hp = id(oq_cooling_request_owner_hp);
              switch (id(oq_cooling_request_reason_code)) {
                case 1: request_reason = "cooling_owner_hp1"; break;
                case 2: request_reason = "cooling_owner_hp2"; break;
                default: request_reason = "cooling_idle"; break;
              }
            } else {
              hp1_req = id(oq_curve_dispatch_hp1_level);
              hp2_req = id(oq_curve_dispatch_hp2_level);
              request_owner_hp = id(oq_curve_request_owner_hp);
              if ((hp1_req + hp2_req) <= 0) request_reason = "curve_idle";
              else if (id(oq_curve_capacity_mode_code) == 2) request_reason = "curve_dual";
              else if (request_owner_hp == 1) request_reason = "curve_single_hp1";
              else if (request_owner_hp == 2) request_reason = "curve_single_hp2";
              else request_reason = "curve_single";
            }

          } else {
            hp1_req = id(oq_ph_request_hp1_level);
            hp2_req = id(oq_ph_request_hp2_level);
            request_owner_hp = id(oq_ph_request_owner_hp);
            switch (id(oq_ph_request_reason_code)) {
              case 1: request_reason = "ph_fallback_idle"; break;
              case 2: request_reason = "ph_fallback_single_hp1"; break;
              case 3: request_reason = "ph_fallback_single_hp2"; break;
              case 4: request_reason = "ph_fallback_duo"; break;
              case 5: request_reason = "keep_current"; break;
              case 6: request_reason = "hold_active"; break;
              case 7: request_reason = "defrost_hold"; break;
              case 8: request_reason = "better_heat"; break;
              case 9: request_reason = "soft_guard"; break;
              case 10: request_reason = "less_power"; break;
              case 11: request_reason = "no_candidate"; break;
              case 12: request_reason = "defrost_boost"; break;
              case 13: request_reason = "runtime_lead"; break;
              default: request_reason = "ph_idle"; break;
            }
          }
          #else
          oq_request::reset_dual_runtime_state(
              id(oq_dual_hp_enabled),
              id(oq_dual_hp_enable_hold_elapsed_accum_min),
              id(oq_dual_hp_disable_hold_elapsed_accum_min),
              id(oq_dual_hp_emergency_hold_elapsed_accum_min),
              id(oq_curve_single_owner_hp),
              id(oq_duo_request_hold_until_ms),
              1);
          if (!is_power_house) {
            if (is_cooling_mode) {
              hp1_req = id(oq_cooling_request_hp1_level);
              request_owner_hp = id(oq_cooling_request_owner_hp);
              request_reason = (request_owner_hp > 0) ? "cooling_owner_hp1" : "cooling_idle";
            } else {
              hp1_req = id(oq_curve_dispatch_hp1_level);
              request_owner_hp = id(oq_curve_request_owner_hp);
              request_reason = (hp1_req > 0) ? "curve_single_hp1" : "curve_idle";
            }
          } else {
            hp1_req = id(oq_ph_request_hp1_level);
            request_owner_hp = id(oq_ph_request_owner_hp);
            switch (id(oq_ph_request_reason_code)) {
              case 1: request_reason = "ph_fallback_idle"; break;
              case 2: request_reason = "ph_fallback_single_hp1"; break;
              case 14: request_reason = "ph_single_topology"; break;
              default: request_reason = "ph_idle"; break;
            }
          }
          hp2_req = 0;
          #endif

          // =========================
          // 3) Request interface publication
          // Publish pre-protection requests so the downstream actuator path can
          // consume a stable interface before exclusions, slew limits and
          // runtime guards are applied.
          // =========================
          publish_request(
            active_thermal_mode_code,
            hp1_req,
            hp2_req,
            active_request_strategy_code,
            request_owner_hp,
            request_reason);
          hp1_req = id(oq_request_hp1_level);
          hp2_req = id(oq_request_hp2_level);

          // =========================
          // 4) Policy filtering. Day/Silent caps and one excluded frequency
          //    range per HP are enforced directly against the runtime table.
          // =========================
          auto pick_allowed = [&](int req, bool is_hp1)->int {
            return frequency_runtime.pick_allowed_level(
                is_hp1, active_thermal_mode_code, req, 1, max_level);
          };

          hp1_req = pick_allowed(hp1_req, true);
          #if OQ_TOPOLOGY_DUO
          hp2_req = pick_allowed(hp2_req, false);
          #else
          hp2_req = 0;
          #endif

          // =========================
          // 4b) Explicit per-HP slew-rate limiting for non-Power-House modes.
          //    - Heating Curve keeps its profile hold times here.
          //    - Cooling already has water-side dwell/limiter timing upstream, so
          //      this layer only prevents multi-level upward jumps and lets
          //      downward corrections pass immediately.
          // =========================
          if (!is_power_house) {
            const int curve_regime = id(oq_curve_regime_code);
            const auto tuning = oq_curve::control_profile(
                id(oq_curve_control_profile).has_state()
                    ? id(oq_curve_control_profile).current_option()
                    : std::string());
            int up_hold_s = tuning.steady_up_hold_s;
            int down_hold_s = tuning.steady_down_hold_s;
            if (curve_regime == 1) up_hold_s = tuning.recovery_up_hold_s;

            auto limit_slew = [&](bool is_hp1, int req_level)->int {
              const int prev = is_hp1 ? id(hp1_last_applied_level) : id(${secondary_last_applied_level_id});
              uint32_t &last_change_ms = is_hp1 ? id(hp1_last_level_change_ms) : id(hp2_last_level_change_ms);

              if (req_level == prev) return req_level;

              int limited = req_level;
              if (limited > prev + 1) limited = prev + 1;
              if (!is_cooling_mode && limited < prev - 1) limited = prev - 1;
              if (limited == prev) return limited;

              if (is_cooling_mode) return limited;

              const bool moving_up = limited > prev;
              const uint32_t hold_ms = (uint32_t) ((moving_up ? up_hold_s : down_hold_s) * 1000UL);
              if (last_change_ms > 0 && now_ms > last_change_ms) {
                const uint32_t dt_change_ms = now_ms - last_change_ms;
                if (dt_change_ms < hold_ms) return prev;
              }
              return limited;
            };

            hp1_req = limit_slew(true, hp1_req);
            #if OQ_TOPOLOGY_DUO
            hp2_req = limit_slew(false, hp2_req);

            // Global guardrail: in curve mode allow at most one HP level change per cycle.
            // This avoids tandem jumps like 1+1 -> 2+2 that create thermal overshoot.
            const int prev1 = id(hp1_last_applied_level);
            const int prev2 = id(${secondary_last_applied_level_id});
            const int d_hp1 = hp1_req - prev1;
            const int d_hp2 = hp2_req - prev2;
            if (d_hp1 != 0 && d_hp2 != 0) {
              bool apply_hp1_change = true;
              if (d_hp1 > 0 && d_hp2 > 0) {
                // Ramp-up: prioritize runtime lead.
                apply_hp1_change = lead_is_hp1;
              } else if (d_hp1 < 0 && d_hp2 < 0) {
                // Ramp-down: shed lag first.
                apply_hp1_change = !lead_is_hp1;
              } else {
                // Mixed direction: prioritize the downward correction.
                apply_hp1_change = (d_hp1 < 0);
              }

              if (apply_hp1_change) hp2_req = prev2;
              else hp1_req = prev1;
            }
            #else
            hp2_req = 0;
            #endif
          }

          // =========================
          // 5) Absolute water-temperature/low-flow/cold-start hard stop
          // These safety stops have higher priority than compressor minimum runtime.
          // =========================
          const bool hard_request_stop_active =
              id(oq_water_temp_hard_trip_active) ||
              id(oq_lowflow_fault_active) ||
              (!is_cooling_mode && id(oq_cold_start_hp_blocked));
          if (hard_request_stop_active) {
            hp1_req = 0;
            #if OQ_TOPOLOGY_DUO
            hp2_req = 0;
            #else
            hp2_req = 0;
            #endif
          }

          update_startup_inhibit_event(active_thermal_mode_code, hp1_req, hp2_req);

          // Absolute boot-time startup inhibit: after a controller reboot, keep compressors
          // at level 0 until the configured compressor minimum off-time has elapsed.
          if (startup_inhibit_active) {
            hp1_req = 0;
            #if OQ_TOPOLOGY_DUO
            hp2_req = 0;
            #else
            hp2_req = 0;
            #endif
          }
          const bool runtime_hold_blocked =
              hard_request_stop_active || startup_inhibit_active;

          // =========================
          // 6) Post-request runtime floor
          // Prevents very short compressor runs in cooling, curve and Power House modes.
          // Runtime is per-compressor and user-tunable, with a hard lower bound of 300 s.
          // Normal zero requests, including cooling floor/dew-point stops, keep a
          // running compressor at its minimum allowed level. Absolute safety stops
          // here and in the downstream actuator retain higher priority.
          // =========================
          if (min_rt_s > 0) {
            // HP1/HP2: if request is 0 but measured heating start is still within
            // the minimum runtime window, keep that compressor alive at >=1.
            // This guard intentionally keys off real heating start instead of the
            // earlier apply transition, so short mode-transition delays do not
            // silently consume most of the runtime window.
            const bool hp1_min_runtime_active =
                oq_request::min_runtime_window_active(
                    now_ms, id(hp1_last_real_heat_start_ms), min_rt_ms);
            const bool hp1_min_runtime_hold =
                oq_request::min_runtime_hold_required(
                    hp1_req, runtime_hold_blocked, hp1_min_runtime_active,
                    id(hp1_last_applied_level), hp1_measured_thermal);
            if (hp1_min_runtime_hold) {
              hp1_req = pick_allowed(1, true);
            }
            static bool last_hp1_min_runtime_hold = false;
            if (hp1_min_runtime_hold != last_hp1_min_runtime_hold) {
              if (hp1_min_runtime_hold) {
                const uint32_t elapsed_ms = now_ms - id(hp1_last_real_heat_start_ms);
                const uint32_t remaining_s =
                    (min_rt_ms > elapsed_ms) ? ((min_rt_ms - elapsed_ms + 999UL) / 1000UL) : 0;
                if (is_cooling_mode) {
                  ESP_LOGI("quatt.req", "HP1 cooling stop deferred by minimum runtime: requesting minimum level for %u s",
                           (unsigned int) remaining_s);
                } else {
                  ESP_LOGI("quatt.req", "HP1 minimum runtime hold active: keeping level 1 for %u s",
                           (unsigned int) remaining_s);
                }
              } else {
                ESP_LOGI("quatt.req", "HP1 minimum runtime hold cleared");
              }
              last_hp1_min_runtime_hold = hp1_min_runtime_hold;
            }

            #if OQ_TOPOLOGY_DUO
            const bool hp2_min_runtime_active =
                oq_request::min_runtime_window_active(
                    now_ms, id(hp2_last_real_heat_start_ms), min_rt_ms);
            const bool hp2_min_runtime_hold =
                oq_request::min_runtime_hold_required(
                    hp2_req, runtime_hold_blocked, hp2_min_runtime_active,
                    id(${secondary_last_applied_level_id}), hp2_measured_thermal);
            if (hp2_min_runtime_hold) {
              hp2_req = pick_allowed(1, false);
            }
            static bool last_hp2_min_runtime_hold = false;
            if (hp2_min_runtime_hold != last_hp2_min_runtime_hold) {
              if (hp2_min_runtime_hold) {
                const uint32_t elapsed_ms = now_ms - id(hp2_last_real_heat_start_ms);
                const uint32_t remaining_s =
                    (min_rt_ms > elapsed_ms) ? ((min_rt_ms - elapsed_ms + 999UL) / 1000UL) : 0;
                if (is_cooling_mode) {
                  ESP_LOGI("quatt.req", "HP2 cooling stop deferred by minimum runtime: requesting minimum level for %u s",
                           (unsigned int) remaining_s);
                } else {
                  ESP_LOGI("quatt.req", "HP2 minimum runtime hold active: keeping level 1 for %u s",
                           (unsigned int) remaining_s);
                }
              } else {
                ESP_LOGI("quatt.req", "HP2 minimum runtime hold cleared");
              }
              last_hp2_min_runtime_hold = hp2_min_runtime_hold;
            }
            #else
            hp2_req = 0;
            #endif
          }

          // Slew and runtime holds can reintroduce a previous level after the
          // first policy pass. Revalidate the final request so this layer never
          // publishes a level outside its own active cap or exclusion ranges.
          hp1_req = pick_allowed(hp1_req, true);
          #if OQ_TOPOLOGY_DUO
          hp2_req = pick_allowed(hp2_req, false);
          #else
          hp2_req = 0;
          #endif

          // =========================
          // 7) Thermal actuator input
          // oq_thermal_actuator is now the only package that writes working mode
          // and compressor levels, and owns the post-apply bookkeeping.
          // =========================
          id(oq_actuator_hp1_req) = hp1_req;
          id(oq_actuator_hp2_req) = hp2_req;
          #if OQ_TOPOLOGY_DUO
          const int debug_hp2_applied = id(${secondary_last_applied_level_id});
          #else
          const int debug_hp2_applied = 0;
          #endif
          publish_debug(hp1_req, hp2_req, id(hp1_last_applied_level), debug_hp2_applied);
