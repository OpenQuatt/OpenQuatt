# ==============================================================================
# OpenQuatt - Thermal Limits and Abstractions
# ==============================================================================
#
# Goal:
#   Publishes shared thermal abstractions and water-temperature guardrails used
#   by heating strategy, cooling, boiler-control, supervisory, and heat-control.
#
# Ownership:
#   - Publishes `oq_system_supply_temp`
#   - Publishes shared water-temperature limit/trip/hard-trip state
#   - Does not select a heating strategy or write any heat-pump actuators
# ==============================================================================

# ----------------------------
# INTERNAL STATE
# ----------------------------
globals:
  # Shared water-temperature guardrail state.
  # One model drives curve-target clamping, Power House limiting, boiler inhibit,
  # and the absolute hard trip seen by heat-control.
  - id: oq_water_temp_limit_factor
    type: float
    restore_value: false
    initial_value: '1.0'

  - id: oq_water_temp_boiler_inhibit_active
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: oq_water_temp_trip_active
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: oq_water_temp_hard_trip_active
    type: bool
    restore_value: false
    initial_value: 'false'

# ----------------------------
# CONTROL INPUTS
# ----------------------------
number:
  - platform: template
    id: max_water_temp_limit_c
    name: "Maximum water temperature"
    icon: mdi:thermometer-high
    unit_of_measurement: "°C"
    min_value: 25
    max_value: 75
    step: 0.5
    restore_value: true
    optimistic: true
    initial_value: 60
    entity_category: config

sensor:
  # Shared abstractions and derived telemetry.
  - platform: template
    id: oq_system_supply_temp
    name: "System Supply Temp (abstraction)"
    icon: mdi:water-thermometer
    internal: true
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      // The selected supply signal owns source validity and topology fallback.
      if (id(water_supply_temp_selected).has_state()) {
        const float selected_supply_c = id(water_supply_temp_selected).state;
        if (!isnan(selected_supply_c)) return selected_supply_c;
      }
      return NAN;

# ----------------------------
# INTERVAL (5s)
#   * Shared thermal abstractions and water-temperature guardrails
# ----------------------------
interval:
  - interval: ${oq_strategy_loop_s}s
    startup_delay: 800ms
    then:
      - lambda: |-
          oq_thermal_limits_runtime::runtime().tick();
