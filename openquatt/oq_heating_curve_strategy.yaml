# ==============================================================================
# OpenQuatt - Heating Curve Strategy
# ==============================================================================

globals:
  # Continuous PID-derived demand before integer quantization or request guardrails.
  - id: oq_curve_demand_continuous
    type: float
    restore_value: false
    initial_value: 'NAN'

  # Internal source (0..20) for heating-curve mode (PID -> demand)
  - id: oq_demand_curve
    type: int
    restore_value: false
    initial_value: '0'

  # Heating-curve diagnostics: demand before output guardrails.
  - id: oq_curve_demand_pre_guardrail
    type: int
    restore_value: false
    initial_value: '0'

  # Curve operating regime: 0=OFF, 1=RECOVERY, 2=MAINTAIN.
  - id: oq_curve_regime_code
    type: int
    restore_value: false
    initial_value: '0'

  # Curve-mode on/off hysteresis state near zero-demand edge.
  - id: oq_curve_heat_request_active
    type: bool
    restore_value: false
    initial_value: 'false'

  # Timestamp when curve stop condition was first armed (OFF confirm guardrail).
  - id: oq_curve_stop_arm_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # Timestamp when curve phase entered OFF (for restart inhibit timing).
  - id: oq_curve_off_since_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # Diagnostic flag: restart from OFF is temporarily inhibited.
  - id: oq_curve_restart_inhibit_active
    type: bool
    restore_value: false
    initial_value: 'false'

  # Diagnostic flag: a fresh, clearly warm room blocks a water-only restart.
  - id: oq_curve_restart_blocked_by_room
    type: bool
    restore_value: false
    initial_value: 'false'

  # Fast first-start intent: 0=none, 1=room demand, 2=setpoint raise.
  - id: oq_curve_fast_intent_code
    type: int
    restore_value: false
    initial_value: '0'

  # Curve outside-temperature EMA state.
  - id: oq_curve_outside_ema_c
    type: float
    restore_value: false
    initial_value: '0.0'
  - id: oq_curve_outside_ema_initialized
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: oq_curve_outside_ema_last_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  - id: oq_curve_request_last_loop_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  - id: oq_curve_request_total_level
    type: int
    restore_value: false
    initial_value: '0'

  - id: oq_curve_request_owner_hp
    type: int
    restore_value: false
    initial_value: '0'

  - id: oq_curve_dispatch_hp1_level
    type: int
    restore_value: false
    initial_value: '0'

  - id: oq_curve_dispatch_hp2_level
    type: int
    restore_value: false
    initial_value: '0'

  - id: oq_curve_capacity_mode_code
    type: int
    restore_value: false
    initial_value: '0'

  - id: oq_curve_oil_return_hold_until_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

select:
  - platform: template
    id: oq_curve_control_profile
    name: "Heating Curve Control Profile"
    icon: mdi:tune-variant
    optimistic: true
    restore_value: true
    options:
      - Comfort
      - Balanced
      - Stable
    initial_option: Balanced
    entity_category: config
    on_value:
      then:
        - climate.pid.reset_integral_term: oq_heating_curve_pid
        - lambda: |-
            oq_heating_curve_runtime::runtime().reset_profile();

number:
  - platform: template
    id: curve_tsupply_m20
    name: "Curve Tsupply @ -20°C"
    icon: mdi:thermometer
    entity_category: config
    unit_of_measurement: "°C"
    min_value: 20
    max_value: 70
    step: 0.5
    restore_value: true
    optimistic: true
    initial_value: 55

  - platform: template
    id: curve_tsupply_m10
    name: "Curve Tsupply @ -10°C"
    icon: mdi:thermometer
    entity_category: config
    unit_of_measurement: "°C"
    min_value: 20
    max_value: 70
    step: 0.5
    restore_value: true
    optimistic: true
    initial_value: 50

  - platform: template
    id: curve_tsupply_0
    name: "Curve Tsupply @ 0°C"
    icon: mdi:thermometer
    entity_category: config
    unit_of_measurement: "°C"
    min_value: 20
    max_value: 70
    step: 0.5
    restore_value: true
    optimistic: true
    initial_value: 45

  - platform: template
    id: curve_tsupply_5
    name: "Curve Tsupply @ 5°C"
    icon: mdi:thermometer
    entity_category: config
    unit_of_measurement: "°C"
    min_value: 20
    max_value: 70
    step: 0.5
    restore_value: true
    optimistic: true
    initial_value: 40

  - platform: template
    id: curve_tsupply_10
    name: "Curve Tsupply @ 10°C"
    icon: mdi:thermometer
    entity_category: config
    unit_of_measurement: "°C"
    min_value: 20
    max_value: 70
    step: 0.5
    restore_value: true
    optimistic: true
    initial_value: 35

  - platform: template
    id: curve_tsupply_15
    name: "Curve Tsupply @ 15°C"
    icon: mdi:thermometer
    entity_category: config
    unit_of_measurement: "°C"
    min_value: 20
    max_value: 70
    step: 0.5
    restore_value: true
    optimistic: true
    initial_value: 30

  - platform: template
    id: heating_curve_pid_kp
    name: "Heating Curve PID Kp"
    icon: mdi:alpha-k-circle-outline
    entity_category: config
    min_value: 0.000
    max_value: 0.800
    step: 0.010
    mode: slider
    restore_value: true
    optimistic: true
    initial_value: 0.280
    on_value:
      then:
        - climate.pid.set_control_parameters:
            id: oq_heating_curve_pid
            kp: !lambda "return id(heating_curve_pid_kp).state;"
            ki: !lambda "return id(heating_curve_pid_ki).state;"
            kd: !lambda "return id(heating_curve_pid_kd).state;"
        - climate.pid.reset_integral_term: oq_heating_curve_pid

  - platform: template
    id: heating_curve_pid_ki
    name: "Heating Curve PID Ki"
    icon: mdi:alpha-i-circle-outline
    entity_category: config
    min_value: 0.00000
    max_value: 0.00300
    step: 0.00010
    mode: slider
    restore_value: true
    optimistic: true
    initial_value: 0.00060
    on_value:
      then:
        - climate.pid.set_control_parameters:
            id: oq_heating_curve_pid
            kp: !lambda "return id(heating_curve_pid_kp).state;"
            ki: !lambda "return id(heating_curve_pid_ki).state;"
            kd: !lambda "return id(heating_curve_pid_kd).state;"
        - climate.pid.reset_integral_term: oq_heating_curve_pid

  - platform: template
    id: heating_curve_pid_kd
    name: "Heating Curve PID Kd"
    icon: mdi:alpha-d-circle-outline
    entity_category: config
    min_value: 0.000
    max_value: 0.400
    step: 0.010
    mode: slider
    restore_value: true
    optimistic: true
    initial_value: 0.200
    on_value:
      then:
        - climate.pid.set_control_parameters:
            id: oq_heating_curve_pid
            kp: !lambda "return id(heating_curve_pid_kp).state;"
            ki: !lambda "return id(heating_curve_pid_ki).state;"
            kd: !lambda "return id(heating_curve_pid_kd).state;"
        - climate.pid.reset_integral_term: oq_heating_curve_pid

  - platform: template
    id: curve_fallback_supply_temp
    name: "Curve Fallback Tsupply (No Outside Temp)"
    icon: mdi:thermometer-alert
    entity_category: config
    unit_of_measurement: "°C"
    min_value: 25
    max_value: 70
    step: 0.5
    restore_value: true
    optimistic: true
    initial_value: 40

button:
  - platform: template
    id: reset_heating_curve_pid_integral
    name: "Reset Heating Curve PID integral"
    internal: true
    on_press:
      then:
        - climate.pid.reset_integral_term: oq_heating_curve_pid

climate:
  - platform: pid
    id: oq_heating_curve_pid
    name: "Heating Curve PID"
    internal: true
    sensor: oq_system_supply_temp
    default_target_temperature: 35 °C
    heat_output: heating_curve_pid_out
    control_parameters:
      kp: 0.280
      ki: 0.00060
      kd: 0.200
      max_integral: 1.5
      min_integral: -1.5
    deadband_parameters:
      threshold_low: -1.00
      threshold_high: 1.00
      deadband_output_averaging_samples: 6
    visual:
      min_temperature: 20
      max_temperature: 70

output:
  - platform: template
    id: heating_curve_pid_out
    type: float
    write_action:
      - lambda: |-
          oq_heating_curve_runtime::runtime().write_pid_output(
              state, (int) ${oq_strategy_demand_max_f},
              (${oq_ot_room_temperature_fresh_expr}),
              (${oq_ot_room_setpoint_fresh_expr}));

sensor:
  - platform: template
    id: oq_curve_outside_temp_filtered
    name: "Outside Temperature (Curve filtered)"
    internal: true
    unit_of_measurement: "°C"
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      return oq_heating_curve_runtime::runtime().filtered_outside_temperature();

  - platform: template
    id: oq_supply_target_temp
    name: "Heating Curve Supply Target"
    icon: mdi:target
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      return oq_heating_curve_runtime::runtime().supply_target();

  - platform: template
    id: oq_curve_demand_continuous_sensor
    name: "Curve demand (effective)"
    internal: true
    unit_of_measurement: "step"
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 5s
    lambda: |-
      return id(oq_curve_demand_continuous);

  - platform: template
    id: oq_curve_demand_post_guardrail_sensor
    name: "Curve demand (discrete)"
    internal: true
    unit_of_measurement: "step"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return (float) id(oq_demand_curve);

  - platform: template
    id: oq_curve_request_total_level_sensor
    name: "Curve dispatch total level"
    internal: true
    unit_of_measurement: "step"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return (float) id(oq_curve_request_total_level);

  - platform: template
    id: oq_curve_dispatch_hp1_level_sensor
    name: "Curve target HP1 level"
    internal: true
    unit_of_measurement: "step"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return (float) id(oq_curve_dispatch_hp1_level);

  - platform: template
    id: oq_curve_dispatch_hp2_level_sensor
    name: "Curve target HP2 level"
    internal: true
    unit_of_measurement: "step"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return (float) id(oq_curve_dispatch_hp2_level);

  - platform: template
    id: oq_curve_restart_inhibit_sensor
    name: "Curve restart inhibit"
    internal: true
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return id(oq_curve_restart_inhibit_active) ? 1.0f : 0.0f;

  - platform: template
    id: oq_curve_restart_blocked_by_room_sensor
    name: "Curve restart blocked by room"
    internal: true
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return id(oq_curve_restart_blocked_by_room) ? 1.0f : 0.0f;

text_sensor:
  - platform: template
    id: oq_curve_phase_sensor
    name: "Curve Phase"
    internal: true
    update_interval: ${oq_diagnostic_update_interval_s}s
    lambda: |-
      if (!id(oq_curve_heat_request_active)) return std::string("OFF");
      return (id(oq_curve_regime_code) == 1) ? std::string("HEAT") : std::string("COAST");

  - platform: template
    id: oq_curve_regime_sensor
    name: "Curve operating regime"
    internal: true
    update_interval: ${oq_diagnostic_update_interval_s}s
    lambda: |-
      switch (id(oq_curve_regime_code)) {
        case 1: return std::string("RECOVERY");
        case 2: return std::string("MAINTAIN");
        default: return std::string("OFF");
      }

  - platform: template
    id: oq_curve_capacity_mode_sensor
    name: "Curve capacity mode"
    internal: true
    update_interval: ${oq_diagnostic_update_interval_s}s
    lambda: |-
      const char *mode_name = oq_curve::capacity_mode_name(id(oq_curve_capacity_mode_code));
      return std::string(mode_name);

  - platform: template
    id: oq_curve_fast_intent_sensor
    name: "Curve first-start intent"
    internal: true
    update_interval: 5s
    lambda: |-
      return std::string(oq_heat_intent::reason_name(
          static_cast<oq_heat_intent::Reason>(id(oq_curve_fast_intent_code))));

interval:
  - interval: ${oq_strategy_loop_s}s
    startup_delay: 800ms
    then:
      - lambda: |-
          oq_heating_curve_runtime::runtime().strategy_tick(
              (int) ${oq_strategy_demand_max_f},
              (${oq_ot_room_temperature_fresh_expr}),
              (${oq_ot_room_setpoint_fresh_expr}));
      - if:
          condition:
            lambda: |-
              return oq_heating_curve_runtime::runtime().integral_reset_required();
          then:
            - climate.pid.reset_integral_term: oq_heating_curve_pid

  - interval: ${oq_heat_loop_tick_s}s
    startup_delay: 4000ms
    then:
      - lambda: |-
          oq_heating_curve_runtime::runtime().dispatch_tick({
              (uint32_t) ${oq_heat_loop_curve_s} * 1000UL,
              (uint32_t) ${oq_hp_min_off_s} * 1000UL,
              (int) ${oq_strategy_demand_max_f},
          });
