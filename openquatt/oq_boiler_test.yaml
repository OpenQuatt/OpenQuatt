# ==============================================================================
# OpenQuatt - Boiler Power Test
# ==============================================================================
#
# Goal:
#   Measure effective boiler heat output at stable flow while running inside
#   the shared commissioning CM100 container.
#
# ==============================================================================

# ----------------------------
# INTERNAL STATE
# ----------------------------
globals:
  - id: oq_commissioning_boiler_request
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: oq_commissioning_boiler_request_updated_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  - id: oq_commissioning_result_w
    type: float
    restore_value: false
    initial_value: 'NAN'

  - id: oq_commissioning_result_confidence
    type: float
    restore_value: false
    initial_value: '0.0'

  - id: oq_boiler_power_test_status_value
    type: std::string
    restore_value: false
    initial_value: '"IDLE"'

# ----------------------------
# CONTROL INPUTS
# ----------------------------
number:
  - platform: template
    id: oq_boiler_rated_heat_power
    name: "Boiler rated heat power"
    icon: mdi:radiator
    unit_of_measurement: "W"
    mode: slider
    min_value: 1000
    max_value: 50000
    step: 10
    restore_value: true
    optimistic: true
    initial_value: 6000
    entity_category: config

button:
  - platform: template
    id: oq_boiler_power_test_start
    name: "Boiler Power Test Start"
    internal: true
    icon: mdi:play-circle-outline
    entity_category: config
    on_press:
      - lambda: |-
          oq_boiler_task::runtime().start(oq_boiler_task::default_config(), (uint32_t) millis());

  - platform: template
    id: oq_boiler_power_test_abort
    name: "Boiler Power Test Abort"
    internal: true
    icon: mdi:stop-circle-outline
    entity_category: config
    on_press:
      - lambda: |-
          oq_boiler_task::runtime().abort_or_clear();

  - platform: template
    id: oq_boiler_power_test_apply
    name: "Boiler Power Test Apply"
    internal: true
    icon: mdi:check-circle-outline
    entity_category: config
    on_press:
      - lambda: |-
          oq_boiler_task::runtime().apply_result();

text_sensor:
  - platform: template
    id: oq_boiler_power_test_status
    name: "Boiler power test status"
    internal: true
    entity_category: diagnostic
    update_interval: 1s
    lambda: |-
      return {id(oq_boiler_power_test_status_value)};

# ----------------------------
# MAIN LOOP
# ----------------------------
interval:
  - interval: ${oq_boiler_loop_s}s
    startup_delay: 4600ms
    then:
      - lambda: |-
          // BoilerPowerTestRuntime is the single owner of the CM100 boiler-test state machine,
          // including flow reachability, boiler settle, measurement, failure cleanup and cooldown.
          oq_boiler_task::runtime().tick(
              oq_boiler_task::default_config(),
              (uint32_t) millis(),
              (uint32_t) (${oq_otb_field_timeout_s} * 1000UL));
