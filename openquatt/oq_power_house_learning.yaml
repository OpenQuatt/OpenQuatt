# ==============================================================================
# OpenQuatt – Passive Power House learning
# ==============================================================================
# This package is included only by Heatpump Controller Q Single/Duo.
# Learning itself is passive. The web action can change the two house line
# settings after verifying the proposal still matches the controller's fit.
esphome:
  on_shutdown:
    priority: -100
    then:
      - lambda: |-
          oq_ph_learning::runtime().prepare_restart();

external_components:
  - source:
      type: local
      path: ${external_components_path}
    components: [openquatt_house_learning_status]

openquatt_house_learning_status:
  id: oq_ph_learning_status_endpoint
  web_auth: oq_web_auth_store
  restore_settings:
    - lambda: |-
        oq_ph_learning::runtime().load_manual_line_settings();
  change_line: !lambda |-
    using Result = oq_power_house::manual_line::Result;
    using Reply = esphome::openquatt_house_learning_status::OpenQuattHouseLearningStatus::LineResult;
    const auto result = oq_ph_learning::runtime().change_manual_line(
        {cold, rated, cutoff}, {cold, new_rated, new_cutoff}, restore);
    return static_cast<uint8_t>(result == Result::DONE ? Reply::STORED
                               : result == Result::REFUSED ? Reply::REFUSED : Reply::UNCERTAIN);

openquatt_usage_telemetry:
  house_learning_switch: oq_ph_learning_enabled

switch:
  - platform: template
    id: oq_ph_learning_enabled
    name: "Power House Passive Learning"
    icon: mdi:school-outline
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_off:
      - lambda: |-
          oq_ph_learning::runtime().pause();

# The Q learning package owns writes to these existing preference keys. The
# template setters must not queue an independent write after the guard runs.
number:
  - id: !extend house_cold_temp_c
    optimistic: false
    restore_value: false
    set_action:
      - lambda: |-
          oq_ph_learning::runtime().set_manual_line_number(*id(house_cold_temp_c), x);

  - id: !extend house_rated_power_w
    optimistic: false
    restore_value: false
    set_action:
      - lambda: |-
          oq_ph_learning::runtime().set_manual_line_number(*id(house_rated_power_w), x);

  - id: !extend house_zero_power_temp_c
    optimistic: false
    restore_value: false
    set_action:
      - lambda: |-
          oq_ph_learning::runtime().set_manual_line_number(*id(house_zero_power_temp_c), x);

button:
  - platform: template
    id: oq_ph_learning_reset
    name: "Power House Learning Reset"
    icon: mdi:database-remove-outline
    entity_category: config
    on_press:
      - lambda: |-
          oq_ph_learning::runtime().request_reset();

interval:
  - interval: 250ms
    startup_delay: 30s
    then:
      - lambda: |-
          oq_ph_learning::runtime().update_house_capacity();
  - interval: 10s
    startup_delay: 30s
    then:
      - lambda: |-
          oq_ph_learning::runtime().tick();
