    lambda: |-
      const int message_id = oq_otb::telemetry_state.last_response_id();
      return message_id >= 0 ? (float) message_id : NAN;

  - platform: template
    id: otb_start_tset_requested
    name: "OTB - Start TSet Requested"
    internal: true
    icon: mdi:thermometer-chevron-up
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 1s
    lambda: |-
      if (!oq_otb::start_handshake_state.tset_request_seen()) return NAN;
      return oq_otb::start_handshake_state.requested_tset_c();

  - platform: template
    id: otb_start_tset_accepted
    name: "OTB - Start TSet Accepted"
    internal: true
    icon: mdi:thermometer-check
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 1s
    lambda: |-
      if (!oq_otb::start_handshake_state.tset_ack_seen()) return NAN;
      return oq_otb::start_handshake_state.accepted_tset_c();

text_sensor:
  - platform: template
    id: otb_last_response_type
    name: "OTB - Last Response Type"
    internal: true
    icon: mdi:message-text-outline
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 5s
    lambda: |-
      return {oq_otb::telemetry_state.last_response_type_name()};

  - platform: template
    id: otb_last_transport_error
    name: "OTB - Last Transport Error"
    internal: true
    icon: mdi:alert-decagram-outline
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 5s
    lambda: |-
      return {oq_otb::telemetry_state.last_transport_error_name()};

  - platform: template
    id: otb_start_handshake_state
    name: "OTB - Start Handshake State"
    internal: true
    icon: mdi:message-check-outline
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 1s
    lambda: |-
      return {oq_otb::start_handshake_state.result_name()};

  - platform: template
    id: otb_start_handshake_detail
    name: "OTB - Start Handshake Detail"
    internal: true
    icon: mdi:message-text-fast-outline
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 1s
    lambda: |-
      char detail[128];
      oq_otb::start_handshake_state.format_detail(detail, sizeof(detail));
      return {detail};

interval:
  - interval: ${oq_otb_link_watch_s}s
    startup_delay: 1s
    then:
      - lambda: |-
          const auto handshake_before =
              oq_otb::start_handshake_state.result();
          oq_otb::start_handshake_state.update_timeout(millis());
          if (handshake_before != oq_otb::start_handshake_state.result()) {
            ESP_LOGW(
                "quatt.boiler", "OpenTherm start handshake: %s",
                oq_otb::start_handshake_state.result_name());
          }
          const bool startup_probe_active =
              oq_otb::startup_probe_state.active();
          if (id(oq_otb_startup_probe_active) != startup_probe_active) {
            ESP_LOGW(
                "quatt.boiler",
                "Correcting stale OpenTherm startup-probe mirror");
            id(oq_otb_startup_probe_active) = startup_probe_active;
          }

          const bool opentherm_selected =
              id(oq_boiler_connection).has_state() &&
              id(oq_boiler_connection).current_option() == "OpenTherm";
          const bool keep_polling = oq_otb::should_keep_opentherm_polling(
              opentherm_selected,
              startup_probe_active,
              id(oq_boiler_connection_mismatch_state));
          if (!keep_polling) {
            if (id(oq_otb_hub).is_polling_enabled()) {
              ESP_LOGW(
                  "quatt.boiler",
                  "Stopping stray OpenTherm polling while R1 is selected");
              id(oq_otb_hub).suspend_polling();
            }
            return;
          }
          if (!startup_probe_active) return;

          const uint32_t now_ms = millis();
          const auto result = oq_otb::startup_probe_state.result(
              now_ms,
              (uint32_t) (${oq_otb_startup_probe_timeout_s} * 1000UL));
          if (result == oq_otb::STARTUP_PROBE_RUNNING) return;

          oq_otb::startup_probe_state.end();
          id(oq_otb_startup_probe_active) = false;
          id(boiler_relay).turn_off();
          id(oq_boiler_output_request) = false;
          id(oq_boiler_output_target_temperature_c) = NAN;
          id(oq_boiler_transport_active) = false;
          id(oq_boiler_transport_change_ms) = now_ms;
          id(oq_boiler_transport_settle_required) = true;
          id(oq_boiler_rearm_required) = true;
          id(oq_boiler_rearm_after_command_ms) = now_ms;

          if (result == oq_otb::STARTUP_PROBE_OPENTHERM_DETECTED) {
            if (oq_otb::should_auto_select_opentherm(
                    result, id(oq_setup_complete))) {
              // During onboarding a matching response is positive evidence for
              // the physical OTB route. Select it without creating heat demand;
              // the transport selection hook keeps R1 off and resumes polling.
              id(oq_boiler_connection_auto_selected_state) = true;
              id(oq_boiler_connection_auto_selected).publish_state(true);
              ESP_LOGI(
                  "quatt.boiler",
                  "OpenTherm boiler detected during setup; selecting OpenTherm "
                  "automatically with CH off and TSet=0");
              auto call = id(oq_boiler_connection).make_call();
              call.set_option("OpenTherm");
              call.perform();
              return;
            }

            // Fail closed and retain periodic STATUS(CH=off) traffic. The
            // mismatch is deliberately latched until OpenTherm is selected or
            // a new boot verifies the physically disconnected R1 installation.
            id(oq_boiler_connection_auto_selected_state) = false;
            id(oq_boiler_connection_auto_selected).publish_state(false);
            id(oq_boiler_connection_mismatch_state) = true;
            id(oq_boiler_connection_mismatch).publish_state(true);
            id(oq_boiler_block_reason_code) =
                oq_boiler::BLOCK_CONNECTION_MISMATCH;
            ESP_LOGE(
                "quatt.boiler",
                "OpenTherm boiler detected while R1 is selected; "
                "R1 remains blocked and OpenTherm stays active with CH off");
            return;
          }

          // No valid STATUS response was observed during the bounded probe.
          // This is the only path that makes an R1 selection available.
          id(oq_boiler_connection_auto_selected_state) = false;
          id(oq_boiler_connection_auto_selected).publish_state(false);
          id(oq_boiler_connection_mismatch_state) = false;
          id(oq_boiler_connection_mismatch).publish_state(false);
          id(oq_otb_hub).suspend_polling();
          oq_otb::telemetry_state.reset_link_session();
          id(oq_otb_link_initialized) = true;
          id(oq_otb_link_available_state) = false;
          id(otb_link_available).publish_state(false);
          id(oq_otb_invalidate_telemetry).execute();
          ESP_LOGI(
              "quatt.boiler",
              "No OpenTherm boiler detected during startup verification; "
              "R1 transport may become available after safety settle");

  - interval: ${oq_otb_command_apply_s}s
    startup_delay: 3s
    then:
      - lambda: |-
          // Apply only the central controller output. Selection, link and target
          // checks are repeated here so a lost link cannot leave CH requested
          // while waiting for the slower safety loop.
          const bool opentherm_selected =
              id(oq_boiler_connection).has_state() &&
              id(oq_boiler_connection).current_option() == "OpenTherm";
          const float target_c = id(oq_boiler_output_target_temperature_c);
          const bool target_valid =
              !isnan(target_c) && target_c > 0.0f && target_c <= 90.0f;
          const float flow_lph = id(flow_rate_selected).state;
          const bool flow_valid =
              !isnan(flow_lph) && flow_lph >= ${oq_cm_min_flow_lph};
          const bool status_fresh =
              oq_otb::telemetry_state.field_is_fresh(
                  oq_otb::FIELD_STATUS, millis(),
                  (uint32_t) (${oq_otb_field_timeout_s} * 1000UL));
          const bool command_active =
              opentherm_selected &&
              !id(oq_runtime_polling_paused).state &&
              !id(oq_boiler_runtime_pause_state) &&
              id(oq_otb_link_available_state) &&
              status_fresh &&
              id(oq_boiler_output_request) &&
              target_valid &&
              flow_valid;
          const bool applied_start =
              !id(oq_otb_applied_command_active) && command_active;
          const bool applied_stop =
              id(oq_otb_applied_command_active) && !command_active;

          if (applied_stop) {
            oq_otb::start_handshake_state.cancel();
          }

          if (applied_stop && id(oq_boiler_output_request)) {
            // A fast adapter gate (most notably transient flow loss) may stop
            // the physical OpenTherm request between controller evaluations.
            // Make that real stop visible to the central anti-cycling state.
            id(oq_boiler_output_request) = false;
            id(oq_boiler_output_target_temperature_c) = NAN;
            id(oq_boiler_output_last_change_ms) = millis();
            id(oq_boiler_block_reason_code) =
                flow_valid && target_valid
                    ? oq_boiler::BLOCK_TRANSPORT_UNAVAILABLE
                    : oq_boiler::BLOCK_TARGET_INVALID;
          }
          if (applied_stop && opentherm_selected &&
              id(oq_otb_link_available_state)) {
            // Queue both physical off frames ahead of non-control telemetry.
            // A request/response already on the bus finishes first; the hub
            // restores its normal repeating sequence afterwards.
            id(oq_otb_hub).prioritize_messages(
                esphome::opentherm::MessageId::STATUS,
                esphome::opentherm::MessageId::CH_SETPOINT);
          }

          if (command_active) {
            if (!id(oq_otb_t_set_command).has_state() ||
                fabsf(id(oq_otb_t_set_command).state - target_c) >= 0.05f) {
              auto call = id(oq_otb_t_set_command).make_call();
              call.set_value(target_c);
              call.perform();
            }
            id(oq_otb_ch_enable).turn_on();
            if (applied_start) {
              oq_otb::start_handshake_state.begin(millis());
              ESP_LOGI(
                  "quatt.boiler",
                  "OpenTherm start handshake generation %u began for %.1f C",
                  (unsigned) oq_otb::start_handshake_state.generation(),
                  target_c);
              // A full repeating cycle can take about half a minute. Put the
              // target ahead of the CH-enable STATUS frame after the current
              // conversation finishes. Unlike a fail-safe stop, starting must
              // not truncate an in-flight request or boiler response.
              id(oq_otb_hub).defer_priority_messages(
                  esphome::opentherm::MessageId::CH_SETPOINT,
                  esphome::opentherm::MessageId::STATUS);
            }
          } else {
            id(oq_otb_ch_enable).turn_off();
            if (!id(oq_otb_t_set_command).has_state() ||
                fabsf(id(oq_otb_t_set_command).state) >= 0.05f) {
              auto call = id(oq_otb_t_set_command).make_call();
              call.set_value(0.0f);
              call.perform();
            }
          }
          id(oq_otb_applied_command_active) = command_active;

          if (oq_boiler_transport::otb_may_update_transport(opentherm_selected)) {
            id(oq_boiler_transport_active) = oq_boiler_transport::compute_otb_transport_active(
                id(oq_otb_link_available_state), id(otb_ch_active).has_state(), id(otb_ch_active).state);
          }

  - interval: ${oq_otb_link_watch_s}s
    startup_delay: 2s
    then:
      - lambda: |-
          // Overall link freshness cannot prove that every rotating data ID is
          // still current. Expire repeating fields independently so one healthy
          // response type cannot keep another field looking valid forever.
          if (!id(oq_otb_link_available_state)) return;
          const uint32_t now_ms = millis();
          const uint32_t max_age_ms =
              (uint32_t) (${oq_otb_field_timeout_s} * 1000UL);
          auto field_is_stale = [&](oq_otb::Field field) -> bool {
            return !oq_otb::telemetry_state.field_is_fresh(
                field, now_ms, max_age_ms);
          };
          auto invalidate_sensor = [](auto *value) {
            if (value->has_state() && !isnan(value->state)) {
              value->publish_state(NAN);
            }
          };

           if (field_is_stale(oq_otb::FIELD_STATUS)) {
            id(otb_fault_indication).invalidate_state();
            id(otb_ch_active).invalidate_state();
            id(otb_dhw_active).invalidate_state();
            id(otb_flame_on).invalidate_state();
            id(otb_diagnostic_indication).invalidate_state();
            const bool opentherm_selected_field = id(oq_boiler_connection).has_state() &&
                                                id(oq_boiler_connection).current_option() == "OpenTherm";
            if (oq_boiler_transport::should_clear_on_field_stale(opentherm_selected_field, true)) {
              id(oq_boiler_transport_active) = false;
            }
          }
          if (field_is_stale(oq_otb::FIELD_DEVICE_CONFIG)) {
            id(otb_dhw_present).invalidate_state();
          }
          if (field_is_stale(oq_otb::FIELD_FAULT_FLAGS)) {
            id(otb_service_request).invalidate_state();
            id(otb_lockout_reset).invalidate_state();
            id(otb_low_water_pressure).invalidate_state();
            id(otb_flame_fault).invalidate_state();
            id(otb_air_pressure_fault).invalidate_state();
            id(otb_water_over_temp).invalidate_state();
            invalidate_sensor(id(otb_oem_fault_code));
          }
          if (field_is_stale(oq_otb::FIELD_RELATIVE_MODULATION)) {
            invalidate_sensor(id(otb_relative_modulation));
          }
          if (field_is_stale(oq_otb::FIELD_CH_WATER_PRESSURE)) {
            invalidate_sensor(id(otb_ch_pressure));
          }
          if (field_is_stale(oq_otb::FIELD_BOILER_WATER_TEMPERATURE)) {
            invalidate_sensor(id(otb_boiler_water_temp));
          }
          if (field_is_stale(oq_otb::FIELD_RETURN_WATER_TEMPERATURE)) {
            invalidate_sensor(id(otb_return_water_temp));
          }
          if (field_is_stale(oq_otb::FIELD_DHW_TEMPERATURE)) {
            invalidate_sensor(id(otb_dhw_temp));
          }
          if (field_is_stale(oq_otb::FIELD_OEM_DIAGNOSTIC)) {
            invalidate_sensor(id(otb_oem_diagnostic_code));
          }
          if (field_is_stale(oq_otb::FIELD_MAX_BOILER_CAPACITY)) {
            invalidate_sensor(id(otb_max_capacity));
            invalidate_sensor(id(otb_min_modulation));
          }
          if (field_is_stale(oq_otb::FIELD_OT_VERSION_DEVICE)) {
            invalidate_sensor(id(otb_opentherm_version));
          }
          if (field_is_stale(oq_otb::FIELD_VERSION_DEVICE)) {
            invalidate_sensor(id(otb_device_type));
            invalidate_sensor(id(otb_device_version));
          }

  - interval: ${oq_otb_link_watch_s}s
    startup_delay: 2s
    then:
      - lambda: |-
          // Phase 1: require recent complete frames and a fresh mandatory STATUS.
          const uint32_t now_ms = millis();
          // STATUS (ID 0) is mandatory and control-critical. Optional fields
          // may be unsupported without taking down the link, but an invalid or
          // stale STATUS response means the transport is not safe to actuate.
          oq_otb::telemetry_state.expire_response_session_if_stale(
              now_ms,
              (uint32_t) (${oq_otb_link_timeout_s} * 1000UL));
          const bool available =
              oq_otb::telemetry_state.transport_is_available(
                  now_ms,
                  (uint32_t) (${oq_otb_link_timeout_s} * 1000UL),
                  (uint32_t) (${oq_otb_field_timeout_s} * 1000UL));
          const bool link_changed =
              !id(oq_otb_link_initialized) ||
              available != id(oq_otb_link_available_state);
          if (!link_changed) return;

          id(oq_otb_link_initialized) = true;
          id(oq_otb_link_available_state) = available;
          id(otb_link_available).publish_state(available);
          ESP_LOGI("quatt.otb", "Boiler OpenTherm link %s", available ? "available" : "unavailable");

          // Any link edge invalidates the last actuator decision. On loss this
          // withdraws CH/TSet immediately; on recovery it prevents an old
          // request from being replayed before the heating strategy runs again.
          const bool opentherm_selected =
              id(oq_boiler_connection).has_state() &&
              id(oq_boiler_connection).current_option() == "OpenTherm";
          if (opentherm_selected) {
            id(oq_boiler_transport_change_ms) = now_ms;
            id(oq_boiler_transport_settle_required) = true;
            if (id(oq_boiler_output_request)) {
              id(oq_boiler_output_request) = false;
              id(oq_boiler_output_last_change_ms) = now_ms;
            }
            id(oq_boiler_output_target_temperature_c) = NAN;
            id(oq_boiler_transport_active) = false;
            id(oq_boiler_rearm_required) = true;
            // Require an originating decision strictly after this link edge;
            // a strategy result queued before the edge must not restart CH.
            id(oq_boiler_rearm_after_command_ms) = now_ms;
            id(oq_boiler_block_reason_code) = available
                ? oq_boiler::BLOCK_AWAITING_FRESH_COMMAND
                : oq_boiler::BLOCK_TRANSPORT_UNAVAILABLE;
            id(oq_otb_ch_enable).turn_off();
            if (!id(oq_otb_t_set_command).has_state() ||
                fabsf(id(oq_otb_t_set_command).state) >= 0.05f) {
              auto call = id(oq_otb_t_set_command).make_call();
              call.set_value(0.0f);
              call.perform();
            }
          }

          // Phase 2: prevent stale operational values from looking current after link loss.
          if (available) return;
          id(oq_otb_invalidate_telemetry).execute();
