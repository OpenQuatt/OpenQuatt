# ==============================================================================
# OpenQuatt – OpenTherm Boiler (OTB) master, transport and telemetry
# ==============================================================================
#
# Q-hardware-only OpenTherm master. CH follows only the centrally validated
# BoilerCommand output request while this transport is selected. DHW permission
# remains enabled so OpenQuatt does not disable normal tap-water operation.
# ==============================================================================

external_components:
  - source:
      type: local
      path: ${external_components_path}
    components: [opentherm]

esphome:
  includes:
    - ../../openquatt/includes/boiler/oq_boiler_transport_logic.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // The OpenTherm hub is runtime-owned by the installation choice. A
          // normal R1 installation must not poll an unconnected boiler bus.
          oq_otb::telemetry_state.reset_link_session();
          oq_otb::start_handshake_state.reset();
          id(oq_otb_link_initialized) = true;
          id(oq_otb_link_available_state) = false;
          id(otb_link_available).publish_state(false);
          id(oq_otb_hub_ready) = true;
          id(oq_otb_ch_enable).turn_off();
          {
            auto call = id(oq_otb_t_set_command).make_call();
            call.set_value(0.0f);
            call.perform();
          }
          const bool opentherm_selected =
              id(oq_boiler_connection).has_state() &&
              id(oq_boiler_connection).current_option() == "OpenTherm";
          if (opentherm_selected) {
            oq_otb::startup_probe_state.end();
            id(oq_otb_startup_probe_active) = false;
            id(oq_boiler_connection_mismatch_state) = false;
            id(oq_boiler_connection_mismatch).publish_state(false);
            id(oq_otb_hub).resume_polling();
          } else {
            // Before R1 can become available, actively check whether an
            // OpenTherm boiler is physically responding. STATUS(CH=off) and
            // TSet=0 are prioritized; a matching complete STATUS response
            // latches the connection, including a valid negative acknowledgement.
            oq_otb::startup_probe_state.begin(millis());
            id(oq_otb_startup_probe_active) = true;
            id(oq_boiler_connection_mismatch_state) = false;
            id(oq_boiler_connection_mismatch).publish_state(false);
            id(boiler_relay).turn_off();
            id(oq_otb_hub).start_priority_polling(
                esphome::opentherm::MessageId::STATUS,
                esphome::opentherm::MessageId::CH_SETPOINT);
          }
  on_shutdown:
    priority: 700
    then:
      - lambda: |-
          // A normal shutdown gets one bounded opportunity to deliver and
          // acknowledge STATUS(CH=off) plus TSet=0 before the hub is stopped.
          // Hard power loss remains inherently fail-silent.
          id(oq_otb_withdraw_and_flush).execute();
          oq_otb::startup_probe_state.end();
          id(oq_otb_startup_probe_active) = false;
          id(oq_boiler_transport_active) = false;

logger:
  on_message:
    level: WARN
    then:
      - lambda: |-
          if (id(oq_otb_startup_probe_active) &&
              id(oq_boiler_connection).has_state() &&
              id(oq_boiler_connection).current_option() == "R1") {
            return;
          }
          oq_otb::telemetry_state.record_log_message(
              millis(), tag, message);

globals:
  # The restored Boiler connection select is set up before the OpenTherm hub.
  # Its boot callback must not dereference the hub until component setup ended.
  - id: oq_otb_hub_ready
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: oq_otb_link_initialized
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: oq_otb_applied_command_active
    type: bool
    restore_value: false
    initial_value: 'false'

  # Runtime-only UI context. The selected connection itself remains restored;
  # this flag only explains an automatic choice made during this boot.
  - id: oq_boiler_connection_auto_selected_state
    type: bool
    restore_value: false
    initial_value: 'false'

opentherm:
  - id: oq_otb_hub
    in_pin: ${oq_ot_boiler_in_pin}
    out_pin: ${oq_ot_boiler_out_pin}
    # Keep the application loop asynchronous. A missing boiler response may
    # take up to 800 ms; sync mode would block Modbus, API and web handling for
    # that entire interval. RX reliability remains an explicit release gate.
    sync_mode: false
    # The runtime switch is default-off and owns the actual STATUS bit. The hub
    # gate must be true or ESPHome would mask that switch permanently.
    ch_enable: true
    dhw_enable: true
    cooling_enable: false
    otc_active: false
    ch2_active: false
    summer_mode_active: false
    dhw_block: false
    before_send:
      then:
        - lambda: |-
            oq_otb::off_flush_state.record_request(
                x.id, x.type, x.valueHB, x.valueLB);
            oq_otb::startup_probe_state.record_request(
                x.id, x.type, x.valueHB, x.valueLB);
            oq_otb::telemetry_state.record_request(x.id, x.type);
            oq_otb::start_handshake_state.record_request(
                x.id, x.type, x.valueHB, x.valueLB);
    before_process_response:
      then:
        - lambda: |-
            // Called only after the hub accepted a complete OpenTherm frame.
            // A negative acknowledgement still proves that the link is alive,
            // but its zero payload is not a measurement. Invalidate the affected
            // entities and hide the frame from ESPHome's payload-only processor.
            const uint8_t response_id = x.id;
            const uint8_t response_type = x.type;
            const auto handshake_before =
                oq_otb::start_handshake_state.result();
            oq_otb::telemetry_state.record_response(
                millis(), response_id, response_type);
            oq_otb::start_handshake_state.record_response(
                response_id, response_type, x.valueHB, x.valueLB);

            if (oq_otb::telemetry_state.last_response_is_correlated()) {
              oq_otb::off_flush_state.record_response(
                  response_id, response_type, x.valueHB, x.valueLB);
              oq_otb::startup_probe_state.record_response(
                  response_id, response_type);
            }
            if (handshake_before != oq_otb::start_handshake_state.result()) {
              char detail[128];
              oq_otb::start_handshake_state.format_detail(
                  detail, sizeof(detail));
              ESP_LOGI(
                  "quatt.boiler", "OpenTherm start handshake: %s (%s)",
                  oq_otb::start_handshake_state.result_name(), detail);
            }

            if (oq_otb::telemetry_state.last_response_payload_is_usable()) return;

            switch (oq_otb::telemetry_state.last_request_id()) {
              case esphome::opentherm::MessageId::STATUS:
                id(otb_fault_indication).invalidate_state();
                id(otb_ch_active).invalidate_state();
                id(otb_dhw_active).invalidate_state();
                id(otb_flame_on).invalidate_state();
                id(otb_diagnostic_indication).invalidate_state();
                id(oq_boiler_transport_active) = false;
                break;
              case esphome::opentherm::MessageId::DEVICE_CONFIG:
                id(otb_dhw_present).invalidate_state();
                break;
              case esphome::opentherm::MessageId::FAULT_FLAGS:
                id(otb_service_request).invalidate_state();
                id(otb_lockout_reset).invalidate_state();
                id(otb_low_water_pressure).invalidate_state();
                id(otb_flame_fault).invalidate_state();
                id(otb_air_pressure_fault).invalidate_state();
                id(otb_water_over_temp).invalidate_state();
                id(otb_oem_fault_code).publish_state(NAN);
                break;
              case esphome::opentherm::MessageId::MAX_BOILER_CAPACITY:
                id(otb_max_capacity).publish_state(NAN);
                id(otb_min_modulation).publish_state(NAN);
                break;
              case esphome::opentherm::MessageId::MODULATION_LEVEL:
                id(otb_relative_modulation).publish_state(NAN);
                break;
              case esphome::opentherm::MessageId::CH_WATER_PRESSURE:
                id(otb_ch_pressure).publish_state(NAN);
                break;
              case esphome::opentherm::MessageId::FEED_TEMP:
                id(otb_boiler_water_temp).publish_state(NAN);
                break;
              case esphome::opentherm::MessageId::DHW_TEMP:
                id(otb_dhw_temp).publish_state(NAN);
                break;
              case esphome::opentherm::MessageId::RETURN_WATER_TEMP:
                id(otb_return_water_temp).publish_state(NAN);
                break;
              case esphome::opentherm::MessageId::OEM_DIAGNOSTIC:
                id(otb_oem_diagnostic_code).publish_state(NAN);
                break;
              case esphome::opentherm::MessageId::OT_VERSION_DEVICE:
                id(otb_opentherm_version).publish_state(NAN);
                break;
              case esphome::opentherm::MessageId::VERSION_DEVICE:
                id(otb_device_type).publish_state(NAN);
                id(otb_device_version).publish_state(NAN);
                break;
              default:
                break;
            }
            x.id = 0xFF;

script:
  - id: oq_otb_withdraw_and_flush
    mode: single
    then:
      - lambda: |-
          // Phase 1: withdraw the local command before sending any new frame.
          // A fresh link is the runtime proof that the hub can converse.
          // Component::is_in_loop_state() is deliberately not used here:
          // runtime transport gating can report LOOP_DONE during this edge
          // even though the active session still needs its final off frames.
          const bool can_confirm =
              id(oq_otb_hub_ready) &&
              id(oq_otb_link_available_state);
          if (can_confirm) {
            oq_otb::off_flush_state.begin();
          }

          id(oq_otb_ch_enable).turn_off();
          auto call = id(oq_otb_t_set_command).make_call();
          call.set_value(0.0f);
          call.perform();

          if (!can_confirm) return;
          id(oq_otb_hub).prioritize_messages(
              esphome::opentherm::MessageId::STATUS,
              esphome::opentherm::MessageId::CH_SETPOINT);

          // Phase 2: finish any active exchange, then advance only the OT hub
          // until both off requests are acknowledged or the bounded shutdown
          // budget is exhausted. The extra budget covers one full pre-existing
          // conversation without allowing overlapping bus traffic.
          constexpr uint32_t flush_timeout_ms = 4500;
          const uint32_t started_ms = millis();
          while (!oq_otb::off_flush_state.complete() &&
                 (uint32_t) (millis() - started_ms) < flush_timeout_ms) {
            id(oq_otb_hub).loop();
            App.feed_wdt();
            delay(1);
          }

          // Phase 3: retain a clear diagnostic without blocking shutdown.
          const uint32_t elapsed_ms =
              (uint32_t) (millis() - started_ms);
          if (oq_otb::off_flush_state.complete()) {
            ESP_LOGI(
                "quatt.boiler",
                "OpenTherm off handshake acknowledged in %u ms",
                (unsigned) elapsed_ms);
          } else {
            ESP_LOGW(
                "quatt.boiler",
                "OpenTherm off handshake timed out after %u ms "
                "(STATUS=%s, TSet=%s)",
                (unsigned) elapsed_ms,
                YESNO(oq_otb::off_flush_state.status_off_acknowledged()),
                YESNO(oq_otb::off_flush_state.setpoint_zero_acknowledged()));
          }
          oq_otb::off_flush_state.end();

  - id: oq_otb_invalidate_telemetry
    mode: restart
    then:
      - lambda: |-
          // Invalidate every binary capability, activity and fault field.
          id(otb_fault_indication).invalidate_state();
          id(otb_ch_active).invalidate_state();
          id(otb_dhw_active).invalidate_state();
          id(otb_flame_on).invalidate_state();
          id(otb_diagnostic_indication).invalidate_state();
          id(otb_dhw_present).invalidate_state();
          id(otb_service_request).invalidate_state();
          id(otb_lockout_reset).invalidate_state();
          id(otb_low_water_pressure).invalidate_state();
          id(otb_flame_fault).invalidate_state();
          id(otb_air_pressure_fault).invalidate_state();
          id(otb_water_over_temp).invalidate_state();
          // Publish unknown for every numeric operational and identity field.
          id(otb_relative_modulation).publish_state(NAN);
          id(otb_ch_pressure).publish_state(NAN);
          id(otb_boiler_water_temp).publish_state(NAN);
          id(otb_return_water_temp).publish_state(NAN);
          id(otb_dhw_temp).publish_state(NAN);
          id(otb_oem_fault_code).publish_state(NAN);
          id(otb_oem_diagnostic_code).publish_state(NAN);
          id(otb_max_capacity).publish_state(NAN);
          id(otb_min_modulation).publish_state(NAN);
          id(otb_opentherm_version).publish_state(NAN);
          id(otb_device_type).publish_state(NAN);
          id(otb_device_version).publish_state(NAN);
          id(oq_boiler_transport_active) = false;

number:
  - platform: opentherm
    opentherm_id: oq_otb_hub
    t_set:
      id: oq_otb_t_set_command
      name: "OTB - Control Setpoint Command"
      internal: true
      entity_category: diagnostic
      icon: mdi:thermostat
      min_value: 0
      max_value: 90
      step: 0.1
      initial_value: 0
      restore_value: false

switch:
  - platform: opentherm
    opentherm_id: oq_otb_hub
    ch_enable:
      id: oq_otb_ch_enable
      name: "OTB - Central Heating Command"
      internal: true
      entity_category: diagnostic
      restore_mode: ALWAYS_OFF
      icon: mdi:radiator

# Keep Home Assistant lean: expose primary operational values by default,
# publish secondary status as disabled-by-default, and keep service/protocol
# telemetry internal. The OpenQuatt entity endpoint deliberately includes
# internal entities, so local diagnostics retain access to that telemetry.
binary_sensor:
  - platform: template
    id: oq_boiler_connection_auto_selected
    name: "OTB - Boiler Connection Auto-selected"
    internal: true
    entity_category: diagnostic
    icon: mdi:auto-fix
    lambda: |-
      return id(oq_boiler_connection_auto_selected_state);

  - platform: template
    id: oq_boiler_connection_mismatch
    name: "OTB - Boiler Connection Mismatch"
    internal: true
    device_class: problem
    entity_category: diagnostic
    icon: mdi:connection
    lambda: |-
      return id(oq_boiler_connection_mismatch_state);

  - platform: template
    id: otb_link_available
    name: "OTB - Boiler Link Available"
    icon: mdi:link-variant
    device_class: connectivity
    entity_category: diagnostic

  - platform: opentherm
    opentherm_id: oq_otb_hub
    fault_indication:
      id: otb_fault_indication
      name: "OTB - Fault Indication"
      entity_category: diagnostic
      disabled_by_default: true
    ch_active:
      id: otb_ch_active
      name: "OTB - Central Heating Active"
    dhw_active:
      id: otb_dhw_active
      name: "OTB - Domestic Hot Water Active"
      disabled_by_default: true
    flame_on:
      id: otb_flame_on
      name: "OTB - Flame On"
    diagnostic_indication:
      id: otb_diagnostic_indication
      name: "OTB - Diagnostic Indication"
      entity_category: diagnostic
      disabled_by_default: true
    dhw_present:
      id: otb_dhw_present
      name: "OTB - DHW Present"
      internal: true
      entity_category: diagnostic
    service_request:
      id: otb_service_request
      name: "OTB - Service Required"
      entity_category: diagnostic
      disabled_by_default: true
    lockout_reset:
      id: otb_lockout_reset
      name: "OTB - Lockout Reset"
