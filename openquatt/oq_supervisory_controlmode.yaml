# ==============================================================================
# OpenQuatt – Supervisory Control Modes
# ==============================================================================
#
# Goal:
#   Determines the active Control Mode (CM) as central state machine and publishes the system decision to the other packages.
#
# Role in architecture:
#   Single owner of Control Mode; coordinates subsystems by selecting CM (CM0/CM1/CM2/CM3/CM4/CM5/CM98/CM100).
#
# What this package DOES do:
#   - Determines base mode (idle / heating / cooling / frost) based on demand and conditions
#   - Applies flow override: with insufficient flow -> CM1 (holding)
#   - Supports test overrides: Force CM0/CM1/CM98 (auto-expire)
#   - Exposes CM100 commissioning when a service task is explicitly requested
#   - Automatically switches CM2 <-> CM3 based on thermal deficit (`oq_P_deficit_w`) with timers/hysteresis
#   - Publishes current CM as text_sensor (for example 'CM2', 'CM3', 'CM5', 'CM100')
#
# What this package DOES NOT do:
#   - Does not control compressor levels directly (heat-control does)
#   - Does not control pump PWM directly (flow-control does)
#   - Implements no temperature control (handled by climate PID)
#
# Key assumptions:
#   - Strategy status is available via the shared `oq_strategy_*` contract
#   - Thermal deficit (`oq_P_deficit_w`) is computed by the active strategy path for CM2<->CM3 promotion/demotion
#   - Flow signal is available and sufficiently reliable for flow override
#
# Interaction with Control Modes:
#   - CM0: idle (no heat demand)
#   - CM1: holding (heat demand but insufficient flow)
#   - CM2: heating (HP only)
#   - CM3: heating (HP + boiler auxiliary heating)
#   - CM4: heating (boiler-only fallback after a confirmed HP incident)
#   - CM5: cooling
#   - CM98: frost
#   - CM100: commissioning / service task container
#
# Safety / fail-safe:
#   - Flow override always has priority: at low flow, CM1 is enforced
#   - Timers/hysteresis prevent oscillation between CM2 and CM3
#   - Power limiter catches overshoot with conservative demand-cap fallback on NaN power input
#
# ==============================================================================

esphome:
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            constexpr std::array<uint32_t, 1> retired_frost_preferences{{
                2881445393U,
            }};
            oq_nvs_cleanup::erase_esphome_preferences(
                retired_frost_preferences, "legacy frost hysteresis");
        - lambda: |-
            id(oq_electrical_current_limit_a).traits.set_max_value(
                oq_supervisory_power_runtime::maximum_current_a(
                    ${oq_duo_current_limit_v1_a}, ${oq_duo_current_limit_v2_a}, ${oq_duo_current_limit_v2_max_a}));
    - priority: -100
      then:
        - lambda: |-
            if (!id(oq_aux_heat_source_policy_migrated)) {
              const bool legacy_source_present = id(oq_boiler_assist_enabled).state;
              if (legacy_source_present) {
                id(oq_aux_heat_source_present).turn_on();
              } else {
                id(oq_aux_heat_source_present).turn_off();
              }
              id(oq_aux_heat_source_policy_migrated) = true;
            }

# ----------------------------
# TIME
# ----------------------------
time:
  - platform: sntp
    id: oq_time
    timezone: Europe/Amsterdam

# ----------------------------
# INTERNAL STATE
# ----------------------------
globals:
  # One-time split of the legacy combined boiler-present/assist switch. The
  # existing assist state seeds physical presence; assist and fallback retain
  # their own restored values.
  - id: oq_aux_heat_source_policy_migrated
    type: bool
    restore_value: true
    initial_value: 'false'

  # Runtime-only frost hysteresis. The first evaluation starts conservatively
  # at the off-threshold, so a reboot cannot weaken frost protection.
  - id: oq_cm_frost_prev
    type: bool
    restore_value: false
    initial_value: 'false'

  # Pre/Postflow timer (CM1)
  - id: oq_cm1_until_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: oq_cm1_next_after
    type: int
    restore_value: false
    initial_value: '0'  # 0=CM0, 2=CM2, 4=CM4, 5=CM5, 98=CM98
  # Shared flow interlock state; timer ownership lives in the C++ safety runtime.
  - id: oq_lowflow_fault_active
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: oq_cm2_idle_since_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: oq_cm2_reentry_block_until_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: oq_lowload_heat_latch
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: oq_cm2_entered_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: oq_ph_start_confirm_since_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # One cold-start session per continuous heating request. Only a fresh ODU
  # outlet sample taken after circulation starts may release the compressor.
  - id: oq_cold_start_session_active
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: oq_cold_start_pending
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: oq_cold_start_sample_after_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: oq_cold_start_hp_blocked
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: oq_cold_start_assist_active
    type: bool
    restore_value: false
    initial_value: 'false'

  # Sticky Pump Protection (CM0-only)
  - id: oq_cm0_since_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: oq_sticky_until_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # ----------------------------
  # Boiler assist (CM3) state machine timers
  - id: oq_cm_last_change_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  - id: oq_cm3_need_since_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: oq_cm3_demote_since_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  # ----------------------------
  # Supervisory override (test/commissioning)
  # AUTO / FORCE_CM0 / FORCE_CM1 / FORCE_CM98 (auto-expire)
  - id: oq_override_last_mode
    type: int
    restore_value: false
    initial_value: '0'  # 0=AUTO,1=CM0,2=CM1,3=CM98
  - id: oq_override_since_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: oq_control_mode_code
    type: int
    restore_value: false
    initial_value: '0'  # 0,1,2,3,4,5,98,100

  # Attribute all electrical input from cooling preflow through postflow to the cooling session.
  - id: oq_cooling_energy_session_active
    type: bool
    restore_value: false
    initial_value: 'false'

  # ----------------------------
  # Electrical input limiter - total demand cap
  # Cap is applied to total filtered demand f (0..20) before HP split.
  - id: oq_power_cap_f
    type: int
    restore_value: false
    initial_value: '20'

  # NaN means that the user has not overridden the generation-dependent default.
  - id: oq_electrical_current_limit_configured_a
    type: float
    restore_value: true
    initial_value: 'NAN'

  # One calculated threshold set is shared by supervisory feedback and Power House.
  - id: oq_power_limit_soft_w
    type: float
    restore_value: false
    initial_value: '3400.0'
  - id: oq_power_limit_peak_w
    type: float
    restore_value: false
    initial_value: '3650.0'
  - id: oq_power_limit_recover_w
    type: float
    restore_value: false
    initial_value: '3300.0'

  # DEBUG-RUNTIME START: Power House low-load diagnostics
  # Dynamic low-load diagnostics (Power House)
  - id: oq_low_load_pmin_dyn_w
    type: float
    restore_value: false
    initial_value: 'NAN'
  - id: oq_low_load_pmin_dyn_lkg_w
    type: float
    restore_value: false
    initial_value: 'NAN'
  - id: oq_low_load_off_dyn_w
    type: float
    restore_value: false
    initial_value: 'NAN'
  - id: oq_low_load_on_dyn_w
    type: float
    restore_value: false
    initial_value: 'NAN'
  - id: oq_low_load_dyn_last_valid_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: oq_low_load_dyn_source_state
    type: int
    restore_value: false
    initial_value: '0'  # 0=inactive,1=live,2=cached,3=fallback
  # DEBUG-RUNTIME END

# ----------------------------
# CONTROL INPUTS
# ----------------------------
select:
  - platform: template
    id: oq_cm_override
    name: "CM Override"
    icon: mdi:state-machine
    options:
      - Auto
      - Force CM0
      - Force CM1
      - Force CM98
    initial_option: Auto
    restore_value: false
    optimistic: true
    entity_category: config

  - platform: template
    id: oq_silent_mode_override
    name: "Silent Mode Override"
    icon: mdi:weather-night
    entity_category: config
    options:
      - "Schedule"
      - "On"
      - "Off"
    initial_option: "Schedule"
    restore_value: true
    optimistic: true

switch:
  - platform: template
    id: oq_aux_heat_source_present
    name: "Auxiliary heat source connected"
    icon: mdi:heating-coil
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    entity_category: config
    on_turn_off:
      # Physical absence is the top-level fail-closed gate. Also clear both
      # permissions so a later reconnect requires an explicit choice.
      - switch.turn_off: oq_boiler_assist_enabled
      - switch.turn_off: oq_boiler_fault_fallback_enabled

  - platform: template
    id: oq_boiler_assist_enabled
    name: "Boiler assist enabled"
    icon: mdi:water-boiler
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    entity_category: config
    on_turn_on:
      - if:
          condition:
            lambda: |-
              return !id(oq_aux_heat_source_present).state;
          then:
            - switch.turn_off: oq_boiler_assist_enabled

  - platform: template
    id: oq_boiler_fault_fallback_enabled
    name: "Boiler fallback on heat-pump fault"
    icon: mdi:shield-home
    # Deliberately opt-in while the incident catalogue and hardware recovery
    # behaviour are validated on real Single and Duo installations.
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    entity_category: config
    on_turn_on:
      - if:
          condition:
            lambda: |-
              return !id(oq_aux_heat_source_present).state;
          then:
            - switch.turn_off: oq_boiler_fault_fallback_enabled

  - platform: template
    id: oq_enabled
    name: "OpenQuatt Enabled"
    icon: mdi:power-standby
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    on_turn_on:
      then:
        - datetime.datetime.set:
            id: oq_openquatt_resume_at
            datetime: "2000-01-01 00:00:00"
# ----------------------------
# TUNING
# ----------------------------
# Sticky pump iPWM is a fixed compile-time fallback for CM0 sticky circulation.
number:
  - platform: template
    id: oq_silent_max_frequency_hz
    name: "Silent max frequency"
    icon: mdi:speedometer-slow
    unit_of_measurement: "Hz"
    min_value: 0
    max_value: 120
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 67
    entity_category: config

  - platform: template
    id: oq_day_max_frequency_hz
    name: "Day max frequency"
    icon: mdi:speedometer
    unit_of_measurement: "Hz"
    min_value: 0
    max_value: 120
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 90
    entity_category: config

  - platform: template
    id: oq_electrical_current_limit_a
    name: "Electrical current limit"
    icon: mdi:current-ac
    unit_of_measurement: "A"
    min_value: ${oq_electrical_current_limit_min_a}
    # Absolute technische bovengrens (26 A voor Duo V2). De
    # installatieafhankelijke standaard (16 A Single/Duo V1/V1.5, 20 A Duo V2)
    # is een waarschuwingsgrens; waarden daarboven worden in de web-app
    # expliciet bevestigd. Single, Duo V1/V1.5 (tot 20 A) en Duo met onbekende
    # generatie (tot 16 A) blijven conservatief via traits.
    max_value: ${oq_duo_current_limit_v2_max_a}
    step: 0.5
    update_interval: ${oq_supervisory_loop_s}s
    entity_category: config
    lambda: |-
      const float max_current_a = oq_supervisory_power_runtime::maximum_current_a(
          ${oq_duo_current_limit_v1_a}, ${oq_duo_current_limit_v2_a}, ${oq_duo_current_limit_v2_max_a});
      id(oq_electrical_current_limit_a).traits.set_max_value(max_current_a);
      return oq_supervisory_power_runtime::configured_current_a(
          ${oq_electrical_current_limit_min_a}, ${oq_duo_current_limit_v1_a}, ${oq_duo_current_limit_v2_a},
          ${oq_duo_current_limit_v2_max_a});
    set_action:
      then:
        - lambda: |-
            const float max_current_a = oq_supervisory_power_runtime::maximum_current_a(
                ${oq_duo_current_limit_v1_a}, ${oq_duo_current_limit_v2_a}, ${oq_duo_current_limit_v2_max_a});
            id(oq_electrical_current_limit_a).traits.set_max_value(max_current_a);
            const float configured_a = oq_supervisory_power::effective_current_a(
                x, ${oq_electrical_current_limit_min_a}, max_current_a);
            id(oq_electrical_current_limit_configured_a) = configured_a;
            id(oq_electrical_current_limit_a).publish_state(configured_a);

  - platform: template
    id: oq_cm3_deficit_on_w
    name: "CM3 deficit ON threshold"
    icon: mdi:arrow-up-bold
    unit_of_measurement: "W"
    min_value: 0
    max_value: 10000
    step: 50
    optimistic: true
    restore_value: true
    initial_value: 1000
    entity_category: config

  - platform: template
    id: oq_cm3_deficit_off_w
    name: "CM3 deficit OFF threshold"
    icon: mdi:arrow-down-bold
    unit_of_measurement: "W"
    min_value: 0
    max_value: 10000
    step: 50
    optimistic: true
    restore_value: true
    initial_value: 400
    entity_category: config

  - platform: template
    id: oq_low_load_dyn_off_factor
    name: "Low-load dynamic OFF factor"
    internal: true
    min_value: 0.60
    max_value: 0.90
    step: 0.05
    optimistic: true
    restore_value: true
    initial_value: 0.75

  - platform: template
    id: oq_low_load_dyn_on_factor
    name: "Low-load dynamic ON factor"
    internal: true
    min_value: 0.85
    max_value: 1.10
    step: 0.05
    optimistic: true
    restore_value: true
    initial_value: 1.0

  - platform: template
    id: oq_low_load_min_hysteresis_w
    name: "Low-load minimum hysteresis"
    internal: true
    unit_of_measurement: "W"
    min_value: 100
    max_value: 400
    step: 25
    optimistic: true
    restore_value: true
    initial_value: 200

  - platform: template
    id: oq_low_load_reentry_block_s
    name: "Low-load CM2 re-entry block"
    internal: true
    unit_of_measurement: "s"
    min_value: 0
    max_value: 900
    step: 5
    optimistic: true
    restore_value: true
    initial_value: 300
# ----------------------------
# SCHEDULE INPUTS
# ----------------------------
datetime:
  - platform: template
    id: oq_silent_start_time
    name: "Silent start time"
    type: time
    optimistic: true
    restore_value: true
    initial_value: "19:00:00"
    entity_category: config

  - platform: template
    id: oq_silent_end_time
    name: "Silent end time"
    type: time
    optimistic: true
    restore_value: true
    initial_value: "07:00:00"
    entity_category: config

  - platform: template
    id: oq_openquatt_resume_at
    name: "OpenQuatt resume at"
    type: datetime
    optimistic: true
    restore_value: true
    initial_value: "2000-01-01 00:00:00"
    entity_category: config
# ----------------------------
# DIAGNOSTICS
# ----------------------------
binary_sensor:
  - platform: template
    id: oq_silent_active
    name: "Silent active"
    icon: mdi:weather-night
    device_class: running
    entity_category: diagnostic

  - platform: template
    id: oq_sticky_active
    name: "Sticky pump active"
    icon: mdi:timer-cog
    device_class: running
    entity_category: diagnostic

  - platform: template
    id: oq_lowflow_fault_active_bs
    name: "Lowflow fault active"
    icon: mdi:water-alert
    device_class: problem
    entity_category: diagnostic

text_sensor:
  - platform: template
    id: oq_control_mode
    name: "Control Mode"
    icon: mdi:state-machine

  - platform: template
    id: oq_control_mode_label
    name: "Control Mode (Label)"
    icon: mdi:format-list-bulleted
    update_interval: never
    entity_category: diagnostic

  - platform: template
    id: oq_time_now_hhmm
    name: "Time now (HH:MM)"
    internal: true
    update_interval: never

  - platform: template
    id: oq_silent_window_hhmm
    name: "Silent window (start-end)"
    internal: true
    update_interval: never

  - platform: template
    id: oq_silent_status
    name: "Silent status"
    internal: true
    update_interval: never

  # DEBUG-RUNTIME START: Power House low-load diagnostics
  - platform: template
    id: oq_low_load_dyn_status
    name: "Low-load dynamic thresholds"
    internal: true
    update_interval: ${oq_diagnostic_update_interval_s}s
    lambda: |-
      // Read the active threshold set from diagnostics.
      const float pmin = id(oq_low_load_pmin_dyn_w);
      const float off  = id(oq_low_load_off_dyn_w);
      const float on   = id(oq_low_load_on_dyn_w);
      const int source_state = id(oq_low_load_dyn_source_state);

      // Render a short operator-facing status string.
      char b[112];
      if (source_state == 0) {
        snprintf(b, sizeof(b), "inactive (Power House only)");
      } else if (source_state == 3 || isnan(pmin) || isnan(off) || isnan(on)) {
        snprintf(b, sizeof(b), "dynamic: n/a (fallback in use)");
      } else if (source_state == 2) {
        snprintf(b, sizeof(b), "pmin=%.0fW off=%.0fW on=%.0fW (cached)", pmin, off, on);
      } else {
        snprintf(b, sizeof(b), "pmin=%.0fW off=%.0fW on=%.0fW", pmin, off, on);
      }
      return std::string(b);
  # DEBUG-RUNTIME END
sensor:
  - platform: template
    id: power_cap_level
    name: "Power cap demand"
    internal: true
    unit_of_measurement: "step"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: ${oq_diagnostic_update_interval_s}s
    lambda: |-
      return (float) id(oq_power_cap_f);

# ----------------------------
# MAIN LOOP
# ----------------------------
interval:
  - interval: ${oq_supervisory_loop_s}s
    startup_delay: 0s
    then:
      - lambda: |-
          // YAML binds compile-time configuration; C++ owns state, decisions, and side effects.
          oq_supervisory_state_runtime::runtime().tick({
              ${oq_supervisory_loop_s},
              ${oq_duo_current_limit_v1_a},
              ${oq_duo_current_limit_v2_a},
              ${oq_duo_current_limit_v2_max_a},
              ${oq_electrical_current_limit_min_a},
              ${oq_mains_voltage_v},
              ${oq_power_peak_trip_s},
              ${oq_power_soft_trip_s},
              ${oq_power_recover_s},
              ${oq_power_measurement_stale_s},
              ${oq_power_cap_nan_f},
              ${oq_power_cap_max_f},
              ${oq_cm_prepost_s},
              ${oq_cm_min_flow_lph},
              ${oq_low_load_fallback_off_w},
              ${oq_low_load_fallback_on_w},
              ${oq_low_load_dyn_cache_max_s},
              ${oq_ph_start_confirm_s},
              ${oq_cm2_idle_exit_s},
              ${oq_cm2_min_run_s},
              ${oq_cm_flow_fault_s},
              ${oq_cm_flow_recover_s},
              ${oq_cm_frost_on_c},
              ${oq_cm_frost_off_c},
              ${oq_cm_frost_nan_grace_s},
              ${oq_hp_cold_start_min_c},
              ${oq_hp_cold_start_assist_release_c},
              ${oq_cm_override_max_s},
              ${oq_otb_supported},
              ${oq_boiler_transport_settle_s},
              ${oq_cm3_curve_on_delta_c},
              ${oq_cm3_curve_off_delta_c},
              ${oq_cm3_promote_s},
              ${oq_cm3_demote_s},
              ${oq_cm3_min_run_s},
              ${oq_cm0_sticky_wait_s},
              ${oq_cm0_sticky_run_s},
              ${oq_cm0_pump_stop_ipwm},
              ${oq_sticky_pwm},
          });
