    id: oq_silent_max_level
    name: "Silent max level"
    icon: mdi:speedometer-slow
    min_value: 0
    max_value: 10
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 6
    entity_category: config

  - platform: template
    id: oq_day_max_level
    name: "Day max level"
    icon: mdi:speedometer
    min_value: 0
    max_value: 10
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 10
    entity_category: config

  - platform: template
    id: oq_cm3_deficit_on_w
    name: "CM3 deficit ON threshold"
    icon: mdi:arrow-up-bold
    unit_of_measurement: "W"
    min_value: 0
    max_value: 10000
    step: 50
    optimistic: true
    restore_value: true
    initial_value: 1000
    entity_category: config

  - platform: template
    id: oq_cm3_deficit_off_w
    name: "CM3 deficit OFF threshold"
    icon: mdi:arrow-down-bold
    unit_of_measurement: "W"
    min_value: 0
    max_value: 10000
    step: 50
    optimistic: true
    restore_value: true
    initial_value: 400
    entity_category: config

  - platform: template
    id: oq_low_load_dyn_off_factor
    name: "Low-load dynamic OFF factor"
    internal: true
    icon: mdi:percent-outline
    disabled_by_default: true
    min_value: 0.60
    max_value: 0.90
    step: 0.05
    optimistic: true
    restore_value: true
    initial_value: 0.75
    entity_category: config

  - platform: template
    id: oq_low_load_dyn_on_factor
    name: "Low-load dynamic ON factor"
    internal: true
    icon: mdi:percent-outline
    disabled_by_default: true
    min_value: 0.85
    max_value: 1.10
    step: 0.05
    optimistic: true
    restore_value: true
    initial_value: 1.0
    entity_category: config

  - platform: template
    id: oq_low_load_min_hysteresis_w
    name: "Low-load minimum hysteresis"
    internal: true
    icon: mdi:arrow-expand-vertical
    disabled_by_default: true
    unit_of_measurement: "W"
    min_value: 100
    max_value: 400
    step: 25
    optimistic: true
    restore_value: true
    initial_value: 200
    entity_category: config

  - platform: template
    id: oq_low_load_reentry_block_s
    name: "Low-load CM2 re-entry block"
    internal: true
    icon: mdi:timer-lock-outline
    disabled_by_default: true
    unit_of_measurement: "s"
    min_value: 0
    max_value: 900
    step: 5
    optimistic: true
    restore_value: true
    initial_value: 300
    entity_category: config
