# OpenQuatt - Strategy Manager

globals:
  # Shared strategy output (0..20) consumed by downstream thermal-request control.
  - id: oq_demand_raw
    type: int
    restore_value: false
    initial_value: '0'

  # 0=Power House, 1=Heating Curve
  - id: oq_heat_mode_code
    type: int
    restore_value: false
    initial_value: '0'

  # Explicit strategy-status contract used by downstream diagnostics and
  # supervisory logic. Cooling owns code 1 when CM5 is active; otherwise the
  # selected heating strategy owns the remaining fields.
  # 0=inactive, 1=cooling, 2=heating_curve, 3=power_house
  - id: oq_strategy_active_code
    type: int
    restore_value: false
    initial_value: '0'

  # Strategy-local phase code published by the active strategy module.
  - id: oq_strategy_phase_code
    type: int
    restore_value: false
    initial_value: '0'

  - id: oq_strategy_requested_power_w
    type: float
    restore_value: false
    initial_value: 'NAN'

  - id: oq_strategy_supply_target_temp
    type: float
    restore_value: false
    initial_value: 'NAN'

  - id: oq_strategy_heat_request_active
    type: bool
    restore_value: false
    initial_value: 'false'

  # Freshness contract for consumers that may actuate independently of the
  # strategy loop. Source codes match oq_strategy_active_code.
  - id: oq_strategy_output_valid
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: oq_strategy_output_source_code
    type: uint8_t
    restore_value: false
    initial_value: '0'

  - id: oq_strategy_output_updated_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  - id: oq_strategy_hp_expected_power_w
    type: float
    restore_value: false
    initial_value: 'NAN'

  - id: oq_strategy_hp_max_power_w
    type: float
    restore_value: false
    initial_value: 'NAN'

  - id: oq_strategy_hp_saturated
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: oq_strategy_water_limit_factor
    type: float
    restore_value: false
    initial_value: '1.0'

  - id: oq_strategy_water_trip_active
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: oq_strategy_water_hard_trip_active
    type: bool
    restore_value: false
    initial_value: 'false'

select:
  - platform: template
    id: oq_heat_control_mode
    name: "Heating Control Mode"
    icon: mdi:tune-variant
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - Power House
      - Water Temperature Control (heating curve)
    initial_option: Power House
    on_value:
      then:
        - climate.pid.reset_integral_term: oq_heating_curve_pid
        - lambda: |-
            oq_strategy_runtime::runtime().switch_heating_mode(
                x == "Water Temperature Control (heating curve)");

text_sensor:
  - platform: template
    id: heating_strategy_status
    name: "Heating Strategy"
    icon: mdi:state-machine
    update_interval: 5s
    lambda: |-
      return std::string(id(oq_heat_control_mode).current_option().c_str());

  - platform: template
    id: oq_strategy_phase_text
    name: "Strategy phase"
    internal: true
    icon: mdi:state-machine
    update_interval: never
    entity_category: diagnostic
    disabled_by_default: true
    lambda: |-
      return std::string("idle");

sensor:
  - platform: template
    id: outside_temp_hp_avg
    name: "Outside Temperature (Local aggregated)"
    icon: mdi:thermometer
    internal: false
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      return oq_strategy_runtime::runtime().local_outside_temperature(
          (uint32_t) ${oq_outside_temp_stale_s});

  - platform: template
    id: oq_strategy_active_code_sensor
    name: "Strategy active code"
    internal: true
    icon: mdi:counter
    accuracy_decimals: 0
    update_interval: 5s
    entity_category: diagnostic
    disabled_by_default: true
    lambda: |-
      return (float) id(oq_strategy_active_code);

  - platform: template
    id: oq_strategy_phase_code_sensor
    name: "Strategy phase code"
    internal: true
    icon: mdi:counter
    accuracy_decimals: 0
    update_interval: 5s
    entity_category: diagnostic
    disabled_by_default: true
    lambda: |-
      return (float) id(oq_strategy_phase_code);

  - platform: template
    id: oq_strategy_requested_power_w_sensor
    name: "Strategy requested power"
    internal: true
    icon: mdi:flash-outline
    unit_of_measurement: "W"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 5s
    entity_category: diagnostic
    disabled_by_default: true
    lambda: |-
      return id(oq_strategy_requested_power_w);

  - platform: template
    id: oq_strategy_supply_target_temp_sensor
    name: "Strategy supply target"
    internal: true
    icon: mdi:target
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 5s
    entity_category: diagnostic
    disabled_by_default: true
    lambda: |-
      return id(oq_strategy_supply_target_temp);

  - platform: template
    id: oq_strategy_water_limit_factor_sensor
    name: "Strategy water limit factor"
    internal: true
    icon: mdi:water-percent-alert
    accuracy_decimals: 2
    update_interval: 5s
    entity_category: diagnostic
    disabled_by_default: true
    lambda: |-
      return id(oq_strategy_water_limit_factor);

binary_sensor:
  - platform: template
    id: oq_strategy_heat_request_active_sensor
    name: "Strategy request active"
    internal: true
    device_class: heat
    entity_category: diagnostic
    disabled_by_default: true
    lambda: |-
      return id(oq_strategy_heat_request_active);

  - platform: template
    id: oq_strategy_water_trip_active_sensor
    name: "Strategy water trip active"
    internal: true
    entity_category: diagnostic
    disabled_by_default: true
    lambda: |-
      return id(oq_strategy_water_trip_active);

  - platform: template
    id: oq_strategy_water_hard_trip_active_sensor
    name: "Strategy water hard trip active"
    internal: true
    entity_category: diagnostic
    disabled_by_default: true
    lambda: |-
      return id(oq_strategy_water_hard_trip_active);

interval:
  - interval: ${oq_strategy_loop_s}s
    startup_delay: 800ms
    then:
      - lambda: |-
          oq_strategy_runtime::runtime().tick();
