# ==============================================================================
# OpenQuatt - Topology Package: Duo
# ==============================================================================
substitutions:
  secondary_hp_id: "hp2"
  oq_topology: "duo"
  alternate_topology: "single"
  secondary_outside_is_distinct: "1"
  flow_secondary_enabled: "1"
  flow_mismatch_internal: "false"
  hc_dual_tuning_internal: "false"
  hc_hp2_diag_internal: "false"
  hc_runtime_reset_button_name: "Reset Runtime Counters (HP1+HP2)"
  cic_secondary_enabled: "1"
  cic_hp2_sensor_internal: "false"
  sensor_sources_duo_flow_internal: "false"
  ot_secondary_present: "1"
  monitoring_hp2_internal: "false"

packages:
  heatpump2: !include
    file: ../oq_HP_io.yaml
    vars:
      hp_id: "hp2"
      hp_index: "2"
      prefix: "HP2 - "
      device_address: 0x02
      oq_modbus_startup_delay_ms: "2500"
  hp2_odu_runtime_frequency_table: !include ../experimental/oq_odu_runtime_frequency_table_hp2.yaml
