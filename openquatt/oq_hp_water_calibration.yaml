# ==============================================================================
# OpenQuatt - HP Water Sensor Calibration
# ==============================================================================
#
# Goal:
#   Run a manual CM100 service task that circulates water without compressor
#   demand, waits for the HP water sensors to equalize, and proposes relative
#   offsets for HP water-in/out sensors. Applying the proposal is a separate
#   user action.
#
# ==============================================================================

esphome:
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // Template numbers with lambdas do not publish during setup. Seed
          // their backup-facing state immediately after restored globals load.
          id(oq_water_supply_temp_calibration_pt1000_backup).update();
          id(oq_water_supply_temp_calibration_ds18b20_backup).update();
          id(oq_water_supply_temp_calibration_cic_backup).update();
          id(oq_water_supply_temp_calibration_ha_input_backup).update();
          const oq_supply_calibration::SourceIdentity ha_source{
              oq_supply_calibration::SOURCE_HA_INPUT,
              oq_supply_calibration::fingerprint(
                  oq_supply_calibration::SOURCE_HA_INPUT,
                  "${ha_water_supply_temp_entity_id}"),
              true};
          const auto ha_record = oq_supply_calibration::load_record(
              id(oq_water_supply_temp_calibration_ha_input_record));
          if (oq_supply_calibration::record_matches(ha_record, ha_source)) {
            char fingerprint[9];
            snprintf(fingerprint, sizeof(fingerprint), "%08lx",
                     static_cast<unsigned long>(ha_record.fingerprint));
            id(oq_water_supply_temp_calibration_ha_input_identity_backup)
                ->publish_state(fingerprint);
          } else {
            id(oq_water_supply_temp_calibration_ha_input_identity_backup)
                ->publish_state("");
          }

