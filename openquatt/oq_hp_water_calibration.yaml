number:
  - platform: template
    id: water_supply_temp_calibration_offset
    name: "Water Supply Temperature Calibration Offset"
    internal: true
    unit_of_measurement: "°C"
    mode: slider
    min_value: -2
    max_value: 2
    step: 0.01
    restore_value: true
    optimistic: true
    initial_value: 0

  # Read/write backup bridges for the four source-bound records. Firmware
  # reconstructs each checksum; HA also carries its anonymous fingerprint.
  - platform: template
    id: oq_water_supply_temp_calibration_pt1000_backup
    name: "Water Supply PT1000 Calibration Offset"
    internal: true
    unit_of_measurement: "°C"
    mode: box
    min_value: -2
    max_value: 2
    step: 0.01
    update_interval: 5s
    lambda: |-
      const oq_supply_calibration::SourceIdentity source{
          oq_supply_calibration::SOURCE_LOCAL_PT1000,
          oq_supply_calibration::fingerprint(
              oq_supply_calibration::SOURCE_LOCAL_PT1000, "local:pt1000"),
          true};
      const auto record = oq_supply_calibration::load_record(
          id(oq_water_supply_temp_calibration_pt1000_record));
      return oq_supply_calibration::record_matches(record, source) ? record.offset_c : NAN;
    set_action:
      - lambda: |-
          const oq_supply_calibration::SourceIdentity source{
              oq_supply_calibration::SOURCE_LOCAL_PT1000,
              oq_supply_calibration::fingerprint(
                  oq_supply_calibration::SOURCE_LOCAL_PT1000, "local:pt1000"),
              true};
          if (!oq_supply_calibration::store_record(
                  id(oq_water_supply_temp_calibration_pt1000_record), source, x)) return;
          oq_water_supply_temp_calibration_pt1000_record->update();
          id(oq_water_supply_temp_calibration_pt1000_backup).publish_state(x);
          id(water_supply_temp_selected).update();

  - platform: template
    id: oq_water_supply_temp_calibration_ds18b20_backup
    name: "Water Supply DS18B20 Calibration Offset"
    internal: true
    unit_of_measurement: "°C"
    mode: box
    min_value: -2
    max_value: 2
    step: 0.01
    update_interval: 5s
    lambda: |-
      const oq_supply_calibration::SourceIdentity source{
          oq_supply_calibration::SOURCE_LOCAL_DS18B20,
          oq_supply_calibration::fingerprint(
              oq_supply_calibration::SOURCE_LOCAL_DS18B20, "local:ds18b20"),
          true};
      const auto record = oq_supply_calibration::load_record(
          id(oq_water_supply_temp_calibration_ds18b20_record));
      return oq_supply_calibration::record_matches(record, source) ? record.offset_c : NAN;
    set_action:
      - lambda: |-
          const oq_supply_calibration::SourceIdentity source{
              oq_supply_calibration::SOURCE_LOCAL_DS18B20,
              oq_supply_calibration::fingerprint(
                  oq_supply_calibration::SOURCE_LOCAL_DS18B20, "local:ds18b20"),
              true};
          if (!oq_supply_calibration::store_record(
                  id(oq_water_supply_temp_calibration_ds18b20_record), source, x)) return;
          oq_water_supply_temp_calibration_ds18b20_record->update();
          id(oq_water_supply_temp_calibration_ds18b20_backup).publish_state(x);
          id(water_supply_temp_selected).update();

  - platform: template
    id: oq_water_supply_temp_calibration_cic_backup
    name: "Water Supply CIC Calibration Offset"
    internal: true
    unit_of_measurement: "°C"
    mode: box
    min_value: -2
    max_value: 2
    step: 0.01
    update_interval: 5s
    lambda: |-
      const auto record = oq_supply_calibration::load_record(
          id(oq_water_supply_temp_calibration_cic_record));
      return oq_supply_calibration::record_valid(
          record, oq_supply_calibration::SOURCE_CIC) ? record.offset_c : NAN;
    set_action:
      - lambda: |-
          // CIC calibration is type-bound, so restore must not depend on a URL.
          const oq_supply_calibration::SourceIdentity source{
              oq_supply_calibration::SOURCE_CIC,
              oq_supply_calibration::fingerprint(
                  oq_supply_calibration::SOURCE_CIC, "cic:type"),
              true};
          if (!oq_supply_calibration::store_record(
                  id(oq_water_supply_temp_calibration_cic_record), source, x)) return;
          oq_water_supply_temp_calibration_cic_record->update();
          id(oq_water_supply_temp_calibration_cic_backup).publish_state(x);
          id(water_supply_temp_selected).update();

  - platform: template
    id: oq_water_supply_temp_calibration_ha_input_backup
    name: "Water Supply HA Input Calibration Offset"
    internal: true
    unit_of_measurement: "°C"
    mode: box
    min_value: -2
    max_value: 2
    step: 0.01
    update_interval: 5s
    lambda: |-
      const oq_supply_calibration::SourceIdentity source{
          oq_supply_calibration::SOURCE_HA_INPUT,
          oq_supply_calibration::fingerprint(
              oq_supply_calibration::SOURCE_HA_INPUT, "${ha_water_supply_temp_entity_id}"),
          true};
      const auto record = oq_supply_calibration::load_record(
          id(oq_water_supply_temp_calibration_ha_input_record));
      return oq_supply_calibration::record_matches(record, source) ? record.offset_c : NAN;
    set_action:
      - lambda: |-
          const oq_supply_calibration::SourceIdentity source{
              oq_supply_calibration::SOURCE_HA_INPUT,
              oq_supply_calibration::fingerprint(
                  oq_supply_calibration::SOURCE_HA_INPUT, "${ha_water_supply_temp_entity_id}"),
              true};
          char expected_fingerprint[9];
          snprintf(expected_fingerprint, sizeof(expected_fingerprint), "%08lx",
                   static_cast<unsigned long>(source.fingerprint));
          // Reject a backup captured for another HA entity without replacing
          // an existing calibration for the currently configured entity.
          if (id(oq_water_supply_temp_calibration_ha_input_identity_backup).state !=
              expected_fingerprint) {
            const auto current_record = oq_supply_calibration::load_record(
                id(oq_water_supply_temp_calibration_ha_input_record));
            if (oq_supply_calibration::record_matches(current_record, source)) {
              char current_fingerprint[9];
              snprintf(current_fingerprint, sizeof(current_fingerprint), "%08lx",
                       static_cast<unsigned long>(current_record.fingerprint));
              id(oq_water_supply_temp_calibration_ha_input_identity_backup)
                  ->publish_state(current_fingerprint);
            } else {
              id(oq_water_supply_temp_calibration_ha_input_identity_backup)
                  ->publish_state("");
            }
            return;
          }
          if (!oq_supply_calibration::store_record(
                  id(oq_water_supply_temp_calibration_ha_input_record), source, x)) return;
          oq_water_supply_temp_calibration_ha_input_record->update();
          id(oq_water_supply_temp_calibration_ha_input_identity_backup)
              ->publish_state(expected_fingerprint);
          id(oq_water_supply_temp_calibration_ha_input_backup).publish_state(x);
          id(water_supply_temp_selected).update();

