# ==============================================================================
# OpenQuatt - OpenTherm Thermostat Slave Bridge
# ==============================================================================
#
# Product scope:
#   - Expose a local OpenTherm slave endpoint towards a thermostat
#   - Publish thermostat intent (room temp / setpoint / CH / cooling)
#   - Feed selected OpenQuatt runtime values back to the thermostat
#   - Keep protocol diagnostics bounded to passive counters; no test controls
# Runtime requirements:
#   - ESP32 target with `esp32.framework.type: esp-idf`
#   - RMT-capable hardware; non-RMT targets are not supported by this OT runtime
#
# ==============================================================================

external_components:
  - source:
      type: local
      path: ${external_components_path}
    components: [openquatt_ot_slave]

openquatt_ot_slave:
  id: oq_ot_slave_hub
  pin_thermostat_in: ${oq_ot_thermostat_in_pin}
  pin_thermostat_out: ${oq_ot_thermostat_out_pin}
  enabled: ${oq_ot_enabled_default}
  response_enabled: ${oq_ot_response_enabled_default}

globals:
  - id: oq_ot_fault_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: oq_ot_diagnostic_active
    type: bool
    restore_value: no
    initial_value: 'false'

switch:
  - platform: openquatt_ot_slave
    openquatt_ot_slave_id: oq_ot_slave_hub
    enabled:
      id: oq_ot_slave_enabled
      name: "OpenTherm Enabled"
      entity_category: config
      icon: mdi:thermostat-cog

binary_sensor:
  - platform: openquatt_ot_slave
    openquatt_ot_slave_id: oq_ot_slave_hub
    master_ch_enable:
      id: ot_thermostat_ch_enable
      name: "OT - Thermostat CH Enable"
      icon: mdi:radiator
    master_cooling_enable:
      id: ot_thermostat_cooling_enable
      name: "OT - Thermostat Cooling Enable"
      icon: mdi:snowflake
    master_status_valid:
      id: ot_thermostat_status_valid
      name: "OT - Thermostat Status Valid"
      icon: mdi:check-decagram
      entity_category: diagnostic
    link_problem:
      id: ot_link_problem
      name: "OT - Link Problem"
      entity_category: diagnostic
      icon: mdi:alert-circle-outline

sensor:
  - platform: openquatt_ot_slave
    openquatt_ot_slave_id: oq_ot_slave_hub
    t_set:
      id: ot_thermostat_control_setpoint
      name: "OT - Control Setpoint"
      icon: mdi:thermostat
    t_roomset:
      id: ot_thermostat_room_setpoint
      name: "OT - Room Setpoint"
      icon: mdi:home-thermometer-outline
    t_room:
      id: ot_thermostat_room_temp
      name: "OT - Room Temperature"
      icon: mdi:home-thermometer

  - platform: template
    id: ot_thermostat_successful_frame_count
    name: "OT - Successful Frame Count"
    internal: true
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: 5s
    lambda: |-
      return (float) id(oq_ot_slave_hub).successful_frame_count();

  - platform: template
    id: ot_thermostat_invalid_frame_count
    name: "OT - Invalid Frame Count"
    internal: true
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: 5s
    lambda: |-
      return (float) id(oq_ot_slave_hub).invalid_frame_count();

  - platform: template
    id: ot_thermostat_timeout_frame_count
    name: "OT - Timeout Frame Count"
    internal: true
    accuracy_decimals: 0
    state_class: total_increasing
    update_interval: 5s
    lambda: |-
      return (float) id(oq_ot_slave_hub).timeout_frame_count();

interval:
  - interval: 2s
    then:
      - if:
          condition:
            lambda: |-
              return !id(oq_runtime_polling_paused).state;
          then:
            - lambda: |-
                // Push canonical runtime into the thermostat-side slave off the
                // ISR path. With OTB selected, boiler-originated values are valid
                // only while the independent boiler link is fresh.
                const bool otb_selected =
                    id(oq_boiler_connection).has_state() &&
                    id(oq_boiler_connection).current_option() == "OpenTherm";
                const bool otb_available =
                    otb_selected && id(oq_otb_link_available_state);

                if (otb_selected) {
                  id(oq_ot_slave_hub).set_slave_t_boiler(
                      otb_available && id(otb_boiler_water_temp).has_state()
                              && !isnan(id(otb_boiler_water_temp).state)
                          ? id(otb_boiler_water_temp).state
                          : NAN);
                  id(oq_ot_slave_hub).set_slave_t_ret(
                      otb_available && id(otb_return_water_temp).has_state()
                              && !isnan(id(otb_return_water_temp).state)
                          ? id(otb_return_water_temp).state
                          : NAN);
                  id(oq_ot_slave_hub).set_slave_rel_mod_level(
                      otb_available && id(otb_relative_modulation).has_state()
                              && !isnan(id(otb_relative_modulation).state)
                          ? id(otb_relative_modulation).state
                          : NAN);
                  id(oq_ot_slave_hub).set_slave_ch_pressure(
                      otb_available && id(otb_ch_pressure).has_state()
                              && !isnan(id(otb_ch_pressure).state)
                          ? id(otb_ch_pressure).state
                          : NAN);
                  id(oq_ot_slave_hub).set_slave_t_dhw(
                      otb_available && id(otb_dhw_temp).has_state()
                              && !isnan(id(otb_dhw_temp).state)
                          ? id(otb_dhw_temp).state
                          : NAN);
                } else {
                  const float r1_supply_c =
                      id(water_supply_temp_selected).has_state() &&
                              !isnan(id(water_supply_temp_selected).state)
                          ? id(water_supply_temp_selected).state
                          : 20.0f;
                  const float r1_return_c =
                      id(hp1_water_in_temp).has_state() &&
                              !isnan(id(hp1_water_in_temp).state)
                          ? id(hp1_water_in_temp).state
                          : 20.0f;
                  id(oq_ot_slave_hub).set_slave_t_boiler(r1_supply_c);
                  id(oq_ot_slave_hub).set_slave_t_ret(r1_return_c);

                  float ot_rel_mod_level = id(oq_demand_filtered) * 5.0f;
                  if (ot_rel_mod_level < 0.0f) ot_rel_mod_level = 0.0f;
                  if (ot_rel_mod_level > 100.0f) ot_rel_mod_level = 100.0f;
                  id(oq_ot_slave_hub).set_slave_rel_mod_level(ot_rel_mod_level);
                  // Compatibility fallback only for a non-OT boiler path. OTB
                  // never reports this fictive value.
                  id(oq_ot_slave_hub).set_slave_ch_pressure(1.5f);
                  id(oq_ot_slave_hub).set_slave_t_dhw(40.0f);
                }
                if (id(max_water_temp_limit_c).has_state() && !isnan(id(max_water_temp_limit_c).state)) {
                  id(oq_ot_slave_hub).set_slave_max_t_set(id(max_water_temp_limit_c).state);
                }
                if (id(outside_temp_selected).has_state() && !isnan(id(outside_temp_selected).state)) {
                  id(oq_ot_slave_hub).set_slave_t_outside(id(outside_temp_selected).state);
                }

                auto is_active_problem = [](auto *binary) -> bool {
                  return binary != nullptr && binary->has_state() && binary->state;
                };
                auto is_active_mode = [](int level, auto *mode_sensor, int target_mode) -> bool {
                  return level > 0 &&
                         mode_sensor != nullptr &&
                         mode_sensor->has_state() &&
                         !isnan(mode_sensor->state) &&
                         (static_cast<int>(roundf(mode_sensor->state)) == target_mode);
                };

                const bool hp1_heating_active = is_active_mode(id(hp1_last_applied_level), id(hp1_working_mode), 2);
                const bool hp2_heating_active =
                    (${ot_secondary_present} != 0) &&
                    is_active_mode(id(${secondary_last_applied_level_id}), id(${secondary_working_mode_id}), 2);
                const bool hp1_cooling_active = is_active_mode(id(hp1_last_applied_level), id(hp1_working_mode), 1);
                const bool hp2_cooling_active =
                    (${ot_secondary_present} != 0) &&
                    is_active_mode(id(${secondary_last_applied_level_id}), id(${secondary_working_mode_id}), 1);
                const bool boiler_on = id(boiler_active).has_state() && id(boiler_active).state;
                const bool ch_active = hp1_heating_active || hp2_heating_active || boiler_on;
                const bool cooling_active = hp1_cooling_active || hp2_cooling_active;
                const bool boiler_dhw_present =
                    otb_available && id(otb_dhw_present).has_state() &&
                    id(otb_dhw_present).state;
                const bool boiler_dhw_active =
                    boiler_dhw_present && id(otb_dhw_active).has_state() &&
                    id(otb_dhw_active).state;
                const bool boiler_flame_on =
                    otb_available && id(otb_flame_on).has_state() && id(otb_flame_on).state;
                // Preserve the established composite heat-source indication
                // for R1 installations. With OTB selected, expose only the
                // boiler's real flame state instead of inventing one from HP activity.
                const bool slave_flame_on =
                    otb_selected ? boiler_flame_on : ch_active;

                const bool hp1_fault = is_active_problem(id(hp1_ot_fault_active));
                const bool hp2_fault =
                    (${ot_secondary_present} != 0) && is_active_problem(id(${secondary_fault_binary_sensor_id}));
                const bool lowflow_fault = id(oq_lowflow_fault_active);
                const bool temp_trip = id(oq_water_temp_trip_active) || id(oq_water_temp_hard_trip_active);
                const bool boiler_fault =
                    otb_available && is_active_problem(id(otb_fault_indication));
                const bool boiler_diagnostic =
                    otb_available && is_active_problem(id(otb_diagnostic_indication));

                id(oq_ot_fault_active) = hp1_fault || hp2_fault || boiler_fault;
                id(oq_ot_diagnostic_active) =
                    id(oq_ot_fault_active) || boiler_diagnostic || lowflow_fault || temp_trip;

                id(oq_ot_slave_hub).set_slave_ch_active(ch_active);
                id(oq_ot_slave_hub).set_slave_dhw_present(boiler_dhw_present);
                id(oq_ot_slave_hub).set_slave_dhw_active(boiler_dhw_active);
                id(oq_ot_slave_hub).set_slave_flame_on(slave_flame_on);
                id(oq_ot_slave_hub).set_slave_cooling_active(cooling_active);
                id(oq_ot_slave_hub).set_slave_fault(id(oq_ot_fault_active));
                id(oq_ot_slave_hub).set_slave_diagnostic(id(oq_ot_diagnostic_active));
