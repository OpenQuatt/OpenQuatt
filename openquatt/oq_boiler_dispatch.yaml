# ==============================================================================
# OpenQuatt – Boiler Command Dispatch
# ==============================================================================
#
# Owns the transport-neutral command contract consumed by `oq_boiler_control`.
# CM3 commands are derived from the active heating strategy. Power House asks
# for the remaining thermal power after the selected heat-pump levels; Heating
# Curve forwards its supply target. A cold start can temporarily own CM3 with a
# bounded preheat target. CM4 emits a dedicated boiler-only fallback command
# after supervisory has confirmed heat-pump unavailability. CM100 remains an
# explicit commissioning command. The selected transport is not considered
# here and this package never writes R1 or OpenTherm outputs.
# ==============================================================================

globals:
  - id: oq_boiler_command_valid
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: oq_boiler_command_demand_present
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: oq_boiler_command_heat_request
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: oq_boiler_command_requested_power_w
    type: float
    restore_value: false
    initial_value: 'NAN'

  - id: oq_boiler_command_target_temperature_c
    type: float
    restore_value: false
    initial_value: 'NAN'

  - id: oq_boiler_command_source_code
    type: uint8_t
    restore_value: false
    initial_value: '0'

  - id: oq_boiler_command_updated_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

interval:
  - interval: ${oq_boiler_loop_s}s
    startup_delay: 4500ms
    then:
      - lambda: |-
          oq_boiler_dispatch_runtime::tick(
              {${oq_hp_cold_start_boiler_target_c}, ${oq_cm_min_flow_lph}, ${oq_water_cp_j_per_kgk}},
              id(${secondary_water_out_temp_id}).state);
