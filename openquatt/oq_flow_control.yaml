# ==============================================================================
# OpenQuatt – Flow Control
# ==============================================================================
#
# Goal:
#   Regulates and monitors water flow; hydraulic safety takes priority over heat production.
#
# Role in architecture:
#   Owns non-CM0 pump iPWM behavior, runs PI control, and provides flow diagnostics.
#
# What this package DOES do:
#   - Uses measured/filtered flow (flow_rate_selected) for PI control
#   - Controls pump PWM to reach target flow
#   - Publishes flow status and mismatch diagnostics for supervisory/operations
#
# What this package DOES NOT do:
#   - Does not control compressor levels
#   - Does not determine Control Mode (supervisory does)
#   - Does not decide on boiler auxiliary heating
#
# Key assumptions:
#   - Flow sensor/flow_rate_selected is available and correctly scaled (L/h)
#   - Pump output is correctly configured for PWM
#
# Interaction with Control Modes:
#   - Active in CM1/CM2/CM3/CM4/CM5/CM100 (AUTO=PI, MANUAL=fixed iPWM)
#   - CM0: early return (supervisory owns pump state in idle)
#   - CM98: fixed frost PWM path
#
# Safety / fail-safe:
#   - Hydraulic safety: at insufficient flow, heat production must stop (via CM1)
#   - PI is tuned for stability to avoid oscillation
#
# ==============================================================================

esphome:
  on_boot:
    priority: -100
    then:
      - lambda: |-
          constexpr std::array<uint32_t, 2> retired_flow_pwm_preferences{{
              435184091U,
              3242211636U,
          }};
          oq_nvs_cleanup::erase_esphome_preferences(
              retired_flow_pwm_preferences, "retired flow PWM entities");

# ----------------------------
# INTERNAL STATE (PI)
# ----------------------------
globals:
  - id: oq_flow_last_pwm
    type: int
    restore_value: false
    initial_value: '850'
  - id: oq_flow_last_good_pwm
    type: int
    restore_value: true
    initial_value: "440"
  - id: oq_flow_last_good_pwm_cooling
    type: int
    restore_value: true
    initial_value: "440"
  - id: oq_flow_cooling_settings_migrated
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: oq_flow_autotune_active
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: oq_flow_autotune_pwm
    type: int
    restore_value: false
    initial_value: '850'

# ----------------------------
# TUNING INPUTS
# ----------------------------
number:
  - platform: template
    id: oq_flow_setpoint_lph
    name: "Flow Setpoint"
    icon: mdi:waves-arrow-right
    entity_category: config
    unit_of_measurement: "L/h"
    mode: slider
    min_value: 0
    max_value: 1500
    step: 10
    restore_value: true
    optimistic: true
    initial_value: 800

  - platform: template
    id: oq_cooling_flow_setpoint_lph
    name: "Cooling Flow Setpoint"
    icon: mdi:snowflake-thermometer
    entity_category: config
    unit_of_measurement: "L/h"
    mode: slider
    min_value: 0
    max_value: 1500
    step: 10
    restore_value: true
    optimistic: true
    initial_value: 800

  - platform: template
    id: oq_flow_manual_pwm
    name: "Manual iPWM"
    icon: mdi:fan
    entity_category: config
    unit_of_measurement: "iPWM"
    mode: slider
    min_value: 50
    max_value: 850
    step: 1
    initial_value: 400
    restore_value: true
    optimistic: true

  - platform: template
    id: oq_flow_kp
    name: "Flow PI Kp"
    icon: mdi:alpha-k-circle-outline
    entity_category: config
    mode: slider
    min_value: ${oq_flow_kp_min}
    max_value: ${oq_flow_kp_max}
    step: 0.001
    restore_value: true
    optimistic: true
    initial_value: ${oq_flow_kp_default}

  - platform: template
    id: oq_flow_ki
    name: "Flow PI Ki"
    icon: mdi:alpha-i-circle-outline
    entity_category: config
    mode: slider
    min_value: ${oq_flow_ki_min}
    max_value: ${oq_flow_ki_max}
    step: 0.0001
    restore_value: true
    optimistic: true
    initial_value: ${oq_flow_ki_default}

# ----------------------------
# CONFIG: Flow Control Mode
#   - Flow Setpoint : PI controls flow to oq_flow_setpoint_lph
#   - Manual PWM    : fixed iPWM from oq_flow_manual_pwm (no PI)
# ----------------------------
select:
  - platform: template
    id: oq_flow_control_mode
    name: "Flow Control Mode"
    icon: mdi:tune-variant
    entity_category: config
    options:
      - Flow Setpoint
      - Manual PWM
    initial_option: Flow Setpoint
    restore_value: true
    optimistic: true

# ----------------------------
# SENSORS
# ----------------------------
sensor:
  - platform: template
    id: oq_flow_output_ipwm
    name: "Flow Output iPWM"
    internal: true
    unit_of_measurement: "iPWM"
    accuracy_decimals: 0
    update_interval: never

  # Average flow HP1/HP2
  - platform: template
    id: flow_rate_hp_avg
    name: "Flow average (local)"
    icon: mdi:waves
    unit_of_measurement: "L/h"
    device_class: volume_flow_rate
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      return oq_flow_runtime::runtime().local_flow(${oq_flow_mismatch_threshold_lph});

binary_sensor:
  - platform: template
    id: oq_flow_mismatch
    name: "Flow mismatch (HP1 vs HP2)"
    internal: ${flow_mismatch_internal}
    icon: mdi:alert-circle-outline
    device_class: problem
    entity_category: diagnostic
    lambda: |-
      return oq_flow_runtime::runtime().flow_mismatch(
          ${oq_flow_mismatch_threshold_lph}, ${oq_flow_mismatch_hyst_lph});

# ----------------------------
# STATUS (CM0/CM98/AUTO/MANUAL)
# ----------------------------
text_sensor:
  - platform: template
    id: oq_flow_mode
    name: "Flow Mode"
    icon: mdi:state-machine

# ----------------------------
# CONTROL LOOPS
# ----------------------------
interval:
  # Fixed-output service tasks keep their original 5s actuator cadence independently of the 10s PI.
  # Air Purge updates at 5.2s phase; this loop applies it 0.5s later and also serves Quick Flow Test.
  - interval: ${oq_flow_service_output_loop_s}s
    startup_delay: ${oq_flow_service_output_startup_delay_ms}ms
    then:
      - lambda: |-
          oq_flow_runtime::runtime().service_tick();

  # Main PI and mode handling stays aligned to the 10s telemetry cadence.
  - interval: ${oq_flow_loop_s}s
    startup_delay: ${oq_flow_loop_startup_delay_ms}ms
    then:
      - lambda: |-
          oq_flow_runtime::runtime().tick({${oq_flow_loop_s}, 20, ${oq_cm98_pump_ipwm}});
