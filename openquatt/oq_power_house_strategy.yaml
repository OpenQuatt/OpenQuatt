# ==============================================================================
# OpenQuatt - Power House Strategy
# ==============================================================================

globals:
  - id: oq_phouse_demand_external
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: oq_phouse_req_w
    type: float
    restore_value: false
    initial_value: '0.0'

  - id: oq_phouse_last_w
    type: float
    restore_value: false
    initial_value: '0.0'

  - id: oq_phouse_last_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  - id: oq_phouse_comfort_memory_c
    type: float
    restore_value: false
    initial_value: '0.0'

  - id: oq_demand_filter_ramp_up_budget
    type: float
    restore_value: false
    initial_value: '0.0'

  - id: oq_ph_request_last_loop_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  - id: oq_ph_request_hp1_level
    type: int
    restore_value: false
    initial_value: '0'

  - id: oq_ph_request_hp2_level
    type: int
    restore_value: false
    initial_value: '0'

  - id: oq_ph_request_owner_hp
    type: int
    restore_value: false
    initial_value: '0'

  - id: oq_ph_request_reason_code
    type: int
    restore_value: false
    initial_value: '0'

select:
  - platform: template
    id: oq_ph_response_profile
    name: "Power House response profile"
    icon: mdi:tune-variant
    options:
      - Calm
      - Balanced
      - Responsive
      - Custom
    update_interval: 5s
    entity_category: config
    lambda: |-
      return oq_power_house_runtime::runtime().response_profile();
    set_action:
      then:
        - lambda: |-
            oq_power_house_runtime::runtime().set_response_profile(x);

number:
  - platform: template
    id: house_cold_temp_c
    name: "House cold temp"
    icon: mdi:thermometer-low
    unit_of_measurement: "°C"
    min_value: -25
    max_value: 5
    step: 0.5
    restore_value: true
    optimistic: true
    initial_value: -10
    entity_category: config

  - platform: template
    id: house_rated_power_w
    name: "Rated maximum house power"
    icon: mdi:home-lightning-bolt
    unit_of_measurement: "W"
    min_value: 1000
    max_value: 15000
    step: 10
    restore_value: true
    optimistic: true
    initial_value: 7020
    entity_category: config

  - platform: template
    id: house_zero_power_temp_c
    name: "Maximum heating outdoor temperature"
    icon: mdi:thermometer-high
    unit_of_measurement: "°C"
    min_value: 5
    max_value: 25
    step: 0.5
    restore_value: true
    optimistic: true
    initial_value: 16
    entity_category: config

  - platform: template
    id: ph_kp_w_per_k
    name: "Power House temperature reaction"
    icon: mdi:function-variant
    unit_of_measurement: "W/K"
    min_value: 0
    max_value: 4000
    step: 10
    restore_value: true
    optimistic: true
    initial_value: 3000
    entity_category: config

  - platform: template
    id: ph_comfort_band_below_c
    name: "Power House comfort below setpoint"
    icon: mdi:thermometer-chevron-down
    unit_of_measurement: "°C"
    min_value: 0
    max_value: 2.0
    step: 0.05
    restore_value: true
    optimistic: true
    initial_value: 0.1
    entity_category: config

  - platform: template
    id: ph_comfort_band_above_c
    name: "Power House comfort above setpoint"
    icon: mdi:thermometer-chevron-up
    unit_of_measurement: "°C"
    min_value: 0
    max_value: 2.0
    step: 0.05
    restore_value: true
    optimistic: true
    initial_value: 0.3
    entity_category: config

  - platform: template
    id: ph_demand_rise_time_min
    name: "Power House demand rise time"
    icon: mdi:chart-line-variant
    unit_of_measurement: "min"
    min_value: 2
    max_value: 20
    step: 1
    restore_value: true
    optimistic: true
    initial_value: 8
    entity_category: config

  - platform: template
    id: ph_demand_fall_time_min
    name: "Power House demand fall time"
    icon: mdi:chart-line
    unit_of_measurement: "min"
    min_value: 1
    max_value: 10
    step: 1
    restore_value: true
    optimistic: true
    initial_value: 3
    entity_category: config

  - platform: template
    id: oq_demand_filter_ramp_up_step_min
    name: "Demand filter ramp up"
    disabled_by_default: true
    entity_category: config
    icon: mdi:stairs-up
    unit_of_measurement: "step/min"
    min_value: 1
    max_value: 20
    step: 1
    mode: slider
    restore_value: true
    optimistic: true
    initial_value: 1

text_sensor:
  - platform: template
    id: oq_duo_optimizer_reason
    name: "Duo optimizer reason"
    internal: true
    icon: mdi:swap-horizontal
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: never
    lambda: |-
      #if OQ_TOPOLOGY_DUO
      return std::string("inactive");
      #else
      return std::string("single_topology");
      #endif
  - platform: template
    id: oq_phouse_demand_source
    name: "Power House – demand source"
    icon: mdi:source-branch
    entity_category: diagnostic
    update_interval: ${oq_diagnostic_update_interval_s}s
    lambda: |-
      return std::string(id(oq_phouse_demand_external) ? "external" : "model");

sensor:
  - platform: template
    id: oq_phouse_house_w
    name: "Power House – P_house"
    icon: mdi:home-lightning-bolt
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: ${oq_diagnostic_update_interval_s}s
    lambda: |-
      const float Tout = id(outside_temp_selected).state;
      const float Tc = id(house_cold_temp_c).state;
      const float T0 = id(house_zero_power_temp_c).state;
      const float Pr = id(house_rated_power_w).state;

      if (isnan(Tout) || isnan(Tc) || isnan(T0) || isnan(Pr)) return NAN;
      if (T0 <= Tc + ${oq_temp_guard_delta_c}f) return NAN;

      return oq_power_house::modelled_house_power_w(T0, Tc, Tout, Pr);

  - platform: template
    id: oq_phouse_req_w_sensor
    name: "Power House – P_req"
    icon: mdi:flash
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: ${oq_diagnostic_update_interval_s}s
    lambda: |-
      return id(oq_phouse_req_w);

  - platform: template
    id: oq_phouse_comfort_memory_c_sensor
    name: "Power House – comfort memory"
    internal: true
    icon: mdi:thermometer-plus
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 3
    update_interval: 5s
    entity_category: diagnostic
    disabled_by_default: true
    lambda: |-
      return id(oq_phouse_comfort_memory_c);

  - platform: template
    id: oq_phouse_effective_room_target_c_sensor
    name: "Power House – effective room target"
    internal: true
    icon: mdi:target
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 5s
    entity_category: diagnostic
    disabled_by_default: true
    lambda: |-
      return id(room_setpoint_selected).state + id(oq_phouse_comfort_memory_c);

interval:
  - interval: ${oq_heat_loop_tick_s}s
    startup_delay: 4000ms
    then:
      - lambda: |-
          oq_power_house_runtime::runtime().tick({
              (uint32_t) ${oq_heat_loop_powerhouse_s} * 1000UL,
              (int) ${oq_strategy_demand_max_f},
              ${oq_temp_guard_delta_c}f,
              ${oq_defrost_power_factor},
              ${oq_optimizer_penalty_per_w},
              ${oq_optimizer_topology_power_margin_w},
              ${oq_optimizer_topology_heat_advantage_w},
              (int) roundf(${oq_defrost_comp_min_f}),
              (int) roundf(${oq_defrost_comp_boost_steps}),
          });
