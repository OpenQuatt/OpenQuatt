# ==============================================================================
# OpenQuatt - Power House Strategy
# ==============================================================================

globals:
  - id: oq_phouse_demand_external
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: oq_phouse_req_w
    type: float
    restore_value: false
    initial_value: '0.0'

  - id: oq_phouse_last_w
    type: float
    restore_value: false
    initial_value: '0.0'

  - id: oq_phouse_last_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  - id: oq_phouse_comfort_memory_c
    type: float
    restore_value: false
    initial_value: '0.0'

  - id: oq_ph_request_last_loop_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

  - id: oq_ph_request_hp1_level
    type: int
    restore_value: false
    initial_value: '0'

  - id: oq_ph_request_hp2_level
    type: int
    restore_value: false
    initial_value: '0'

  - id: oq_ph_request_owner_hp
    type: int
    restore_value: false
    initial_value: '0'

  - id: oq_ph_request_reason_code
    type: int
    restore_value: false
    initial_value: '0'

  # Fast first-start intent: 0=none, 1=room demand, 2=setpoint raise.
  - id: oq_ph_fast_intent_code
    type: int
    restore_value: false
    initial_value: '0'

select:
  - platform: template
    id: oq_ph_response_profile
    name: "Power House response profile"
    icon: mdi:tune-variant
    options:
      - Calm
      - Balanced
      - Responsive
      - Custom
    update_interval: 5s
    entity_category: config
    lambda: |-
      return oq_power_house_runtime::runtime().response_profile();
    set_action:
      then:
        - lambda: |-
            oq_power_house_runtime::runtime().set_response_profile(x);

number:
  - platform: template
    id: house_cold_temp_c
    name: "House cold temp"
    icon: mdi:thermometer-low
    unit_of_measurement: "°C"
    min_value: -25
    max_value: 5
    step: 0.5
    restore_value: true
    optimistic: true
    initial_value: -10
    entity_category: config

  - platform: template
    id: house_rated_power_w
    name: "Rated maximum house power"
    icon: mdi:home-lightning-bolt
    unit_of_measurement: "W"
    min_value: 1000
    max_value: 15000
    step: 10
    restore_value: true
    optimistic: true
    initial_value: 7020
    entity_category: config

  - platform: template
    id: house_zero_power_temp_c
    name: "Maximum heating outdoor temperature"
    icon: mdi:thermometer-high
    unit_of_measurement: "°C"
    min_value: 5
    max_value: 25
    step: 0.5
    restore_value: true
    optimistic: true
    initial_value: 16
    entity_category: config

  - platform: template
    id: ph_kp_w_per_k
    name: "Power House temperature reaction"
    icon: mdi:function-variant
    unit_of_measurement: "W/K"
    min_value: 0
    max_value: 4000
    step: 10
    restore_value: true
    optimistic: true
    initial_value: 3000
    entity_category: config

  - platform: template
    id: ph_comfort_band_below_c
    name: "Power House comfort below setpoint"
    icon: mdi:thermometer-chevron-down
    unit_of_measurement: "°C"
    min_value: 0
    max_value: 2.0
    step: 0.05
    restore_value: true
    optimistic: true
    initial_value: 0.1
    entity_category: config

  - platform: template
    id: ph_comfort_band_above_c
    name: "Power House comfort above setpoint"
    icon: mdi:thermometer-chevron-up
    unit_of_measurement: "°C"
    min_value: 0
    max_value: 2.0
    step: 0.05
    restore_value: true
    optimistic: true
    initial_value: 0.3
    entity_category: config

  - platform: template
    id: ph_demand_rise_time_min
    name: "Power House demand rise time"
    icon: mdi:chart-line-variant
    unit_of_measurement: "min"
    min_value: 2
    max_value: 20
    step: 1
    restore_value: true
    optimistic: true
    initial_value: 8
    entity_category: config

  - platform: template
    id: ph_demand_fall_time_min
    name: "Power House demand fall time"
    icon: mdi:chart-line
    unit_of_measurement: "min"
    min_value: 1
    max_value: 10
    step: 1
    restore_value: true
    optimistic: true
    initial_value: 3
    entity_category: config

text_sensor:
  - platform: template
    id: oq_duo_optimizer_reason
    name: "Duo optimizer reason"
    internal: true
    update_interval: never
    lambda: |-
      #if OQ_TOPOLOGY_DUO
      return std::string("inactive");
      #else
      return std::string("single_topology");
      #endif
  - platform: template
    id: oq_phouse_demand_source
    name: "Power House – demand source"
    icon: mdi:source-branch
    entity_category: diagnostic
    update_interval: ${oq_diagnostic_update_interval_s}s
    lambda: |-
      return std::string(id(oq_phouse_demand_external) ? "external" : "model");
  - platform: template
    id: oq_ph_fast_intent_sensor
    name: "Power House first-start intent"
    internal: true
    update_interval: 5s
    lambda: |-
      return std::string(oq_heat_intent::reason_name(
          static_cast<oq_heat_intent::Reason>(id(oq_ph_fast_intent_code))));

  # Compact static snapshot for the debug recorder (initial-only via
  # delta-encoding; a new value appears only when the underlying table or
  # setting changes). Covers per-HP heating runtime tables with validity and
  # FNV-1a fingerprint, Power House house settings, the heating minimum-off
  # constant, external-demand stale timeout and the available model IDs.
  # Generation/variant, demand source/selected and low-load factors are already
  # separate debug columns and are not duplicated here. Never invents values: invalid tables
  # yield valid:false with empty hz, missing numbers yield null, HP2 is null
  # on Single, and snprintf overflow yields "unknown" (recorder-missing).
  - platform: template
    id: oq_debug_static_snapshot
    name: "Debug static snapshot"
    internal: true
    update_interval: 5s
    lambda: |-
      // Static snapshot for the debug recorder: heating tables + house settings.
      // Runs every 5s but the value changes only when a table/setting changes,
      // so delta-encoding keeps it initial-only.
      auto table_hash = [](const oq_odu::FrequencyTable &table) -> uint32_t {
        if (!table.valid) return 0U;
        uint32_t hash = 2166136261U;
        for (size_t i = 0; i < table.level_count; ++i) {
          hash ^= table.hz[i];
          hash *= 16777619U;
        }
        hash ^= table.level_count;
        hash *= 16777619U;
        return hash;
      };
      auto build_hz = [](const oq_odu::FrequencyTable &table, char *out, size_t cap) -> bool {
        size_t used = 0;
        int n = snprintf(out + used, cap - used, "[");
        if (n < 0 || (size_t) n >= cap - used) return false;
        used += (size_t) n;
        if (table.valid) {
          for (size_t i = 0; i < table.level_count; ++i) {
            n = snprintf(out + used, cap - used, "%s%u", i == 0 ? "" : ",", table.hz[i]);
            if (n < 0 || (size_t) n >= cap - used) return false;
            used += (size_t) n;
          }
        }
        n = snprintf(out + used, cap - used, "]");
        if (n < 0 || (size_t) n >= cap - used) return false;
        return true;
      };
      auto fmt_float = [](float v, char *out, size_t cap) -> const char * {
        if (!isfinite(v)) return "null";
        snprintf(out, cap, "%.4g", (double) v);
        return out;
      };
      const auto hp1_snapshot =
          oq_odu::decode_runtime_frequency_snapshot(id(hp1_runtime_frequency_snapshot_storage));
      const uint32_t hp1_hash = table_hash(hp1_snapshot.heating);
      char hp1_hz[96]{};
      if (!build_hz(hp1_snapshot.heating, hp1_hz, sizeof(hp1_hz))) return std::string("unknown");
      char hp2_json[256]{};
      #if OQ_TOPOLOGY_DUO
      {
        const auto hp2_snapshot =
            oq_odu::decode_runtime_frequency_snapshot(id(${secondary_runtime_frequency_snapshot_storage_id}));
        const uint32_t hp2_hash = table_hash(hp2_snapshot.heating);
        char hp2_hz[96]{};
        if (!build_hz(hp2_snapshot.heating, hp2_hz, sizeof(hp2_hz))) return std::string("unknown");
        int n = snprintf(hp2_json, sizeof(hp2_json),
                         "{\"valid\":%s,\"count\":%u,\"hash\":%u,\"hz\":%s}",
                         hp2_snapshot.heating.valid ? "true" : "false",
                         (unsigned) hp2_snapshot.heating.level_count, (unsigned) hp2_hash, hp2_hz);
        if (n < 0 || (size_t) n >= sizeof(hp2_json)) return std::string("unknown");
      }
      #else
      snprintf(hp2_json, sizeof(hp2_json), "null");
      #endif
      char cold_b[16]{}, zero_b[16]{}, rated_b[16]{}, kp_b[16]{};
      char below_b[16]{}, above_b[16]{}, rise_b[16]{}, fall_b[16]{};
      const char *cold = fmt_float(
          id(house_cold_temp_c).has_state() ? id(house_cold_temp_c).state : NAN, cold_b, sizeof(cold_b));
      const char *zero = fmt_float(
          id(house_zero_power_temp_c).has_state() ? id(house_zero_power_temp_c).state : NAN, zero_b, sizeof(zero_b));
      const char *rated = fmt_float(
          id(house_rated_power_w).has_state() ? id(house_rated_power_w).state : NAN, rated_b, sizeof(rated_b));
      const char *kp = fmt_float(
          id(ph_kp_w_per_k).has_state() ? id(ph_kp_w_per_k).state : NAN, kp_b, sizeof(kp_b));
      const char *below = fmt_float(
          id(ph_comfort_band_below_c).has_state() ? id(ph_comfort_band_below_c).state : NAN, below_b, sizeof(below_b));
      const char *above = fmt_float(
          id(ph_comfort_band_above_c).has_state() ? id(ph_comfort_band_above_c).state : NAN, above_b, sizeof(above_b));
      const char *rise = fmt_float(
          id(ph_demand_rise_time_min).has_state() ? id(ph_demand_rise_time_min).state : NAN, rise_b, sizeof(rise_b));
      const char *fall = fmt_float(
          id(ph_demand_fall_time_min).has_state() ? id(ph_demand_fall_time_min).state : NAN, fall_b, sizeof(fall_b));
      char buf[640]{};
      int n = snprintf(
          buf, sizeof(buf),
          "{\"availableModels\":{\"v2Thermal\":\"oq-v2-heating-r1\","
          "\"v2Input\":\"oq-v2-input-r1\"},"
          "\"hp1\":{\"valid\":%s,\"count\":%u,\"hash\":%u,\"hz\":%s},\"hp2\":%s,"
          "\"house\":{\"cold\":%s,\"zero\":%s,\"rated\":%s,\"kp\":%s,\"cbBelow\":%s,\"cbAbove\":%s,"
          "\"rise\":%s,\"fall\":%s},\"minOffS\":%s,\"extStaleS\":%s}",
          hp1_snapshot.heating.valid ? "true" : "false", (unsigned) hp1_snapshot.heating.level_count,
          (unsigned) hp1_hash, hp1_hz, hp2_json, cold, zero, rated, kp, below, above, rise, fall,
          "${oq_hp_min_off_s}", "${api_input_external_heat_demand_stale_s}");
      if (n < 0 || (size_t) n >= sizeof(buf)) return std::string("unknown");
      return std::string(buf);

sensor:
  - platform: template
    id: oq_phouse_house_w
    name: "Power House – P_house"
    icon: mdi:home-lightning-bolt
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: ${oq_diagnostic_update_interval_s}s
    lambda: |-
      const float Tout = id(outside_temp_selected).state;
      const float Tc = id(house_cold_temp_c).state;
      const float T0 = id(house_zero_power_temp_c).state;
      const float Pr = id(house_rated_power_w).state;

      if (isnan(Tout) || isnan(Tc) || isnan(T0) || isnan(Pr)) return NAN;
      if (T0 <= Tc + ${oq_temp_guard_delta_c}f) return NAN;

      return oq_power_house::modelled_house_power_w(T0, Tc, Tout, Pr);

  - platform: template
    id: oq_phouse_req_w_sensor
    name: "Power House – P_req"
    icon: mdi:flash
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: ${oq_diagnostic_update_interval_s}s
    lambda: |-
      return id(oq_phouse_req_w);

  - platform: template
    id: oq_phouse_comfort_memory_c_sensor
    name: "Power House – comfort memory"
    internal: true
    unit_of_measurement: "°C"
    state_class: measurement
    accuracy_decimals: 3
    update_interval: 5s
    lambda: |-
      return id(oq_phouse_comfort_memory_c);

  - platform: template
    id: oq_phouse_effective_room_target_c_sensor
    name: "Power House – effective room target"
    internal: true
    unit_of_measurement: "°C"
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 5s
    lambda: |-
      return id(room_setpoint_selected).state + id(oq_phouse_comfort_memory_c);

  # Numeric fast first-start intent for the debug recorder (no behavior change).
  # 0=none, 1=room demand, 2=setpoint raise. The existing
  # "Power House first-start intent" text sensor stays untouched.
  - platform: template
    id: oq_ph_fast_intent_code_sensor
    name: "Power House fast intent code"
    internal: true
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      return (float) id(oq_ph_fast_intent_code);

interval:
  - interval: ${oq_heat_loop_tick_s}s
    startup_delay: 4000ms
    then:
      - lambda: |-
          // Evaluate first-start intent more frequently than normal thermal requests.
          oq_power_house_runtime::runtime().tick({
              (uint32_t) ${oq_ph_demand_loop_s} * 1000UL,
              (uint32_t) ${oq_hp_min_off_s} * 1000UL,
              (int) ${oq_strategy_demand_max_f},
              ${oq_temp_guard_delta_c}f,
              ${oq_defrost_power_factor},
              ${oq_optimizer_penalty_per_w},
              ${oq_optimizer_topology_power_margin_w},
              ${oq_optimizer_topology_heat_advantage_w},
              (int) roundf(${oq_defrost_comp_min_f}),
              (int) roundf(${oq_defrost_comp_boost_steps}),
              (${oq_ot_room_temperature_fresh_expr}),
              (${oq_ot_room_setpoint_fresh_expr}),
          });
