# ==============================================================================
# OpenQuatt - Common Platform Runtime
# ==============================================================================
# Shared, board-independent runtime blocks:
# - Core runtime services (logging/API/OTA)
# - HTTP client
# - RS485 Modbus transport
# - Generic diagnostics entities
# - Runtime debug level controls
# ==============================================================================

# ==============================================================================
# CORE RUNTIME SERVICES
# ==============================================================================
esphome:
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // Always start from a clean paused state after reboot or OTA.
          id(oq_runtime_polling_paused).publish_state(false);
          id(oq_http_ota_begin_observed) = false;
          id(oq_ota_phase_code) = 0;
          id(oq_ota_progress_pct) = 0.0f;
          id(oq_firmware_update_status).publish_state("Idle");
          id(oq_firmware_update_progress).publish_state(0.0f);
          id(oq_project_version_text).publish_state("${project_version}");
          id(oq_release_channel_text).publish_state("${release_channel}");
          #if OQ_TOPOLOGY_DUO
          id(oq_installation_topology_text).publish_state("duo");
          #else
          id(oq_installation_topology_text).publish_state("single");
          #endif
          id(oq_hardware_profile_text).publish_state("${oq_hardware_profile}");
          #ifndef USE_OPENQUATT_NETWORK
          id(oq_connection_text).publish_state("${oq_connection}");
          #endif
          id(oq_fw_select_callbacks_runtime_ready) = true;
          id(oq_firmware_update).add_on_state_callback([]() {
            const uint32_t request_generation = id(oq_fw_check_request_generation);
            if (request_generation == 0 || id(oq_fw_check_completed_generation) == request_generation) {
              return;
            }

            std::string hardware_slug;
            const std::string hardware = "${oq_hardware_profile}";
            if (hardware == "waveshare") {
              hardware_slug = "waveshare";
            } else if (hardware == "heatpump_listener") {
              hardware_slug = "heatpump-listener";
            } else if (hardware == "heatpump_controller_q") {
              hardware_slug = "heatpump-controller-q";
            }
            #if OQ_TOPOLOGY_DUO
            std::string topology = "duo";
            #else
            std::string topology = "single";
            #endif
            std::string connection = "${oq_connection}";
            const std::string target = id(oq_firmware_update_target).current_option();
            if (target == "alternate connection" && std::string("${alternate_connection}") != "") {
              connection = "${alternate_connection}";
            } else if (target == "alternate topology" && std::string("${alternate_topology}") != "") {
              topology = "${alternate_topology}";
            } else if (target == "alternate topology and connection"
                       && std::string("${alternate_topology}") != "") {
              topology = "${alternate_topology}";
              if (std::string("${alternate_connection}") != "") {
                connection = "${alternate_connection}";
              }
            }

            const std::string connection_suffix =
                std::string("${oq_artifact_connection_suffix}").empty() ? "" : "-" + connection;
            const std::string expected_file =
                "openquatt-" + hardware_slug + "-" + topology + connection_suffix + ".firmware.ota.bin";
            const std::string firmware_url = id(oq_firmware_update).update_info.firmware_url;
            id(oq_fw_check_target_ready) = !hardware_slug.empty()
                && firmware_url.size() >= expected_file.size()
                && firmware_url.compare(firmware_url.size() - expected_file.size(),
                                        expected_file.size(), expected_file) == 0;
            id(oq_fw_check_completed_generation) = request_generation;
            ESP_LOGI("oq_fw", "Firmware manifest check %lu completed: target %s.",
                     (unsigned long) request_generation,
                     id(oq_fw_check_target_ready) ? "ready" : "mismatch");
          });
      - script.execute: oq_initial_firmware_update_check

logger:
  level: DEBUG
  initial_level: INFO
  baud_rate: 115200
  runtime_tag_levels: true

debug:
  update_interval: 60s

api:
  reboot_timeout: 0s
  encryption:

provisioning:
  timeout: 10min
  on_timeout:
    then:
      - logger.log: "API provisioning window closed; power-cycle to reopen it"

ota:
  - platform: esphome
    on_begin:
      then:
        - lambda: |-
            id(oq_runtime_polling_paused).publish_state(true);
            ESP_LOGI("oq_fw", "Runtime polling paused for OTA.");
            id(oq_ota_phase_code) = 1;
            id(oq_ota_progress_pct) = 0.0f;
            id(oq_firmware_update_status).publish_state("Starting");
            id(oq_firmware_update_progress).publish_state(0.0f);
    on_progress:
      then:
        - lambda: |-
            id(oq_ota_phase_code) = 2;
            id(oq_ota_progress_pct) = x;
            id(oq_firmware_update_status).publish_state("Uploading");
            id(oq_firmware_update_progress).publish_state(x);
    on_end:
      then:
        - lambda: |-
            id(oq_firmware_target_install_active) = false;
            // ESPHome reboots immediately after this success callback. Keep all
            // runtime polling paused until on_boot initializes the new image.
            ESP_LOGI("oq_fw", "OTA complete; runtime polling remains paused until reboot.");
            id(oq_ota_phase_code) = 3;
            id(oq_ota_progress_pct) = 100.0f;
            id(oq_firmware_update_status).publish_state("Rebooting");
            id(oq_firmware_update_progress).publish_state(100.0f);
    on_error:
      then:
        - lambda: |-
            id(oq_firmware_target_install_active) = false;
            id(oq_runtime_polling_paused).publish_state(false);
            ESP_LOGI("oq_fw", "Runtime polling resumed after OTA error.");
            id(oq_ota_phase_code) = 5;
            id(oq_firmware_update_status).publish_state("Error");
    on_abort:
      then:
        - lambda: |-
            id(oq_firmware_target_install_active) = false;
            id(oq_runtime_polling_paused).publish_state(false);
            ESP_LOGI("oq_fw", "Runtime polling resumed after OTA abort.");
            id(oq_ota_phase_code) = 6;
            id(oq_firmware_update_status).publish_state("Aborted");
  - platform: http_request
    on_begin:
      then:
        - lambda: |-
            id(oq_http_ota_begin_observed) = true;
            id(oq_runtime_polling_paused).publish_state(true);
            ESP_LOGI("oq_fw", "Runtime polling paused for OTA.");
            id(oq_ota_phase_code) = 1;
            id(oq_ota_progress_pct) = 0.0f;
            id(oq_firmware_update_status).publish_state("Starting");
            id(oq_firmware_update_progress).publish_state(0.0f);
    on_progress:
      then:
        - lambda: |-
            id(oq_ota_phase_code) = 2;
            id(oq_ota_progress_pct) = x;
            id(oq_firmware_update_status).publish_state("Uploading");
            id(oq_firmware_update_progress).publish_state(x);
    on_end:
      then:
        - lambda: |-
            id(oq_firmware_target_install_active) = false;
            // http_request OTA also reboots immediately after this success
            // callback. Only error and abort paths may resume the old image.
            ESP_LOGI("oq_fw", "OTA complete; runtime polling remains paused until reboot.");
            id(oq_ota_phase_code) = 3;
            id(oq_ota_progress_pct) = 100.0f;
            id(oq_firmware_update_status).publish_state("Rebooting");
            id(oq_firmware_update_progress).publish_state(100.0f);
    on_error:
      then:
        - if:
            condition:
              lambda: |-
                return id(oq_firmware_target_install_active)
                    && id(oq_firmware_target_install_attempt) < 2
                    && id(oq_ota_progress_pct) <= 0.0f;
            then:
              - lambda: |-
                  id(oq_http_ota_begin_observed) = false;
                  id(oq_runtime_polling_paused).publish_state(true);
                  id(oq_firmware_target_install_attempt) += 1;
                  id(oq_ota_phase_code) = 7;
                  id(oq_ota_progress_pct) = 0.0f;
                  id(oq_firmware_update_status).publish_state("Retrying");
                  id(oq_firmware_update_progress).publish_state(0.0f);
                  ESP_LOGW("oq_fw", "Firmware download connection failed; retrying attempt %u/2 in 5 seconds.",
                           id(oq_firmware_target_install_attempt));
              - script.execute: oq_watch_http_ota_start
              - delay: 5s
              - if:
                  condition:
                    lambda: |-
                      return id(oq_firmware_target_install_active);
                  then:
                    - update.perform:
                        id: oq_firmware_update
                        force_update: true
            else:
              - lambda: |-
                  id(oq_firmware_target_install_active) = false;
                  id(oq_runtime_polling_paused).publish_state(false);
                  ESP_LOGI("oq_fw", "Runtime polling resumed after OTA error.");
                  id(oq_ota_phase_code) = 5;
                  id(oq_firmware_update_status).publish_state("Error");
    on_abort:
      then:
        - lambda: |-
            id(oq_firmware_target_install_active) = false;
            id(oq_runtime_polling_paused).publish_state(false);
            ESP_LOGI("oq_fw", "Runtime polling resumed after OTA abort.");
            id(oq_ota_phase_code) = 6;
            id(oq_firmware_update_status).publish_state("Aborted");

# ==============================================================================
# HTTP REQUEST (shared CIC + OTA update)
# ==============================================================================
http_request:
  id: req
  useragent: esphome/openquatt
  timeout: 10s
  follow_redirects: true
  redirect_limit: 3
  buffer_size_rx: 2048
  buffer_size_tx: 1024

# ==============================================================================
# MODBUS (RS485)
# ==============================================================================
uart:
  - id: uart_bus
    tx_pin: ${uart_tx_pin}
    rx_pin: ${uart_rx_pin}
    flow_control_pin: ${uart_rts_pin}
    baud_rate: 19200
    data_bits: 8
    stop_bits: 1
    parity: EVEN
    rx_full_threshold: 1
    rx_timeout: 1

modbus:
  - uart_id: uart_bus
    id: mod_bus
    send_wait_time: 100ms
    # ESPHome 2026.8 moved command spacing from modbus_controller to the shared hub.
    turnaround_time: ${oq_modbus_command_throttle_ms}ms

# ==============================================================================
# SHARED RUNTIME STATE
# ==============================================================================
globals:
  - id: oq_fw_check_last_request_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: oq_fw_select_callbacks_runtime_ready
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: oq_fw_boot_check_pending
    type: bool
    restore_value: false
    initial_value: 'true'
  - id: oq_fw_boot_check_network_since_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: oq_fw_check_request_generation
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: oq_fw_check_completed_generation
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: oq_fw_check_target_ready
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: oq_firmware_target_install_active
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: oq_firmware_target_install_attempt
    type: uint8_t
    restore_value: false
    initial_value: '0'
  - id: oq_boot_startup_inhibit_until_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: oq_boot_startup_inhibit_active
    type: bool
    restore_value: false
    initial_value: 'true'
  - id: oq_ota_progress_pct
    type: float
    restore_value: false
    initial_value: '0.0f'
  - id: oq_ota_phase_code
    type: int
    restore_value: false
    initial_value: '0'
  - id: oq_http_ota_begin_observed
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: oq_trend_capture_force_once
    type: bool
    restore_value: false
    initial_value: 'false'

# ==============================================================================
# OVERVIEW TRENDS
# ==============================================================================
script:
  - id: oq_apply_firmware_update_source
    mode: queued
    then:
      - lambda: |-
          // Re-apply the manifest URL immediately before check/install so the selected target wins.
          const std::string channel = id(oq_firmware_update_channel).current_option();
          const std::string target = id(oq_firmware_update_target).current_option();
          const bool alternate_connection_update_target = target == "alternate connection";
          const bool alternate_topology_update_target = target == "alternate topology";
          const bool alternate_build_update_target = target == "alternate topology and connection";
          const bool dev_channel = channel == "dev";

          const char *source_url = dev_channel ? "${dev_release_manifest_url}" : "${main_release_manifest_url}";
          const char *alternate_connection_url =
            dev_channel ? "${alternate_dev_release_manifest_url}" : "${alternate_main_release_manifest_url}";
          const char *alternate_topology_url =
            dev_channel ? "${alternate_topology_dev_release_manifest_url}" : "${alternate_topology_main_release_manifest_url}";
          const char *alternate_build_url =
            dev_channel ? "${alternate_build_dev_release_manifest_url}" : "${alternate_build_main_release_manifest_url}";
          if (alternate_build_update_target && alternate_build_url[0] != '\0') {
            source_url = alternate_build_url;
          } else if (alternate_connection_update_target && alternate_connection_url[0] != '\0') {
            source_url = alternate_connection_url;
          } else if (alternate_topology_update_target && alternate_topology_url[0] != '\0') {
            source_url = alternate_topology_url;
          }

          ESP_LOGI("oq_fw", "Firmware update target '%s' on channel '%s' uses manifest: %s",
                   target.c_str(), channel.c_str(), source_url);
          id(oq_firmware_update).set_source_url(source_url);

  - id: oq_initial_firmware_update_check
    mode: single
    then:
      # Keep the TLS-heavy manifest request outside the first API/web/MQTT
      # publication waves. A disconnect restarts the stable-network window.
      - while:
          condition:
            lambda: |-
              return id(oq_fw_boot_check_pending);
          then:
            - if:
                condition:
                  lambda: |-
                    return esphome::network::is_connected()
                        && !id(oq_runtime_polling_paused).state;
                then:
                  - lambda: |-
                      id(oq_fw_boot_check_network_since_ms) = (uint32_t) millis();
                      ESP_LOGI("oq_fw", "Initial firmware manifest check scheduled after ${oq_firmware_initial_check_delay_s} seconds of stable network.");
                  - while:
                      condition:
                        lambda: |-
                          const uint32_t elapsed_ms =
                              (uint32_t) millis() - id(oq_fw_boot_check_network_since_ms);
                          return id(oq_fw_boot_check_pending)
                              && esphome::network::is_connected()
                              && !id(oq_runtime_polling_paused).state
                              && elapsed_ms < (uint32_t) ${oq_firmware_initial_check_delay_s} * 1000UL;
                      then:
                        # Five-second sampling avoids a hot polling loop while
                        # still rejecting meaningful connectivity interruptions.
                        - delay: 5s
                  - if:
                      condition:
                        lambda: |-
                          const uint32_t elapsed_ms =
                              (uint32_t) millis() - id(oq_fw_boot_check_network_since_ms);
                          return id(oq_fw_boot_check_pending)
                              && esphome::network::is_connected()
                              && !id(oq_runtime_polling_paused).state
                              && elapsed_ms >= (uint32_t) ${oq_firmware_initial_check_delay_s} * 1000UL;
                      then:
                        - lambda: |-
                            id(oq_fw_boot_check_pending) = false;
                            id(oq_fw_check_last_request_ms) = (uint32_t) millis();
                        - script.execute: oq_apply_firmware_update_source
                        - script.wait: oq_apply_firmware_update_source
                        - update.check:
                            id: oq_firmware_update
                      else:
                        - lambda: |-
                            if (id(oq_fw_boot_check_pending)) {
                              ESP_LOGI("oq_fw", "Initial firmware manifest check delayed until the network is stable and OTA is inactive again.");
                            }
                else:
                  - delay: 5s
      # The http_request update component's native scheduler is disabled below
      # so its built-in network-ready check cannot run during boot. Keep all
      # subsequent automatic checks on this explicit cadence.
      - while:
          condition:
            lambda: |-
              return true;
          then:
            - delay: ${oq_firmware_periodic_check_interval}
            - if:
                condition:
                  lambda: |-
                    return esphome::network::is_connected()
                        && !id(oq_runtime_polling_paused).state
                        && !id(oq_firmware_target_install_active);
                then:
                  - script.execute: oq_apply_firmware_update_source
                  - script.wait: oq_apply_firmware_update_source
                  - lambda: |-
                      id(oq_fw_check_last_request_ms) = (uint32_t) millis();
                  - update.check:
                      id: oq_firmware_update
                else:
                  - lambda: |-
                      ESP_LOGI("oq_fw", "Periodic firmware manifest check skipped: network unavailable or OTA active.");

  - id: oq_watch_http_ota_start
    mode: restart
    then:
      # The retry arms this before its 5 s delay. Seventeen seconds covers that
      # delay, the shared 10 s HTTP timeout and scheduling margin.
      - wait_until:
          condition:
            lambda: |-
              return id(oq_http_ota_begin_observed)
                  || !id(oq_firmware_target_install_active);
          timeout: 17s
      - if:
          condition:
            lambda: |-
              return !id(oq_http_ota_begin_observed)
                  && id(oq_firmware_target_install_active);
          then:
            - lambda: |-
                id(oq_firmware_target_install_active) = false;
                id(oq_runtime_polling_paused).publish_state(false);
                id(oq_ota_phase_code) = 5;
                id(oq_firmware_update_status).publish_state("Error");
                ESP_LOGE("oq_fw", "Firmware install did not reach the OTA start callback; polling resumed.");

  - id: oq_install_firmware_update_target_deferred
    mode: single
    then:
      - lambda: |-
          // Clear terminal state before starting a new install attempt.
          id(oq_fw_boot_check_pending) = false;
          id(oq_http_ota_begin_observed) = false;
          id(oq_ota_phase_code) = 1;
          id(oq_firmware_update_status).publish_state("Starting");
          id(oq_firmware_update_progress).publish_state(0.0f);
      # Let the web_server/API button response finish before TLS-heavy GitHub OTA starts.
      - delay: 1500ms
      - script.execute: oq_apply_firmware_update_source
      - script.wait: oq_apply_firmware_update_source
      - lambda: |-
          id(oq_fw_check_request_generation) += 1;
          if (id(oq_fw_check_request_generation) == 0) {
            id(oq_fw_check_request_generation) = 1;
          }
          id(oq_fw_check_target_ready) = false;
          ESP_LOGI("oq_fw", "Waiting for firmware manifest check %lu before install.",
                   (unsigned long) id(oq_fw_check_request_generation));
      - update.check:
          id: oq_firmware_update
      - wait_until:
          condition:
            lambda: |-
              return id(oq_fw_check_completed_generation) == id(oq_fw_check_request_generation);
          timeout: 20s
      - if:
          condition:
            lambda: |-
              return id(oq_fw_check_completed_generation) != id(oq_fw_check_request_generation)
                  || !id(oq_fw_check_target_ready);
          then:
            - lambda: |-
                id(oq_fw_check_request_generation) += 1;
                if (id(oq_fw_check_request_generation) == 0) {
                  id(oq_fw_check_request_generation) = 1;
                }
                id(oq_fw_check_target_ready) = false;
                ESP_LOGW("oq_fw", "Firmware manifest check did not complete; retrying check %lu once.",
                         (unsigned long) id(oq_fw_check_request_generation));
            - update.check:
                id: oq_firmware_update
            - wait_until:
                condition:
                  lambda: |-
                    return id(oq_fw_check_completed_generation) == id(oq_fw_check_request_generation);
                timeout: 20s
      - if:
          condition:
            lambda: |-
              return id(oq_fw_check_completed_generation) == id(oq_fw_check_request_generation)
                  && id(oq_fw_check_target_ready)
                  && !id(oq_runtime_polling_paused).state
                  && !id(oq_firmware_target_install_active);
          then:
            - lambda: |-
                id(oq_firmware_target_install_active) = true;
                id(oq_firmware_target_install_attempt) = 1;
                id(oq_http_ota_begin_observed) = false;
                id(oq_runtime_polling_paused).publish_state(true);
                ESP_LOGI("oq_fw", "Runtime polling paused before deferred OTA.");
                id(oq_firmware_update_status).publish_state("Starting");
                id(oq_firmware_update_progress).publish_state(0.0f);
            - delay: 1500ms
            - script.execute: oq_watch_http_ota_start
            - update.perform:
                id: oq_firmware_update
                force_update: true
          else:
            - lambda: |-
                // This script has not acquired the polling pause yet. Preserve
                // any pause and status owned by an OTA that started while the
                // manifest checks were running.
                if (id(oq_runtime_polling_paused).state) {
                  ESP_LOGW("oq_fw", "Firmware install request cancelled because another OTA became active.");
                } else {
                  id(oq_ota_phase_code) = 5;
                  id(oq_firmware_update_status).publish_state("Error");
                  ESP_LOGE("oq_fw", "Firmware install blocked: target manifest check failed twice.");
                }

  - id: oq_capture_overview_trend_sample
    mode: single
    then:
      - lambda: |-
          // Verzamel een compacte trendregel en sla alleen echte meetwaarden op.
          const bool force_sample = id(oq_trend_capture_force_once);
          id(oq_trend_capture_force_once) = false;
          if (id(oq_runtime_polling_paused).state) {
            return;
          }
          if (!id(oq_trend_history_enabled_switch).state) {
            return;
          }
          const float outside_c = id(outside_temp_selected).has_state() ? id(outside_temp_selected).state : NAN;
          const float room_c = id(room_temp_selected).has_state() ? id(room_temp_selected).state : NAN;
          const float room_sp_c = id(room_setpoint_selected).has_state() ? id(room_setpoint_selected).state : NAN;
          const float supply_c = id(water_supply_temp_selected).has_state() ? id(water_supply_temp_selected).state : NAN;
          const float flow_lph = id(flow_rate_selected).has_state() ? id(flow_rate_selected).state : NAN;
          const float input_w = id(oq_total_power_input).has_state() ? id(oq_total_power_input).state : NAN;

          float output_w = NAN;
          bool cooling_mode = false;
          if (id(oq_control_mode_label).has_state()) {
            std::string mode_label = id(oq_control_mode_label).state;
            for (char &ch : mode_label) {
              ch = static_cast<char>(tolower(static_cast<unsigned char>(ch)));
            }
            cooling_mode = mode_label.find("koel") != std::string::npos || mode_label.find("cool") != std::string::npos;
          }
          if (cooling_mode) {
            output_w = id(oq_total_cooling_power).has_state() ? id(oq_total_cooling_power).state : NAN;
          } else {
            output_w = id(oq_total_heat_power).has_state() ? id(oq_total_heat_power).state : NAN;
          }

          if (isnan(outside_c) && isnan(room_c) && isnan(room_sp_c) && isnan(supply_c) && isnan(flow_lph) && isnan(input_w) && isnan(output_w)) {
            return;
          }

          id(oq_trends_endpoint).capture_sample(outside_c, supply_c, room_c, room_sp_c, flow_lph, input_w, output_w, force_sample);

  - id: oq_capture_energy_history_sample
    mode: single
    then:
      - lambda: |-
          if (!id(oq_lifetime_energy_history_switch).state) {
            return;
          }

          // Capture the current daily energy totals; the component writes only at day rollover/shutdown.
          const float electrical_input_kwh = id(oq_electrical_energy_daily).has_state() ? id(oq_electrical_energy_daily).state : NAN;
          const float heating_input_kwh = id(oq_heating_electrical_energy_daily).has_state() ? id(oq_heating_electrical_energy_daily).state : NAN;
          const float cooling_input_kwh = id(oq_cooling_electrical_energy_daily).has_state() ? id(oq_cooling_electrical_energy_daily).state : NAN;
          const float heatpump_heat_output_kwh = id(oq_heatpump_thermal_energy_daily).has_state() ? id(oq_heatpump_thermal_energy_daily).state : NAN;
          const float heatpump_cooling_output_kwh = id(oq_heatpump_cooling_energy_daily).has_state() ? id(oq_heatpump_cooling_energy_daily).state : NAN;
          const float boiler_heat_output_kwh = id(oq_boiler_thermal_energy_daily).has_state() ? id(oq_boiler_thermal_energy_daily).state : NAN;
          const float system_heat_output_kwh = id(oq_system_thermal_energy_daily).has_state() ? id(oq_system_thermal_energy_daily).state : NAN;

          id(oq_energy_history_endpoint).capture_day_totals(
            electrical_input_kwh,
            heating_input_kwh,
            cooling_input_kwh,
            heatpump_heat_output_kwh,
            heatpump_cooling_output_kwh,
            boiler_heat_output_kwh,
            system_heat_output_kwh
          );

