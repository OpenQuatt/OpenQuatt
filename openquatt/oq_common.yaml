# ==============================================================================
# DIAGNOSTIC ENTITIES
# ==============================================================================
select:
  - platform: template
    name: "Firmware Update Channel"
    id: oq_firmware_update_channel
    icon: mdi:source-branch
    entity_category: config
    optimistic: true
    restore_value: true
    options: ["main", "dev"]
    initial_option: "${release_channel}"
    on_value:
      then:
        - lambda: |-
            // Keep the update source aligned with the selected channel and target.
            const bool alternate_connection_update_target =
              id(oq_firmware_update_target).current_option() == "alternate connection";
            const bool alternate_topology_update_target =
              id(oq_firmware_update_target).current_option() == "alternate topology";
            const bool alternate_build_update_target =
              id(oq_firmware_update_target).current_option() == "alternate topology and connection";
            if (x == "dev") {
              const char *source_url = "${dev_release_manifest_url}";
              const char *alternate_connection_url = "${alternate_dev_release_manifest_url}";
              const char *alternate_topology_url = "${alternate_topology_dev_release_manifest_url}";
              const char *alternate_build_url = "${alternate_build_dev_release_manifest_url}";
              if (alternate_build_update_target && alternate_build_url[0] != '\0') {
                source_url = alternate_build_url;
              } else if (alternate_connection_update_target && alternate_connection_url[0] != '\0') {
                source_url = alternate_connection_url;
              } else if (alternate_topology_update_target && alternate_topology_url[0] != '\0') {
                source_url = alternate_topology_url;
              }
              id(oq_firmware_update).set_source_url(source_url);
            } else {
              const char *source_url = "${main_release_manifest_url}";
              const char *alternate_connection_url = "${alternate_main_release_manifest_url}";
              const char *alternate_topology_url = "${alternate_topology_main_release_manifest_url}";
              const char *alternate_build_url = "${alternate_build_main_release_manifest_url}";
              if (alternate_build_update_target && alternate_build_url[0] != '\0') {
                source_url = alternate_build_url;
              } else if (alternate_connection_update_target && alternate_connection_url[0] != '\0') {
                source_url = alternate_connection_url;
              } else if (alternate_topology_update_target && alternate_topology_url[0] != '\0') {
                source_url = alternate_topology_url;
              }
              id(oq_firmware_update).set_source_url(source_url);
            }
        - if:
            condition:
              lambda: |-
                if (!id(oq_fw_select_callbacks_runtime_ready)) {
                  return false;
                }
                // A real runtime selection supersedes the deferred boot check.
                id(oq_fw_boot_check_pending) = false;
                // Prevent duplicate update checks when the channel changes repeatedly.
                constexpr uint32_t fw_check_cooldown_ms = 1000UL;
                const uint32_t now_ms = (uint32_t) millis();
                const uint32_t last_request_ms = id(oq_fw_check_last_request_ms);
                if (last_request_ms > 0 && now_ms >= last_request_ms &&
                    (now_ms - last_request_ms) < fw_check_cooldown_ms) {
                  ESP_LOGI("oq_fw", "Firmware update check skipped: cooldown active after a recent request.");
                  return false;
                }
                id(oq_fw_check_last_request_ms) = now_ms;
                return true;
            then:
              - update.check:
                  id: oq_firmware_update

  - platform: template
    name: "Firmware Update Target"
    id: oq_firmware_update_target
    icon: mdi:swap-horizontal
    internal: true
    disabled_by_default: true
    entity_category: config
    optimistic: true
    restore_value: false
    options: ["current build", "alternate connection", "alternate topology", "alternate topology and connection"]
    initial_option: "current build"
    on_value:
      then:
        - lambda: |-
            // Switch between the current-build manifest and alternate target manifests.
            const bool alternate_connection_update_target = x == "alternate connection";
            const bool alternate_topology_update_target = x == "alternate topology";
            const bool alternate_build_update_target = x == "alternate topology and connection";
            if (id(oq_firmware_update_channel).current_option() == "dev") {
              const char *source_url = "${dev_release_manifest_url}";
              const char *alternate_connection_url = "${alternate_dev_release_manifest_url}";
              const char *alternate_topology_url = "${alternate_topology_dev_release_manifest_url}";
              const char *alternate_build_url = "${alternate_build_dev_release_manifest_url}";
              if (alternate_build_update_target && alternate_build_url[0] != '\0') {
                source_url = alternate_build_url;
              } else if (alternate_connection_update_target && alternate_connection_url[0] != '\0') {
                source_url = alternate_connection_url;
              } else if (alternate_topology_update_target && alternate_topology_url[0] != '\0') {
                source_url = alternate_topology_url;
              }
              id(oq_firmware_update).set_source_url(source_url);
            } else {
              const char *source_url = "${main_release_manifest_url}";
              const char *alternate_connection_url = "${alternate_main_release_manifest_url}";
              const char *alternate_topology_url = "${alternate_topology_main_release_manifest_url}";
              const char *alternate_build_url = "${alternate_build_main_release_manifest_url}";
              if (alternate_build_update_target && alternate_build_url[0] != '\0') {
                source_url = alternate_build_url;
              } else if (alternate_connection_update_target && alternate_connection_url[0] != '\0') {
                source_url = alternate_connection_url;
              } else if (alternate_topology_update_target && alternate_topology_url[0] != '\0') {
                source_url = alternate_topology_url;
              }
              id(oq_firmware_update).set_source_url(source_url);
            }
        - if:
            condition:
              lambda: |-
                if (!id(oq_fw_select_callbacks_runtime_ready)) {
                  return false;
                }
                // A real runtime selection supersedes the deferred boot check.
                id(oq_fw_boot_check_pending) = false;
                // Prevent duplicate update checks when the target changes repeatedly.
                constexpr uint32_t fw_check_cooldown_ms = 1000UL;
                const uint32_t now_ms = (uint32_t) millis();
                const uint32_t last_request_ms = id(oq_fw_check_last_request_ms);
                if (last_request_ms > 0 && now_ms >= last_request_ms &&
                    (now_ms - last_request_ms) < fw_check_cooldown_ms) {
                  ESP_LOGI("oq_fw", "Firmware update check skipped: cooldown active after a recent request.");
                  return false;
                }
                id(oq_fw_check_last_request_ms) = now_ms;
                return true;
            then:
              - update.check:
                  id: oq_firmware_update

  - platform: template
    name: "Quatt Hybrid version"
    id: hp_generation
    icon: mdi:factory
    entity_category: config
    optimistic: true
    restore_value: true
    options: ["V1", "V1.5", "V2"]
    initial_option: V1.5

  - platform: template
    name: "Debug Level"
    id: debug_level_select
    internal: true
    disabled_by_default: true
    icon: mdi:lan
    entity_category: diagnostic
    optimistic: true
    # Always recover to INFO after a reboot; DEBUG can overwhelm busy Duo installations.
    restore_value: false
    options: [NONE, ERROR, WARN, INFO, CONFIG, DEBUG]
    initial_option: INFO
    on_value:
      then:
        - lambda: |-
            int lvl =
              (x == "NONE")    ? 0 :
              (x == "ERROR")   ? 1 :
              (x == "WARN")    ? 2 :
              (x == "INFO")    ? 3 :
              (x == "CONFIG")  ? 4 :
                                 5;  // DEBUG

            ESP_LOGI("oq_fw", "Runtime logger level updated to %s", x.c_str());
            esphome::logger::global_logger->set_log_level(lvl);

  - platform: template
    name: "Uurdetail bewaren"
    id: oq_lifetime_energy_hour_retention
    icon: mdi:chart-bar
