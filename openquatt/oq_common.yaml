  - platform: template
    id: uptime_readable_text
    name: Uptime readable
    internal: true
    icon: mdi:timer-outline
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      // Read the raw uptime and bail out early when the source is unavailable.
      if (isnan(id(uptime_sensor).state)) {
        return {"unknown"};
      }

      const uint32_t total_seconds = static_cast<uint32_t>(id(uptime_sensor).state);
      const uint32_t days = total_seconds / 86400U;
      const uint32_t hours = (total_seconds % 86400U) / 3600U;
      const uint32_t minutes = (total_seconds % 3600U) / 60U;
      const uint32_t seconds = total_seconds % 60U;

      // Format the most compact readable representation for the dashboard.
      char buffer[32];
      if (days > 0U) {
        snprintf(buffer, sizeof(buffer), "%ud %uh %um", static_cast<unsigned>(days),
                 static_cast<unsigned>(hours), static_cast<unsigned>(minutes));
      } else if (hours > 0U) {
        snprintf(buffer, sizeof(buffer), "%uh %um", static_cast<unsigned>(hours),
                 static_cast<unsigned>(minutes));
      } else if (minutes > 0U) {
        snprintf(buffer, sizeof(buffer), "%um", static_cast<unsigned>(minutes));
      } else {
        snprintf(buffer, sizeof(buffer), "%us", static_cast<unsigned>(seconds));
      }
      return {buffer};

update:
  - platform: http_request
    id: oq_firmware_update
    name: Firmware Update
    source: ${release_manifest_url}
    # Prevent ESPHome's built-in network-ready check at about 10 seconds after
    # boot. oq_initial_firmware_update_check owns both initial and periodic checks.
    update_interval: never
    icon: mdi:update
    entity_category: diagnostic

# ==============================================================================
# OVERVIEW TRENDS
# ==============================================================================
interval:
  - interval: 30s
    startup_delay: 45s
    then:
      - script.execute: oq_capture_overview_trend_sample
      - script.execute: oq_capture_energy_history_sample
