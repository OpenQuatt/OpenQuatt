# ==============================================================================
# OpenQuatt - Home Assistant Inputs (external proxy ingest)
# ==============================================================================
#
# Goal:
#   Ingest selected Home Assistant proxy sensors as numeric inputs for OpenQuatt.
#
# Scope:
#   - Fixed HA-backed temperature and thermostat proxy inputs
#   - HA heating/cooling enable proxy contracts
#   - Optional HA external heat demand proxy used as Power House feedforward
#   - Aggregate HA cooling proxy contract used for cooling safety
#
# Notes:
#   - Entity IDs are compile-time substitutions in oq_substitutions_common.yaml.
#   - These sensors are intended as stable HA proxy contracts.
#
# ==============================================================================

sensor:
  - platform: homeassistant
    id: outside_temp_ha
    name: "HA - Outside Temperature"
    entity_id: ${ha_outside_temp_entity_id}
    internal: false
    icon: mdi:thermometer
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2

  - platform: homeassistant
    id: water_supply_temp_ha
    name: "HA - Water Supply Temperature"
    entity_id: ${ha_water_supply_temp_entity_id}
    internal: false
    icon: mdi:water-thermometer
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2

  - platform: homeassistant
    id: thermostat_setpoint_ha
    name: "HA - Thermostat Setpoint"
    entity_id: ${ha_room_setpoint_entity_id}
    internal: false
    icon: mdi:thermostat
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2

  - platform: homeassistant
    id: thermostat_room_temp_ha
    name: "HA - Thermostat Room Temperature"
    entity_id: ${ha_room_temp_entity_id}
    internal: false
    icon: mdi:home-thermometer
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2

  - platform: homeassistant
    id: cooling_dew_point_ha
    name: "HA - Cooling Dew Point"
    entity_id: ${ha_cooling_dew_point_entity_id}
    internal: true
    unit_of_measurement: "°C"
    state_class: measurement
    accuracy_decimals: 2

  - platform: homeassistant
    id: external_heat_demand_ha
    name: "HA - External Heat Demand"
    entity_id: ${ha_external_heat_demand_entity_id}
    internal: false
    disabled_by_default: true
    icon: mdi:home-lightning-bolt
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

binary_sensor:
  - platform: homeassistant
    id: heating_enable_ha
    name: "HA - Heating Enable"
    entity_id: ${ha_heating_enable_entity_id}
    internal: false
    disabled_by_default: true
    icon: mdi:radiator
    device_class: heat

  - platform: homeassistant
    id: cooling_enable_ha
    name: "HA - Cooling Enable"
    entity_id: ${ha_cooling_enable_entity_id}
    internal: false
    disabled_by_default: true
    icon: mdi:snowflake-check
    device_class: cold

  - platform: homeassistant
    id: outside_temp_valid_ha
    name: "HA - Outside Temperature Valid"
    entity_id: ${ha_outside_temp_valid_entity_id}
    internal: true

  - platform: homeassistant
    id: water_supply_temp_valid_ha
    name: "HA - Water Supply Temperature Valid"
    entity_id: ${ha_water_supply_temp_valid_entity_id}
    internal: true

  - platform: homeassistant
    id: room_setpoint_valid_ha
    name: "HA - Room Setpoint Valid"
    entity_id: ${ha_room_setpoint_valid_entity_id}
    internal: true

  - platform: homeassistant
    id: room_temp_valid_ha
    name: "HA - Room Temperature Valid"
    entity_id: ${ha_room_temp_valid_entity_id}
    internal: true

  - platform: homeassistant
    id: heating_enable_valid_ha
    name: "HA - Heating Enable Valid"
    entity_id: ${ha_heating_enable_valid_entity_id}
    internal: true

  - platform: homeassistant
    id: cooling_enable_valid_ha
    name: "HA - Cooling Enable Valid"
    entity_id: ${ha_cooling_enable_valid_entity_id}
    internal: true

  - platform: homeassistant
    id: cooling_dew_point_valid_ha
    name: "HA - Cooling Dew Point Valid"
    entity_id: ${ha_cooling_dew_point_valid_entity_id}
    internal: true

  - platform: homeassistant
    id: external_heat_demand_valid_ha
    name: "HA - External Heat Demand Valid"
    entity_id: ${ha_external_heat_demand_valid_entity_id}
    internal: true
