# ==============================================================================
# OpenQuatt - Common Substitutions
# ==============================================================================
#
# Single source of truth for all substitution defaults used across packages.
# Keep keys stable and grouped by concern to avoid drift.
#
# ==============================================================================

# ----------------------------
# CORE PROJECT
# ----------------------------
device_name: "openquatt"                              # Internal ESPHome device ID / hostname base.
friendly_name: OpenQuatt                              # Display name in Home Assistant / UI.
project_name: "openquatt.openquatt"                   # ESPHome project identifier shown in firmware metadata.
project_version: "v0.48.0"                            # ESPHome project version shown in firmware metadata.
release_channel: "main"                               # Firmware release channel shown in diagnostics (`main` or `dev`).
oq_firmware_initial_check_delay_s: "300"              # Stable-network delay before the first automatic manifest check [s].
oq_firmware_periodic_check_interval: "4h"              # Automatic manifest-check cadence after the initial boot window.
oq_hardware_profile: "unknown"                        # Compile-time hardware profile id.
oq_hardware_build_flag: "-DOQ_HARDWARE_HEATPUMP_CONTROLLER_Q=0" # Hardware capability flag for C++ lambdas.
oq_boiler_transport_shutdown_extra: ""                 # Optional profile-specific synchronous actuator shutdown statements.
oq_local_supply_temp_sensor_id: "water_supply_temp_ds18b20" # Profile-safe local supply-temperature sensor used by shared lambdas.
oq_local_supply_temp_selector_id: "water_supply_source"     # Validation-safe placeholder outside Q profiles.
oq_controller_flow_sensor_id: "hp1_flow"              # Profile-safe controller-flow source used by shared lambdas.
oq_q_flow_source_selector_id: "flow_source"           # Validation-safe placeholder outside Q profiles.
oq_connection: "unknown"                              # Compile-time connection profile id (`wifi` or `eth`).
alternate_connection: ""                              # Optional connection target used for controlled Wi-Fi/Ethernet switching.
alternate_main_release_manifest_url: ""               # Optional main-channel OTA manifest for the alternate connection target.
alternate_dev_release_manifest_url: ""                # Optional dev-channel OTA manifest for the alternate connection target.
alternate_topology: ""                                # Optional topology target used for controlled single/duo switching.
alternate_topology_main_release_manifest_url: ""       # Optional main-channel OTA manifest for the alternate topology target.
alternate_topology_dev_release_manifest_url: ""        # Optional dev-channel OTA manifest for the alternate topology target.
alternate_build_main_release_manifest_url: ""          # Optional main-channel OTA manifest when both connection and topology change.
alternate_build_dev_release_manifest_url: ""           # Optional dev-channel OTA manifest when both connection and topology change.
openquatt_root: "../../openquatt"                    # OpenQuatt package root relative to the active config file.
components_root: "../../components"                  # Custom component root relative to the active config file.
scripts_root: "../../../scripts"                     # Build script root relative to the active config file.
oq_cpp_headers_dir: "${openquatt_root}/includes"     # Copy and include the grouped OpenQuatt C++ runtime headers.
oq_component_psram_buffer_header: "${components_root}/openquatt_common/PsramBuffer.h" # Shared PSRAM-backed buffer helper for custom components.
oq_component_flash_layout_header: "${components_root}/openquatt_common/OpenQuattFlashLayout.h" # Shared openquatt_data archive layout.
external_components_path: "${components_root}"      # Local custom component directory.
oq_timezone: "Europe/Amsterdam"                         # SNTP timezone used by runtime timestamps.
oq_webserver_css_include: "${openquatt_root}/web/css/openquatt-app.css" # Bundled OpenQuatt web UI stylesheet.
oq_webserver_js_include: "${openquatt_root}/web/js/openquatt-app.js" # Bundled OpenQuatt web UI script.
oq_webserver_css_url: ""                            # Optional external CSS for the ESPHome web UI.
oq_webserver_js_url: ""                               # Custom OpenQuatt app is primary; load ESPHome fallback lazily on demand.
web_auth_bootstrap_username: "admin"                  # Bootstrap username used to keep web auth support compiled in.
web_auth_bootstrap_password: "openquatt"              # Bootstrap password used to keep web auth support compiled in.
web_auth_default_enabled: false                       # Web auth is opt-in by default for new installs.
mqtt_bootstrap_broker: ""                             # Bootstrap MQTT broker kept empty until the web app stores one.
mqtt_bootstrap_port: "1883"                           # Default MQTT broker port used for runtime storage.
mqtt_bootstrap_username: ""                           # Bootstrap MQTT username.
mqtt_bootstrap_password: ""                           # Bootstrap MQTT password.
mqtt_default_enabled: false                           # MQTT starts disabled until the user enables it explicitly.
mqtt_cooling_dew_point_topic: "openquatt/${device_name}/input/cooling/dew_point" # Fixed MQTT input topic for external cooling dew point [degC].
mqtt_cooling_dew_point_stale_s: "900"                 # Maximum age for the last valid MQTT dew point before it becomes invalid [s].
mqtt_outside_temperature_topic: "openquatt/${device_name}/input/weather/outdoor_temperature" # Fixed MQTT input topic for external outside temperature [degC].
mqtt_outside_temperature_stale_s: "1800"              # Maximum age for the last valid MQTT outside temperature before it becomes invalid [s].
mqtt_room_temperature_topic: "openquatt/${device_name}/input/thermostat/room_temperature" # Fixed MQTT input topic for external room temperature [degC].
mqtt_room_temperature_stale_s: "600"                  # Maximum age for the last valid MQTT room temperature before it becomes invalid [s].
mqtt_room_setpoint_topic: "openquatt/${device_name}/input/thermostat/room_setpoint" # Fixed MQTT input topic for external room setpoint [degC].
mqtt_room_setpoint_stale_s: "0"                       # Maximum age for MQTT room setpoint [s]; 0 keeps state until a new payload, disable, or restart.
mqtt_heating_enable_topic: "openquatt/${device_name}/input/thermostat/heating_enable" # Fixed MQTT input topic for external heating enable [boolean].
mqtt_heating_enable_stale_s: "0"                      # Maximum age for MQTT heating-enable [s]; 0 keeps state until a new payload, disable, or restart.
mqtt_cooling_enable_topic: "openquatt/${device_name}/input/thermostat/cooling_enable" # Fixed MQTT input topic for external cooling enable [boolean].
mqtt_cooling_enable_stale_s: "0"                      # Maximum age for MQTT cooling-enable [s]; 0 keeps state until a new payload, disable, or restart.
api_input_cooling_dew_point_stale_s: "900"            # Maximum age for API-input cooling dew point before it becomes invalid [s].
api_input_outside_temperature_stale_s: "1800"         # Maximum age for API-input outside temperature before it becomes invalid [s].
api_input_room_temperature_stale_s: "600"             # Maximum age for API-input room temperature before it becomes invalid [s].
api_input_room_setpoint_stale_s: "0"                  # Maximum age for API-input room setpoint [s]; 0 keeps state until restart or a new payload.
api_input_heating_enable_stale_s: "0"                 # Maximum age for API-input heating-enable [s]; 0 keeps state until restart or a new payload.
api_input_cooling_enable_stale_s: "0"                 # Maximum age for API-input cooling-enable [s]; 0 keeps state until restart or a new payload.
api_input_external_heat_demand_stale_s: "900"         # Maximum age for API-input external heat demand before it becomes invalid [s].
usage_telemetry_broker: "mqtt.openquatt.nl"           # Central usage-statistics MQTT broker.
usage_telemetry_port: "1883"                          # Plain MQTT port for the current central broker.
usage_telemetry_tls: "false"                          # Temporary until the central broker exposes MQTT/TLS.
usage_telemetry_username: "openquatt"                 # Shared central broker username.
usage_telemetry_password: "openquatt"                 # Shared central broker password; not strong device authentication.
usage_telemetry_topic: "openquatt/devices"            # Base topic for openquatt/devices/<installation-id>/telemetry.

# ----------------------------
# HARDWARE
# ----------------------------
# Hardware-specific substitutions are provided by per-profile files:
# - openquatt/profiles/waveshare.yaml
# - openquatt/profiles/heatpump_listener.yaml
# - openquatt/profiles/heatpump_controller_q.yaml

# ----------------------------
# TOPOLOGY CONTRACT
# ----------------------------
# A single topology substitution (`secondary_hp_id`) resolves these shared IDs
# to HP1 for single builds and HP2 for duo builds.
secondary_power_input_id: "${secondary_hp_id}_power_input"
secondary_heat_power_id: "${secondary_hp_id}_heat_power"
secondary_cooling_power_id: "${secondary_hp_id}_cooling_power"
secondary_compressor_level_id: "${secondary_hp_id}_compressor_level"
secondary_defrost_id: "${secondary_hp_id}_defrost"
secondary_last_applied_level_id: "${secondary_hp_id}_last_applied_level"
secondary_last_start_ms_id: "${secondary_hp_id}_last_start_ms"
secondary_last_stop_ms_id: "${secondary_hp_id}_last_stop_ms"
secondary_minutes_id: "${secondary_hp_id}_minutes"
secondary_set_working_mode_id: "${secondary_hp_id}_set_working_mode"
secondary_working_mode_id: "${secondary_hp_id}_working_mode"
secondary_4_way_valve_id: "${secondary_hp_id}_4_way_valve"
secondary_excluded_level_a_id: "${secondary_hp_id}_excluded_level_a"
secondary_excluded_level_b_id: "${secondary_hp_id}_excluded_level_b"
secondary_oil_return_id: "${secondary_hp_id}_prot_oil_return"
secondary_flow_id: "${secondary_hp_id}_flow"
secondary_pump_speed_id: "${secondary_hp_id}_pump_speed"
secondary_low_noise_mode_id: "${secondary_hp_id}_low_noise_mode"
secondary_set_pump_mode_id: "${secondary_hp_id}_set_pump_mode"
secondary_outside_temp_id: "${secondary_hp_id}_outside_temp"
secondary_outside_last_change_ms_id: "${secondary_hp_id}_outside_temp_last_change_ms"
secondary_outside_activity_ms_id: "${secondary_hp_id}_outside_temp_activity_ms"
secondary_water_out_temp_id: "${secondary_hp_id}_water_out_temp"
secondary_water_out_last_update_ms_id: "${secondary_hp_id}_water_out_temp_last_update_ms"
secondary_fault_binary_sensor_id: "${secondary_hp_id}_ot_fault_active"

# ----------------------------
# SUPERVISORY CONTROL MODE
# ----------------------------
oq_supervisory_loop_s: "5"                            # Main interval of the supervisory state machine [s].
oq_power_peak_trip_s: "15"                            # Time above peak required for a fast cap step [s].
oq_power_soft_trip_s: "300"                           # Time above soft required for a mild cap step [s].
oq_power_recover_s: "60"                              # Time below recover required for cap recovery [s].
oq_power_cap_max_f: "20"                              # Upper limit of demand-cap factor f.
oq_power_cap_nan_f: "16"                              # Fail-safe cap factor for invalid power measurement.
oq_duo_current_limit_v1_a: "16.0"                     # Duo current limit for V1/V1.5 hardware [A].
oq_duo_current_limit_v2_a: "20.0"                     # Duo current limit for V2 hardware [A].
oq_mains_voltage_v: "230.0"                           # Nominal mains voltage used to convert current limits to power thresholds [V].
oq_cm_prepost_s: "30"                                 # Duration of CM1 pre/postflow window [s].
oq_cm_min_flow_lph: "250.0"                           # Minimum valid flow for compressor operation [L/h].
oq_cm_flow_fault_s: "60"                              # Low-flow duration before fault becomes active [s].
oq_cm_flow_recover_s: "30"                            # Flow recovery duration before fault is cleared [s].
oq_cm2_idle_exit_s: "90"                              # Exit CM2 if both HPs are idle for this duration while demand remains > 0 [s].
oq_low_load_fallback_off_w: "900"                     # Internal fallback OFF threshold when no dynamic low-load input is available [W].
oq_low_load_fallback_on_w: "1300"                     # Internal fallback ON threshold when no dynamic low-load input is available [W].
oq_low_load_dyn_cache_max_s: "60"                     # Maximum age for reusing last-known-good dynamic low-load thresholds [s].
oq_ph_start_confirm_s: "30"                           # Power House start confirmation: demand must stay active for this time before CM1/CM2 startup [s].
oq_cm_frost_on_c: "5.0"                               # Frost protection enable threshold [°C].
oq_cm_frost_off_c: "6.0"                              # Frost protection disable threshold (hysteresis) [°C].
oq_cm_frost_nan_grace_s: "30"                         # Startup grace before NaN outside temp triggers frost fail-safe [s].
oq_cm_override_max_s: "1800"                          # Maximum duration of each forced control-mode override [s].
oq_cm3_promote_s: "300"                               # Required deficit duration for CM2 -> CM3 promotion [s].
oq_cm3_demote_s: "120"                                # Required low-deficit duration for CM3 -> CM2 demotion [s].
oq_cm3_min_run_s: "300"                               # Minimum dwell time in CM3 before demotion [s].
oq_cm2_min_run_s: "120"                               # Minimum dwell time in CM2 before promotion [s].
oq_cm3_curve_on_delta_c: "3.0"                        # Heating Curve target-minus-supply margin for CM2 -> CM3 [°C].
oq_cm3_curve_off_delta_c: "1.0"                       # Heating Curve target-minus-supply margin for CM3 -> CM2 [°C].
oq_cm0_sticky_wait_s: "86400"                         # Wait time in CM0 before sticky-pump run starts [s].
oq_cm0_sticky_run_s: "60"                             # Duration of sticky-pump run in CM0 [s].
oq_cm0_pump_stop_ipwm: "1000.0"                       # iPWM setpoint that forces pump off in CM0.
oq_sticky_pwm: "800"                                  # Fixed iPWM fallback used during CM0 sticky circulation.

# ----------------------------
# HEATING STRATEGY
# ----------------------------
oq_strategy_loop_s: "5"                               # Interval for strategy calculations and mode switching [s].
oq_diagnostic_update_interval_s: "30"                # Shared cadence for slower operator-facing diagnostics [s].
oq_strategy_demand_max_f: "20.0"                      # Upper bound of demand scale for mapping PID/power -> f.
oq_selected_input_stale_hold_s: "300"                 # Hold selected HA-backed inputs this long when they briefly disappear during reloads [s].
oq_water_supply_temp_local_cic_hold_s: "15"            # Hold Local/CIC supply temperature through brief sensor dropouts [s].
oq_hp_water_temp_stale_s: "60"                        # Maximum age for a heat-pump water temperature used as supply fallback [s].
oq_temp_guard_delta_c: "0.5"                          # Minimum valid margin between T0 and Tc in the house model [°C].
oq_outside_temp_stale_s: "1200"                       # Ignore a local outdoor reading when it stays frozen while the same HP still shows fresh activity [s].

# ----------------------------
# HEAT CONTROL
# ----------------------------
oq_heat_loop_tick_s: "5"                              # Scheduler tick for heat-control loop [s].
oq_heat_loop_curve_s: "30"                            # Effective heat-control cadence in Heating Curve mode [s].
oq_heat_loop_powerhouse_s: "60"                       # Effective heat-control cadence in Power House mode [s].
oq_cooling_limiter_stop_confirm_s: "30"               # Confirm time before soft-stop and dew hard-stop take effect [s].
oq_cooling_oil_return_hold_s: "1200"                  # Maximum oil-return recovery window; floor-guard modes clear earlier after recovery [s].
oq_cop_min_input_w: "10.0"                            # Minimum electrical input for a valid COP calculation [W].
oq_hp_min_off_s: "240"                                # Minimum per-HP off-time before any restart [s].
oq_optimizer_penalty_per_w: "5.0"                     # Cost factor above soft limit [cost/W].
oq_optimizer_topology_power_margin_w: "150.0"         # Required power delta before a single<->duo topology switch counts as a meaningful efficiency gain [W].
oq_optimizer_topology_heat_advantage_w: "450.0"       # Required heat-match advantage before a less-efficient topology may override the efficiency-first choice [W].
oq_defrost_power_factor: "0.764"                      # Thermal derate on a defrosting HP in duo dispatch.
oq_defrost_comp_min_f: "6"                            # Minimum demand f before single-defrost compensation is applied.
oq_defrost_comp_boost_steps: "1"                      # Extra level steps on non-defrost HP during single-defrost compensation.

# ----------------------------
# FLOW CONTROL
# ----------------------------
oq_flow_loop_s: "10"                                  # Control interval of the flow-control loop [s].
oq_flow_loop_startup_delay_ms: "6000"                 # Phase PI after both staged HP telemetry reads [ms].
oq_air_purge_loop_s: "5"                              # Independent Air Purge phase cadence; preserves 25s/15s pulse timing [s].
oq_flow_service_output_loop_s: "5"                    # Fast actuator cadence for fixed-output service tasks [s].
oq_flow_service_output_startup_delay_ms: "5700"       # Apply service targets shortly after their state-machine ticks [ms].
oq_flow_mismatch_threshold_lph: "150.0"               # Allowed HP1-vs-HP2 flow difference before mismatch logic starts [L/h].
oq_flow_mismatch_hyst_lph: "50.0"                     # Hysteresis on mismatch detection to prevent chatter [L/h].
oq_flow_kp_default: "0.03"                            # Default Flow PI Kp; single builds override this for one-pump hydraulics.
oq_flow_ki_default: "0.0008"                          # Default Flow PI Ki; single builds override this for one-pump hydraulics.
oq_flow_kp_min: "0.00"                                # Lower bound for Flow PI Kp.
oq_flow_kp_max: "0.20"                                # Upper bound for Flow PI Kp (broader for cross-install tuning).
oq_flow_ki_min: "0.0000"                              # Lower bound for Flow PI Ki.
oq_flow_ki_max: "0.0100"                              # Upper bound for Flow PI Ki (broader for cross-install tuning).

# ----------------------------
# FLOW AUTOTUNE
# ----------------------------
oq_flow_ts: "10"                                      # Autotune/main-loop sample time; must match flow-control [s].
oq_flow_autotune_startup_delay_ms: "5500"             # Phase autotune after HP telemetry and shortly before PI [ms].
oq_flow_pwm_min: "50"                                 # Lower pump iPWM bound during autotune.
oq_flow_pwm_max: "850"                                # Upper pump iPWM bound during autotune.
oq_flow_autotune_min_step: "5"                        # Minimum iPWM step size for the step test.
oq_flow_autotune_ss_window: "3"                       # Rolling-window size for steady-state estimation [samples].
oq_flow_autotune_settle_s: "30"                       # Minimum settle time on baseline PWM before applying the step [s].
oq_flow_autotune_stable_band_lph: "12.0"              # Max flow spread in baseline window to qualify as stable [L/h].
oq_flow_autotune_tau_fallback_s: "30.0"               # Fallback time constant when t63 is invalid [s].
oq_flow_autotune_lambda_min_s: "10.0"                 # Minimum IMC lambda for conservative PI tuning [s].

# ----------------------------
# THERMAL CONSTANTS
# ----------------------------
oq_water_cp_j_per_kgk: "4186.0"                       # Specific heat capacity of water [J/(kg*K)].

# ----------------------------
# BOILER CONTROL
# ----------------------------
oq_boiler_loop_s: "5"                                 # Main interval for boiler gating/safety loop [s].
oq_boiler_command_max_age_s: "75"                     # Fail-safe command age; covers the 60s Power House cadence plus scheduler margin [s].
oq_boiler_transport_settle_s: "2"                     # Break-before-make hold after changing R1/OpenTherm transport [s].
oq_boiler_relay_min_on_s: "0"                         # R1 minimum on-time [s]; zero preserves existing relay behavior in foundation phase.
oq_boiler_relay_min_off_s: "0"                        # R1 minimum off-time [s]; zero preserves existing relay behavior in foundation phase.
oq_boiler_otb_min_on_s: "30"                          # OpenTherm minimum requested on-time [s]; safety trips override it.
oq_boiler_otb_min_off_s: "120"                        # OpenTherm minimum requested off-time [s].
oq_otb_supported: "false"                             # Compile-time availability of the boiler OpenTherm master transport.
oq_otb_command_apply_s: "1"                           # Apply validated CH/TSet state to the OpenTherm master [s].
oq_otb_startup_probe_timeout_s: "8"                   # R1 boot verification window for detecting a physically connected OpenTherm boiler [s].
oq_boiler_transport_selection_extra: ""               # Hardware-specific start/stop hook after changing the boiler transport.

# ----------------------------
# OPEN THERM SLAVE
# ----------------------------
oq_ot_enabled_default: "false"                        # Default runtime state of the OT slave bus handler.
oq_ot_response_enabled_default: "true"                # Allow the OT slave to answer thermostat requests by default.

# ----------------------------
# OPEN THERM BOILER MASTER
# ----------------------------
oq_otb_link_watch_s: "1"                              # OTB link/freshness evaluation interval [s].
oq_otb_link_timeout_s: "10"                           # Maximum age of the last valid boiler response [s].
oq_otb_field_timeout_s: "10"                          # Maximum age of one repeating boiler telemetry field [s].

# ----------------------------
# CIC FEED
# ----------------------------
cic_backoff_start_ms: "5000"                          # Initial polling backoff after success/startup [ms].
cic_backoff_max_ms: "120000"                          # Maximum exponential backoff on errors [ms].
cic_poll_tick_ms: "5000"                              # Scheduler tick for CIC main loop [ms].
cic_min_url_len: "10"                                 # Minimum URL length before starting a request [chars].
cic_stale_after_ms: "600000"                          # Data becomes stale after this time without a successful fetch [ms].
cic_feed_error_trip_n: "3"                            # Feed OK becomes false after N consecutive fetch/parse errors.
oq_cic_restore_mode_default: "RESTORE_DEFAULT_OFF"    # Default CIC polling state.

# ----------------------------
# HA INPUT ENTITY MAPPING
# ----------------------------
ha_outside_temp_entity_id: "sensor.openquatt_ext_outdoor_temperature"      # HA proxy entity for outside temperature [degC].
ha_outside_temp_valid_entity_id: "binary_sensor.openquatt_ext_outdoor_temperature_valid" # HA validity flag for outside temperature.
ha_water_supply_temp_entity_id: "sensor.openquatt_ext_water_supply_temperature" # HA proxy entity for water supply temperature [degC].
ha_water_supply_temp_valid_entity_id: "binary_sensor.openquatt_ext_water_supply_temperature_valid" # HA validity flag for water supply temperature.
ha_room_setpoint_entity_id: "sensor.openquatt_ext_room_setpoint"           # HA proxy entity for thermostat room setpoint [degC].
ha_room_setpoint_valid_entity_id: "binary_sensor.openquatt_ext_room_setpoint_valid" # HA validity flag for thermostat room setpoint.
ha_room_temp_entity_id: "sensor.openquatt_ext_room_temperature"             # HA proxy entity for thermostat room temperature [degC].
ha_room_temp_valid_entity_id: "binary_sensor.openquatt_ext_room_temperature_valid" # HA validity flag for thermostat room temperature.
ha_cooling_enable_entity_id: "binary_sensor.openquatt_ext_cooling_enable"   # HA proxy entity for external cooling enable.
ha_cooling_enable_valid_entity_id: "binary_sensor.openquatt_ext_cooling_enable_valid" # HA validity flag for external cooling enable.
ha_heating_enable_entity_id: "binary_sensor.openquatt_ext_heating_enable"   # HA proxy entity for external heating enable.
ha_heating_enable_valid_entity_id: "binary_sensor.openquatt_ext_heating_enable_valid" # HA validity flag for external heating enable.
ha_cooling_dew_point_entity_id: "sensor.openquatt_ext_cooling_dew_point" # HA aggregate cooling dew point [degC].
ha_cooling_dew_point_valid_entity_id: "binary_sensor.openquatt_ext_cooling_dew_point_valid" # HA validity flag for aggregate cooling dew point.
ha_external_heat_demand_entity_id: "sensor.openquatt_ext_heat_demand"       # HA proxy entity for external Power House heat demand [W].
ha_external_heat_demand_valid_entity_id: "binary_sensor.openquatt_ext_heat_demand_valid"  # HA validity flag for external heat demand.

# ----------------------------
# HP IO (MODBUS POLLING)
# ----------------------------
oq_modbus_update_interval_s: "5"                    # Base Modbus controller polling interval [s].
oq_modbus_offline_probe_interval_s: "30"             # Sparse single-register probe while an HP is offline [s].
oq_modbus_command_throttle_ms: "500"                 # Minimum spacing between Modbus commands [ms].
oq_modbus_max_cmd_retries: "1"                       # Retries per Modbus command; keep low to avoid long blocking on bad links.
oq_modbus_startup_delay_ms: "0"                      # Default startup offset for staged Modbus polling [ms].
oq_modbus_telemetry_skip: "1"                        # 2099-2138: 1 skipped base update, effective polling every 10s.
oq_modbus_target_readback_skip: "1"                  # 3999 safety-relevant target readback every 10s.
oq_modbus_control_readback_skip: "5"                 # 1999/2006/2010/2015 readback every 30s.
