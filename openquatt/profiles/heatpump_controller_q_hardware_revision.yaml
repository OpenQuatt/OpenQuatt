# ==============================================================================
# OpenQuatt - Heatpump Controller Q-edition hardware revision
# ==============================================================================
#
# Reads the Q-controller hardware revision from the first 14 USER_DATA eFuse
# bits and publishes it once for logging and debug recordings.
# ==============================================================================

esphome:
  includes:
    - ${openquatt_root}/profiles/heatpump_controller_q_hardware_revision.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // Read-only access; a zero value means the hardware field was not programmed.
          const auto revision = oq_hardware::read_hardware_revision_efuse();
          if (revision.error != ESP_OK) {
            ESP_LOGE("quatt.hardware", "Failed to read hardware revision eFuse: %s",
                     esp_err_to_name(revision.error));
            id(oq_hardware_revision_text).publish_state("Read error");
            return;
          }

          if (!revision.programmed) {
            ESP_LOGW("quatt.hardware", "Hardware revision eFuse is not programmed");
            id(oq_hardware_revision_text).publish_state("Not programmed");
            return;
          }

          // Publish the same decoded value used in the boot log and debug recording.
          char revision_text[32];
          snprintf(revision_text, sizeof(revision_text), "%u.%u (batch %u)",
                   static_cast<unsigned>(revision.major),
                   static_cast<unsigned>(revision.minor),
                   static_cast<unsigned>(revision.batch));
          id(oq_hardware_revision_text).publish_state(revision_text);
          ESP_LOGI("quatt.hardware", "Hardware revision: %u.%u, batch %u (raw=0x%04X)",
                   static_cast<unsigned>(revision.major),
                   static_cast<unsigned>(revision.minor),
                   static_cast<unsigned>(revision.batch),
                   static_cast<unsigned>(revision.raw));

text_sensor:
  - platform: template
    id: oq_hardware_revision_text
    name: "OpenQuatt Hardware Revision"
    internal: true
    update_interval: never
