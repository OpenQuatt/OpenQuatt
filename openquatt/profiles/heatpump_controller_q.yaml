# ==============================================================================
# OpenQuatt - Hardware Profile: Electropaultje Heatpump Controller Q-edition
# ==============================================================================
substitutions:
  oq_hardware_profile: "heatpump_controller_q"         # Compile-time hardware profile id.
  oq_hardware_build_flag: "-DOQ_HARDWARE_HEATPUMP_CONTROLLER_Q=1" # Enable Q-only local sensor paths.
  oq_otb_supported: "true"                             # GPIO47/GPIO48 provide the boiler OpenTherm master transport.
  oq_boiler_transport_selection_extra: "oq_boiler_otb_runtime::connection_changed(x == \"OpenTherm\");" # Start or stop the selected Q-edition transport lifecycle.
  oq_boiler_transport_shutdown_extra: "oq_boiler_otb_runtime::withdraw_command();" # Withdraw OTB synchronously on every transport edge.
  oq_local_supply_temp_sensor_id: "water_supply_temp_pt1000" # Q-edition local PT1000 source.
  oq_local_supply_temp_selector_id: "oq_local_supply_temp_source" # Explicit local physical-sensor selection.
  oq_controller_flow_sensor_id: "flow_rate_controller" # Use the controller pulse meter for V1 flow.
  oq_q_flow_source_selector_id: "oq_q_flow_source"     # Explicit Q-edition flow source selector.
  esp_board: "esp32-s3-devkitc-1"                       # PlatformIO board shared with the Waveshare S3 build.
  esp_flash_size: "16MB"                                # Active ESP flash size.
  esp_variant: "esp32s3"                                # Active ESP variant.
  esp_partitions: "${openquatt_root}/partitions/openquatt_16mb.csv" # Active partition table.
  uart_tx_pin: "GPIO40"                                 # Modbus 1 TX; primary heat-pump bus.
  uart_rx_pin: "GPIO42"                                 # Modbus 1 RX; primary heat-pump bus.
  uart_rts_pin: "GPIO41"                                # Modbus 1 mode / DE/RE; primary heat-pump bus.
  oq_ot_thermostat_in_pin: "GPIO21"                     # OpenTherm slave input.
  oq_ot_thermostat_out_pin: "GPIO14"                    # OpenTherm slave output.
  oq_ot_boiler_in_pin: "GPIO47"                         # OpenTherm boiler master input.
  oq_ot_boiler_out_pin: "GPIO48"                        # OpenTherm boiler master output.
  ds18b20_pin: "GPIO18"                                 # Dallas DS18B20 1-Wire input.
  oq_boiler_relay_pin: "GPIO16"                         # Relay 1 output.
  controller_aux_relay_pin: "GPIO3"                     # Relay 2 output reserved for controller logic.
  web_auth_recovery_pin: "GPIO46"                       # Boot switch / recovery input.
  eth_mosi_pin: "GPIO10"                                # W5500 SPI MOSI.
  eth_miso_pin: "GPIO11"                                # W5500 SPI MISO.
  eth_clk_pin: "GPIO12"                                 # W5500 SPI CLK.
  eth_cs_pin: "GPIO13"                                  # W5500 SPI CS.
  eth_int_pin: "GPIO9"                                  # W5500 interrupt.
  hpcq_pt1000_mosi_pin: "GPIO7"                         # MAX31865 MOSI / SDI.
  hpcq_pt1000_miso_pin: "GPIO4"                         # MAX31865 MISO / SDO.
  hpcq_pt1000_clk_pin: "GPIO6"                          # MAX31865 SPI clock.
  hpcq_pt1000_cs_pin: "GPIO5"                           # MAX31865 chip select.
  hpcq_pt1000_reference_resistance_ohm: "1500"          # PT1000 MAX31865 reference resistor.
  hpcq_pt1000_nominal_resistance_ohm: "1000"            # PT1000 nominal resistance at 0 degrees C.
  hpcq_pt1000_rtd_wires: "2"                            # Probe wiring mode; board jumpers must match.
  hpcq_flow_pin: "GPIO15"                               # V1 central flowmeter pulse input.
  hpcq_flow_kf_lpm_per_hz: "0.05"                       # DN15 datasheet Kff: Qv[l/min] = Kf * f[Hz] + Q0.
  hpcq_flow_q0_lpm: "0"                                 # DN15 datasheet intercept [l/min].
  hpcq_status_led_yellow_pin: "GPIO1"                   # Yellow status LED output.
  hpcq_status_led_red_pin: "GPIO2"                      # Red status LED output.
  hpcq_status_led_inverted: "false"                     # Set true when the board LED is active-low.

packages:
  oq_hardware_revision: !include heatpump_controller_q_hardware_revision.yaml
  oq_status_leds: !include heatpump_controller_q_status_leds.yaml
  oq_cic_compatibility: !include heatpump_controller_q_cic_compatibility.yaml
  oq_aux_relay_control: !include ../oq_aux_relay_control.yaml
  oq_sensor_source_selects_opentherm: !include ../oq_sensor_source_selects_opentherm.yaml
  oq_ot_slave: !include
    file: ../oq_ot_slave.yaml
    vars:
      ot_secondary_present: "${ot_secondary_present}"
  oq_boiler_opentherm: !include ../oq_boiler_opentherm.yaml

openquatt_usage_telemetry:
  cic_compatibility_switch: cic_compatibility_enable
  ot_thermostat_switch: oq_ot_slave_enabled
  boiler_connection_select: oq_boiler_connection
  q_flow_source_select: oq_q_flow_source

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

select:
  - platform: template
    id: oq_local_supply_temp_source
    name: "Local Water Supply Temp Source"
    icon: mdi:thermometer-check
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - PT1000
      - DS18B20
    initial_option: PT1000
    on_value:
      - lambda: |-
          // PT1000 and DS18B20 are separate calibration identities.
          if (!id(oq_water_supply_temp_current_source_ready) ||
              !id(water_supply_source).has_state() ||
              id(water_supply_source).current_option() != "Local") {
            return;
          }
          const int32_t selected = x == "PT1000"
              ? oq_supply_calibration::SOURCE_LOCAL_PT1000
              : oq_supply_calibration::SOURCE_LOCAL_DS18B20;
          if (id(oq_water_supply_temp_current_source_code) == selected) return;

          id(oq_water_supply_temp_current_source_ready) = false;
          if (id(oq_hp_water_calibration_active)) id(oq_hp_water_calibration_abort) = true;
          // Refresh the local proxy first so the old physical source cannot be cached under the new identity.
          id(water_supply_temp_esp).update();
          id(water_supply_temp_selected).update();

  - platform: template
    id: oq_q_flow_source
    name: "Q Flow Source"
    icon: mdi:source-branch
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - Auto
      - Local
      - Outdoor unit
    initial_option: Auto

spi:
  - id: oq_hpcq_pt1000_spi
    mosi_pin: ${hpcq_pt1000_mosi_pin}
    miso_pin: ${hpcq_pt1000_miso_pin}
    clk_pin: ${hpcq_pt1000_clk_pin}
    interface: spi3

sensor:
  - platform: max31865
    id: water_supply_temp_pt1000
    name: "Water Supply Temp (PT1000)"
    icon: mdi:thermometer
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    # Poll explicitly below so a disconnected probe cannot flood logs.
    update_interval: never
    spi_id: oq_hpcq_pt1000_spi
    cs_pin: ${hpcq_pt1000_cs_pin}
    reference_resistance: ${hpcq_pt1000_reference_resistance_ohm}
    rtd_nominal_resistance: ${hpcq_pt1000_nominal_resistance_ohm}
    rtd_wires: ${hpcq_pt1000_rtd_wires}
    mains_filter: "50 Hz"
    filters:
      - lambda: |-
          if (isnan(x)) return x;
          if (x < -10.0f || x > 100.0f) return NAN;
          return x;

  - platform: pulse_meter
    id: flow_rate_controller
    name: "Controller Flow"
    icon: mdi:waves
    unit_of_measurement: "L/h"
    device_class: volume_flow_rate
    state_class: measurement
    accuracy_decimals: 1
    timeout: 5s
    internal_filter_mode: PULSE
    internal_filter: 100us
    pin:
      number: ${hpcq_flow_pin}
      mode:
        input: true
        pullup: true
    filters:
      - lambda: |-
          // pulse_meter publishes pulses/minute. Convert to Hz first:
          // Qv[l/min] = Kf * f[Hz] + Q0, then convert to l/h.
          const float hz = x / 60.0f;
          const float lpm =
            (static_cast<float>(${hpcq_flow_kf_lpm_per_hz}) * hz)
            + static_cast<float>(${hpcq_flow_q0_lpm});
          if (isnan(lpm)) return NAN;
          const float lph = lpm * 60.0f;
          return lph > 0.0f ? lph : 0.0f;
      - throttle_average: 10s

interval:
  - interval: 5s
    startup_delay: 1s
    then:
      - lambda: |-
          static bool read_attempted = false;
          static bool repeated_fault_logs_suppressed = false;
          static bool max31865_log_level_managed = false;
          // Keep the PT1000 live for diagnostics when DS18B20 is selected.
          const bool reading_valid =
              id(water_supply_temp_pt1000).has_state() &&
              !isnan(id(water_supply_temp_pt1000).state);
          // Log the first failed read, then keep retrying silently until recovery.
          if (read_attempted && !reading_valid &&
              !repeated_fault_logs_suppressed &&
              esphome::logger::global_logger != nullptr) {
            esphome::logger::global_logger->set_log_level(
                "max31865", ESPHOME_LOG_LEVEL_NONE);
            repeated_fault_logs_suppressed = true;
            max31865_log_level_managed = true;
          } else if (reading_valid && max31865_log_level_managed &&
                     esphome::logger::global_logger != nullptr) {
            esphome::logger::global_logger->set_log_level(
                "max31865", esphome::logger::global_logger->get_log_level());
            repeated_fault_logs_suppressed = false;
          }

          read_attempted = true;
          id(water_supply_temp_pt1000).update();
