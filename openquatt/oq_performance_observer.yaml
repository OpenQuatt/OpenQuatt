# ==============================================================================
# OpenQuatt - Observer voor eigen ODU-temperaturen en vaste Duo-serieschakeling
# ==============================================================================
# Observation only: never used by actuator, safety, demand or source selection.
# Explicitly enabled per boot. No NVS preference or telemetry upload is added.
switch:
  - platform: template
    id: oq_performance_observer_enabled
    name: "Performance Model Observer"
    entity_category: diagnostic
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: |-
          oq_performance_observer::runtime().request(true);
    turn_off_action:
      - lambda: |-
          oq_performance_observer::runtime().request(false);

text_sensor:
  - platform: template
    id: oq_performance_observer_report
    name: "Performance Model Observer Report"
    internal: true
    update_interval: 5s
    lambda: |-
      return oq_performance_observer::runtime().report();

  - platform: template
    name: "Performance Model Observer Status"
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      return oq_performance_observer::runtime().summary();

interval:
  - interval: 25ms
    then:
      - lambda: |-
          oq_performance_observer::runtime().tick((uint32_t) ${oq_hp_min_off_s} * 1000UL);
