# ==============================================================================
# OpenQuatt - Duo performance observer
# ==============================================================================
# Observation only; never used by actuator or demand selection.
switch:
  - platform: template
    id: oq_performance_observer_enabled
    name: "Performance Model Observer"
    entity_category: diagnostic
    optimistic: true
    restore_mode: ALWAYS_OFF

text_sensor:
  - platform: template
    id: oq_performance_observer_report
    name: "Performance Model Observer Report"
    internal: true
    update_interval: 10s
    lambda: |-
      return oq_performance_observer::report(id(oq_performance_observer_enabled).state);
