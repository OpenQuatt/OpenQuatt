text_sensor:
  - platform: template
    id: ${hp_id}_odu_runtime_frequency_table_status
    name: "${prefix}EXPERIMENTAL ODU runtime frequency status"
    internal: true
    update_interval: never
    on_value:
      then:
        - if:
            condition:
              lambda: |-
                return x == "WRITE_QUEUED: runtime table write requested";
            then:
              - lambda: |-
                  // A write makes the control snapshot stale until verified.
                  id(${hp_id}_compressor_level_profile_request_token) =
                      oq_odu::next_request_token(
                          id(${hp_id}_compressor_level_profile_request_token));
                  id(${hp_id}_compressor_level_profile_request_pending) = false;
                  id(${hp_id}_runtime_frequency_reload_blocked_after_write) = true;
                  id(${hp_id}_runtime_frequency_write_verification_pending) = true;
                  id(${hp_id}_runtime_frequency_snapshot_storage) =
                      oq_odu::RuntimeFrequencySnapshotStorage{};
                  id(${hp_id}_compressor_level_profile).publish_state(
                      oq_odu::compressor_level_profile_label(
                          oq_odu::CompressorLevelProfile::UNKNOWN));
              - script.execute: ${hp_id}_runtime_frequency_write_timeout
        - if:
            condition:
              lambda: |-
                return x.rfind("VERIFY_FAILED:", 0) == 0;
            then:
              - script.stop: ${hp_id}_runtime_frequency_write_timeout
              - lambda: |-
                  // Keep control reloads blocked, but allow an explicit retry.
                  id(${hp_id}_runtime_frequency_write_verification_pending) = false;
        - if:
            condition:
              lambda: |-
                return x == "APPLIED: runtime table written and read back";
            then:
              - script.stop: ${hp_id}_runtime_frequency_write_timeout
              - lambda: |-
                  id(${hp_id}_runtime_frequency_reload_blocked_after_write) = false;
                  id(${hp_id}_runtime_frequency_write_verification_pending) = false;
              - script.execute: ${hp_id}_load_runtime_frequency_table_once

script:
  - id: ${hp_id}_runtime_frequency_write_timeout
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return id(${hp_id}_odu_generation_detection_complete) &&
                     static_cast<oq_odu::Variant>(
                         id(${hp_id}_generation_variant_code)) ==
                         oq_odu::Variant::V2_NEW_MODEL;
          then:
            - delay: 60s
          else:
            - delay: 30s
      - if:
          condition:
            lambda: |-
              return id(${hp_id}_runtime_frequency_write_verification_pending);
          then:
            - lambda: |-
                // Invalidate late callbacks before allowing an explicit retry.
                ++id(${hp_id}_runtime_frequency_write_operation_token);
                id(${hp_id}_odu_runtime_frequency_table_status)
                    ->publish_state("VERIFY_FAILED: write acknowledgement timeout");
