# ==============================================================================
# OpenQuatt - Factory Reset
# ==============================================================================
# Shared factory-reset behaviour for all runtime profiles.

factory_reset:
  resets_required: 3
  max_delay: 10s
  on_increment:
    - logger.log:
        format: "Fast power cycle count now %u, target %u"
        args: [x, target]

button:
  - platform: factory_reset
    id: factory_reset_button
    name: "Factory reset"
    entity_category: config
