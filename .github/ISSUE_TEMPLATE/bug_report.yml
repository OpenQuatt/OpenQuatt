name: Bug/probleem
description: Meld iets dat niet werkt zoals verwacht
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gebruik dit formulier voor bugs of problemen in OpenQuatt.

        Deel geen secrets, tokens, wifi-wachtwoorden of andere lokale gevoelige data.

  - type: textarea
    id: problem
    attributes:
      label: Probleem
      description: Wat gaat er mis? Beschrijf wat je probeerde te doen en wat er gebeurde.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Verwacht gedrag
      description: Wat had je verwacht dat er zou gebeuren?
    validations:
      required: false

  - type: textarea
    id: reproduce
    attributes:
      label: Stappen om te reproduceren
      description: Beschrijf de kleinste set stappen waarmee het probleem zichtbaar wordt.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false

  - type: dropdown
    id: hardware
    attributes:
      label: Hardware
      options:
        - Heatpump Controller Q
        - Anders/onbekend
    validations:
      required: true

  - type: dropdown
    id: topology
    attributes:
      label: Topology
      options:
        - Single
        - Duo
        - Niet van toepassing/onbekend
    validations:
      required: false

  - type: dropdown
    id: connection
    attributes:
      label: Verbinding
      options:
        - WiFi
        - Ethernet
        - Niet van toepassing/onbekend
    validations:
      required: false

  - type: input
    id: firmware
    attributes:
      label: Firmware/build
      description: Versie, release, commit hash, of "onbekend".
      placeholder: "v0.0.0 / commit / onbekend"
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: Relevante YAML/configuratie
      description: Plak alleen wat nodig is om het probleem te begrijpen. Verwijder secrets en lokale gevoelige data.
      render: yaml
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs of foutmelding
      description: Plak alleen relevante regels of sleep een logbestand in dit veld.
      render: text
    validations:
      required: false

  - type: textarea
    id: system_recording
    attributes:
      label: Diagnosebestand uit de Systeemrecorder
      description: |
        Voeg bij problemen met de regeling, sensoren, flow, ketel, Modbus of het dashboard bij voorkeur een diagnosebestand uit de Systeemrecorder toe.
        De Systeemrecorder bewaart continu recente systeemgegevens lokaal op het apparaat; je hoeft niet vooraf een opname te starten.

        Zo voeg je het bestand toe:
        1. Open de OpenQuatt web-app.
        2. Ga naar Instellingen > Systeem > Diagnostiek > Systeemrecorder en klik Openen. Je kunt ook Systeemrecorder kiezen via de drie puntjes rechtsboven.
        3. Kies onder Exporteren de laatste 15, 30 of 60 minuten, of Alles. Kies een periode waarin het probleem optrad.
        4. Klik Download bestand. Doe dit bij voorkeur voordat je OpenQuatt herstart of een nieuwe opname start: daarmee wordt de bestaande historie gewist.
        5. Voeg het gedownloade `*.oqdebug.json`-bestand toe door het in dit veld te slepen. Vermeld ook het tijdstip waarop het probleem optrad.

        Staat Doorlopende opname uit? Schakel deze in en laat het probleem opnieuw optreden voordat je het bestand downloadt.
        Is de Systeemrecorder niet beschikbaar, vermeld dat dan hieronder.

        Er wordt niets automatisch verzonden. Deel het bestand alleen als je akkoord bent met het delen van diagnostische statusdata uit je installatie. Controleer bij twijfel op lokale gevoelige data.
      placeholder: Sleep het gedownloade *.oqdebug.json-bestand hierheen en vermeld het tijdstip van het probleem, of beschrijf waarom geen diagnosebestand beschikbaar is.
    validations:
      required: false

  - type: textarea
    id: extra_context
    attributes:
      label: Extra context
      description: Screenshots, dashboardgedrag, timing, installatiesituatie, of wat je al geprobeerd hebt.
    validations:
      required: false
