name: PR512 final cleanup

on:
  pull_request:
    branches: [dev]

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/issue-461-ipwm-diagnostics
      - name: Remove simplification leftovers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('openquatt/oq_HP_io.yaml')
          text = p.read_text()
          text = text.replace('''    skip_updates: ${oq_modbus_telemetry_skip}\n    on_value:\n      then:\n        - lambda: |-\n            if (isnan(x)) return;\n\n  - platform: template\n    id: ${hp_id}_pump_power\n''', '''    skip_updates: ${oq_modbus_telemetry_skip}\n\n  - platform: template\n    id: ${hp_id}_pump_power\n''', 1)
          text = text.replace('''    internal: true\n    on_value:\n      then:\n        - lambda: |-\n            if (isnan(x)) return;\n            const uint16_t status = static_cast<uint16_t>(lroundf(x));\n\n  - platform: modbus_controller\n    modbus_controller_id: ${hp_id}\n    id: ${hp_id}_status_2120_raw\n''', '''    internal: true\n\n  - platform: modbus_controller\n    modbus_controller_id: ${hp_id}\n    id: ${hp_id}_status_2120_raw\n''', 1)
          old = '''      float pump_power_w = 0.0f;\n      const float pump_feedback_raw = id(${hp_id}_pump_ipwm_feedback_raw).state;\n      const float pump_relay_raw = id(${hp_id}_status_2108_raw).state;\n      if (id(${hp_id}_is_online) && !isnan(pump_feedback_raw)) {\n        const auto pump_feedback = oq_pump_ipwm::decode(\n            static_cast<uint16_t>(lroundf(pump_feedback_raw)));\n        const bool pump_relay_valid = !isnan(pump_relay_raw);\n        const bool pump_relay_on = pump_relay_valid &&\n            (static_cast<uint16_t>(lroundf(pump_relay_raw)) & 0x0800u) != 0u;\n        pump_power_w = oq_pump_ipwm::power_contribution_w(\n            pump_feedback, pump_relay_valid, pump_relay_on);\n      }\n'''
          new = '''      float pump_power_w = 0.0f;\n      if (id(${hp_id}_pump_relay).has_state() && id(${hp_id}_pump_relay).state) {\n        pump_power_w = nz(id(${hp_id}_pump_power).state);\n      }\n'''
          if old not in text:
              raise SystemExit('expected Power Input pump block not found')
          p.write_text(text.replace(old, new, 1))

          p = Path('tests/host/oq_pump_ipwm_feedback_test.cpp')
          text = p.read_text()
          text = text.replace('''  assert(power_contribution_w(running, true, true) == 50.0F);\n  assert(power_contribution_w(running, true, false) == 0.0F);\n  assert(power_contribution_w(running, false, true) == 0.0F);\n\n''', '')
          text = text.replace('''  assert(power_contribution_w(diagnostic, true, true) == 0.0F);\n''', '')
          p.write_text(text)

          p = Path('scripts/tests/test_pump_ipwm_contract.py')
          text = p.read_text()
          text = text.replace('        self.assertIn("oq_pump_ipwm::power_contribution_w", power_input)\n', '        self.assertIn("id(${hp_id}_pump_power).state", power_input)\n')
          text = text.replace('        self.assertNotIn("id(${hp_id}_pump_power).state", power_input)\n', '')
          p.write_text(text)
          PY

          version="$(tr -d '[:space:]' < .clang-format-version)"
          python3 -m pip install --disable-pip-version-check "clang-format==${version}"
          clang-format -i tests/host/oq_pump_ipwm_feedback_test.cpp
          git diff --check
          python3 scripts/tests/test_pump_ipwm_contract.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openquatt/oq_HP_io.yaml tests/host/oq_pump_ipwm_feedback_test.cpp scripts/tests/test_pump_ipwm_contract.py
          git commit -m "Remove pump diagnostic leftovers" || exit 0
          git push origin HEAD:codex/issue-461-ipwm-diagnostics
