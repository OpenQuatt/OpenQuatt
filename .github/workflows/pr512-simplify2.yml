name: PR512 focused simplify

on:
  push:
    branches: [codex/issue-461-ipwm-diagnostics]

permissions:
  contents: write

jobs:
  simplify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/issue-461-ipwm-diagnostics
      - name: Apply focused simplification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def rw(path, fn):
              p = Path(path)
              old = p.read_text()
              new = fn(old)
              p.write_text(new)
              print(path, len(old), '->', len(new))

          def simple(text):
              text = text.replace('            id(${hp_id}_water_flow_switch).invalidate_state();\n', '')
              text = text.replace('            id(${hp_id}_pump_request_raw).publish_state(NAN);\n', '')
              text = re.sub(r'\n  - platform: modbus_controller\n    modbus_controller_id: \$\{hp_id\}\n    id: \$\{hp_id\}_pump_request_raw\n.*?(?=\n  - platform: modbus_controller\n    modbus_controller_id: \$\{hp_id\}\n    id: \$\{hp_id\}_working_mode)', '', text, count=1, flags=re.S)
              text = re.sub(r'\n            id\(oq_incident_manager\)\.observe_pump_register\(\n                \$\{hp_index\}, (?:2108|2115|2137)U,.*?\);', '', text, flags=re.S)
              text = text.replace('            // R2138 closes the pump telemetry snapshot. Pump-register context\n            // may be reused for up to 20 s because this is diagnostic information.\n            id(oq_incident_manager).observe_pump_context(\n                ${hp_index}, !isnan(x), x, now_ms);\n', '')
              text = text.replace('            const uint32_t now_ms = millis();\n            id(${hp_id}_outside_temp_activity_ms) = now_ms;\n', '            id(${hp_id}_outside_temp_activity_ms) = millis();\n')
              text = text.replace('            id(${hp_id}_water_flow_switch).publish_state((status & 0x2000u) != 0u);\n', '')
              text = re.sub(r'\n  - platform: template\n    id: \$\{hp_id\}_water_flow_switch\n    name: "\$\{prefix\}Water flow switch"\n    icon: mdi:water-check\n    device_class: running\n    entity_category: diagnostic\n    disabled_by_default: true\n', '', text, count=1)
              old = '''        - lambda: |-\n            id(oq_incident_manager).observe_fault_word(\n                ${hp_index}, 2121U,\n                static_cast<uint16_t>(lroundf(x)), millis());\n'''
              new = '''        - lambda: |-\n            if (isnan(x)) return;\n            const uint32_t now_ms = millis();\n            const uint16_t fault_word = static_cast<uint16_t>(lroundf(x));\n            if ((fault_word & 0x2000u) != 0u) {\n              auto* pump_mode = id(${hp_id}_set_pump_mode);\n              const bool request_valid = pump_mode != nullptr && pump_mode->has_state();\n              const bool request_on = request_valid && pump_mode->current_option() == "On";\n              const float relay_raw = id(${hp_id}_status_2108_raw).state;\n              const bool relay_valid = !isnan(relay_raw);\n              const bool relay_on = relay_valid &&\n                  (static_cast<uint16_t>(lroundf(relay_raw)) & 0x0800u) != 0u;\n              const float flow_switch_raw = id(${hp_id}_status_2115_raw).state;\n              const bool flow_switch_valid = !isnan(flow_switch_raw);\n              const bool flow_switch_on = flow_switch_valid &&\n                  (static_cast<uint16_t>(lroundf(flow_switch_raw)) & 0x2000u) != 0u;\n              const float feedback_raw = id(${hp_id}_pump_ipwm_feedback_raw).state;\n              const bool feedback_valid = !isnan(feedback_raw);\n              const float flow_lph = id(${hp_id}_flow).state;\n              id(oq_incident_manager).observe_pump_context(\n                  ${hp_index}, request_valid, request_on, relay_valid, relay_on,\n                  flow_switch_valid, flow_switch_on, feedback_valid,\n                  feedback_valid ? static_cast<uint16_t>(lroundf(feedback_raw)) : 0U,\n                  !isnan(flow_lph), flow_lph);\n            }\n            id(oq_incident_manager).observe_fault_word(\n                ${hp_index}, 2121U, fault_word, now_ms);\n'''
              text = text.replace(old, new)
              return text
          rw('openquatt/oq_HP_io.yaml', simple)

          def dec(text):
              text = text.replace('#include <cstddef>\n', '')
              text = re.sub(r'\ninline constexpr std::size_t kContextRawObservationCount.*?(?=\nconstexpr const char\* status_name)', '\n', text, count=1, flags=re.S)
              text = re.sub(r'\nconstexpr float power_contribution_w\(.*?\n\}\n', '\n', text, count=1, flags=re.S)
              return text
          rw('openquatt/includes/diagnostics/oq_pump_ipwm_feedback.h', dec)

          def hdr(text):
              text = text.replace('  void observe_pump_register(uint8_t hp_index, uint16_t register_address, uint16_t word, uint32_t now_ms);\n', '')
              text = text.replace('  void observe_pump_context(uint8_t hp_index, bool flow_valid, float flow_lph, uint32_t now_ms);\n',
                  '  void observe_pump_context(uint8_t hp_index, bool request_valid, bool request_on, bool relay_valid,\n'
                  '                            bool relay_on, bool flow_switch_valid, bool flow_switch_on, bool feedback_valid,\n'
                  '                            uint16_t feedback_raw, bool flow_valid, float flow_lph);\n')
              text = re.sub(r'\n    std::array<oq_pump_ipwm::ContextRawObservation, oq_pump_ipwm::kContextRawObservationCount> pump_raw_observations\{\};', '', text)
              text = text.replace('    uint32_t updated_at_ms{0U};\n', '')
              return text
          rw('components/openquatt_incident_manager/OpenQuattIncidentManager.h', hdr)

          def cpp(text):
              text = text.replace('    unit->pump_raw_observations = {};\n', '')
              text = re.sub(r'  const bool pump_fault_active = register_address == 2121U.*?\n  }\n', '', text, count=1, flags=re.S)
              text = text.replace('  const bool fault_snapshot_complete = unit->fault_pending[0U] && unit->fault_pending[1U] && unit->fault_pending[2U];\n  this->process_fault_snapshot_(*unit, hp_slot_(hp_index), now_ms, false);\n  if (pump_fault_active && !fault_snapshot_complete) {\n    this->publish_snapshot_(now_ms);\n  }\n', '  this->process_fault_snapshot_(*unit, hp_slot_(hp_index), now_ms, false);\n')
              text = re.sub(r'void OpenQuattIncidentManager::observe_pump_register\(.*?(?=void OpenQuattIncidentManager::process_fault_snapshot_)', '''void OpenQuattIncidentManager::observe_pump_context(\n    uint8_t hp_index, bool request_valid, bool request_on, bool relay_valid, bool relay_on, bool flow_switch_valid,\n    bool flow_switch_on, bool feedback_valid, uint16_t feedback_raw, bool flow_valid, float flow_lph) {\n  UnitState* unit = this->unit_(hp_index);\n  if (unit == nullptr) return;\n\n  PumpContextState& context = unit->pump_context;\n  context = {};\n  context.request_valid = request_valid;\n  context.request_on = request_valid && request_on;\n  context.relay_valid = relay_valid;\n  context.relay_on = relay_valid && relay_on;\n  context.flow_switch_valid = flow_switch_valid;\n  context.flow_switch_on = flow_switch_valid && flow_switch_on;\n  context.feedback_valid = feedback_valid;\n  context.feedback_raw = feedback_valid ? feedback_raw : 0U;\n  if (feedback_valid) {\n    const oq_pump_ipwm::DecodedFeedback feedback = oq_pump_ipwm::decode(feedback_raw);\n    context.status = feedback.status;\n    context.power_valid = feedback.power_valid;\n    context.power_w = feedback.power_w;\n  }\n  context.flow_valid = flow_valid && std::isfinite(flow_lph);\n  context.flow_lph = context.flow_valid ? flow_lph : 0.0F;\n}\n\n''', text, count=1, flags=re.S)
              text = re.sub(r'\n         write_raw\(req, R"\(,\\"updated_at_ms\\":\)"\).*?updated_at_ms\).*?&&', '', text, count=1, flags=re.S)
              return text
          rw('components/openquatt_incident_manager/OpenQuattIncidentManager.cpp', cpp)

          def web(text):
              text = re.sub(r'  const incidentLastSeenMs = normalizeInteger\(incident\.lastSeenMs\);.*?\n  }\n\n  const rows', '  const rows', text, count=1, flags=re.S)
              text = text.replace('["Pompaanvraag · R2010.b12", onOff(pumpContext.requestOn)]', '["Pompaanvraag (OpenQuatt) · R2010.b12", onOff(pumpContext.requestOn)]')
              text = text.replace('    updatedAtMs: normalizeInteger(raw.updated_at_ms, 0),\n', '')
              return text
          rw('openquatt/web/js/src/core/incident-monitoring.js', web)

          for path in ['openquatt/web/js/mock-incident-scenarios.js', 'openquatt/web/tests/incident-monitoring.test.mjs']:
              rw(path, lambda t: re.sub(r'^\s*updated_at_ms:.*\n', '', t, flags=re.M))
          rw('openquatt/web/tests/incident-monitoring.test.mjs', lambda t: t.replace('Pompaanvraag · R2010.b12', 'Pompaanvraag (OpenQuatt) · R2010.b12'))

          # Remove obsolete cache-specific assertions/tests; CI will validate the final code.
          rw('tests/host/oq_pump_ipwm_feedback_test.cpp', lambda t: re.sub(r'\nvoid test_raw_observation_retains_recent_diagnostic_context_and_is_wrap_safe\(\).*?\n\}\n', '', t, count=1, flags=re.S).replace('  test_raw_observation_retains_recent_diagnostic_context_and_is_wrap_safe();\n', ''))
          rw('scripts/tests/test_pump_ipwm_contract.py', lambda t: t.replace('        self.assertIn("kDiagnosticContextFreshnessMs = 20000U", PUMP_IPWM_HEADER)\n        self.assertIn("read_if_fresh", PUMP_IPWM_HEADER)\n', '').replace('        self.assertIn("2010U", HP_IO)\n', '').replace('        self.assertIn("observe_pump_register", HP_IO)\n', '        self.assertNotIn("pump_request_raw", HP_IO)\n'))
          PY

          version="$(tr -d '[:space:]' < .clang-format-version)"
          python3 -m pip install --disable-pip-version-check "clang-format==${version}"
          clang-format -i components/openquatt_incident_manager/OpenQuattIncidentManager.cpp components/openquatt_incident_manager/OpenQuattIncidentManager.h openquatt/includes/diagnostics/oq_pump_ipwm_feedback.h tests/host/oq_pump_ipwm_feedback_test.cpp
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/openquatt_incident_manager/OpenQuattIncidentManager.cpp components/openquatt_incident_manager/OpenQuattIncidentManager.h openquatt/includes/diagnostics/oq_pump_ipwm_feedback.h openquatt/oq_HP_io.yaml openquatt/web/js/mock-incident-scenarios.js openquatt/web/js/src/core/incident-monitoring.js openquatt/web/tests/incident-monitoring.test.mjs scripts/tests/test_pump_ipwm_contract.py tests/host/oq_pump_ipwm_feedback_test.cpp
          git commit -m "Simplify pump fault diagnostics" || exit 0
          git push origin HEAD:codex/issue-461-ipwm-diagnostics
