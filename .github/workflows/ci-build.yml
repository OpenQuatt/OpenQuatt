name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cpp-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install clang-format
        run: |
          clang_format_version="$(tr -d '[:space:]' < .clang-format-version)"
          clang_format_venv="${RUNNER_TEMP}/clang-format"
          python3 -m venv "${clang_format_venv}"
          "${clang_format_venv}/bin/python" -m pip install --disable-pip-version-check "clang-format==${clang_format_version}"
          echo "${clang_format_venv}/bin" >> "${GITHUB_PATH}"

      - name: Check C/C++ formatting
        run: python3 scripts/cpp_format.py check

  docs-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check documentation contracts
        run: python3 scripts/check_docs_consistency.py && node scripts/check_web_docs_sync.mjs

  docs-impact:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Report documentation impact (advisory)
        run: |
          python3 scripts/check_docs_consistency.py --changed-only 2>&1 | tee /tmp/docs-impact.txt
          echo "### Docs impact (advisory)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/docs-impact.txt >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/docs-impact.txt

  python-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Python contract tests
        run: python3 -m unittest discover -s scripts/tests -p "test_*.py"

  validate-web-settings-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Run settings-backup consistency check
        run: node openquatt/web/check-settings-backup.mjs

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install web build dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and test web bundles
        run: pnpm run check:web

      - name: Run web smoke checks
        run: pnpm run smoke:web

  host-regression-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test HIL harness without hardware
        run: node --test tests/hil/*.test.mjs

      - name: Compile and run host regression tests
        run: ./scripts/run_host_regression_tests.sh

  validate-and-compile:
    needs: [cpp-format, docs-consistency, python-contracts, validate-web-settings-backup, host-regression-tests]
    uses: ./.github/workflows/esphome-build.yml
    with:
      artifact_suffix: firmware-${{ github.sha }}
      include_firmware_bin: true
