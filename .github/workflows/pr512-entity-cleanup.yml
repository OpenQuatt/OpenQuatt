name: PR512 entity cleanup

on:
  pull_request:
    branches: [dev]

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/issue-461-ipwm-diagnostics
      - name: Hide raw iPWM and remove status entity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          hp = Path('openquatt/oq_HP_io.yaml')
          text = hp.read_text()

          raw_old = '''    id: ${hp_id}_pump_ipwm_feedback_raw\n    name: "${prefix}Pump iPWM feedback raw"\n    icon: mdi:pump\n    disabled_by_default: true\n    entity_category: diagnostic\n'''
          raw_new = '''    id: ${hp_id}_pump_ipwm_feedback_raw\n    name: "${prefix}Pump iPWM feedback raw"\n    internal: true\n    icon: mdi:pump\n    disabled_by_default: true\n    entity_category: diagnostic\n'''
          if raw_old not in text:
              raise SystemExit('raw iPWM entity block not found')
          text = text.replace(raw_old, raw_new, 1)

          pattern = r'''\n  - platform: template\n    id: \$\{hp_id\}_pump_ipwm_status\n    name: "\$\{prefix\}Pump iPWM status"\n    icon: mdi:pump\n    entity_category: diagnostic\n    disabled_by_default: true\n    update_interval: 10s\n    lambda: \|-\n      if \(!id\(\$\{hp_id\}_is_online\)\) return std::string\("unknown"\);\n      const float raw = id\(\$\{hp_id\}_pump_ipwm_feedback_raw\)\.state;\n      if \(isnan\(raw\)\) return std::string\("unknown"\);\n      return std::string\(oq_pump_ipwm::status_name\(oq_pump_ipwm::decode\(\n          static_cast<uint16_t>\(lroundf\(raw\)\)\)\.status\)\);\n'''
          text, count = re.subn(pattern, '', text, count=1)
          if count != 1:
              raise SystemExit('Pump iPWM status entity block not found')
          hp.write_text(text)

          test = Path('scripts/tests/test_pump_ipwm_contract.py')
          t = test.read_text()
          old = '''        self.assertIn("address: 2137", raw)\n        self.assertIn("value_type: U_WORD", raw)\n        self.assertNotIn("multiply:", raw)\n'''
          new = '''        self.assertIn("address: 2137", raw)\n        self.assertIn("value_type: U_WORD", raw)\n        self.assertIn("internal: true", raw)\n        self.assertNotIn("multiply:", raw)\n        self.assertNotIn("pump_ipwm_status", HP_IO)\n'''
          if old not in t:
              raise SystemExit('pump contract raw assertions not found')
          test.write_text(t.replace(old, new, 1))
          PY

          python3 scripts/tests/test_pump_ipwm_contract.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openquatt/oq_HP_io.yaml scripts/tests/test_pump_ipwm_contract.py
          git commit -m "Keep iPWM diagnostics internal"
          git push origin HEAD:codex/issue-461-ipwm-diagnostics
