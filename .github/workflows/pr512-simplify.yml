import unittest


ROOT = Path(__file__).resolve().parents[2]
HP_IO = (ROOT / "openquatt" / "oq_HP_io.yaml").read_text()
CIC_SERVER = (ROOT / "openquatt" / "oq_cic_compatibility_server.yaml").read_text()
