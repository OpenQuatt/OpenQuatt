name: ESPHome Build Profiles

on:
  workflow_call:
    inputs:
      artifact_suffix:
        required: true
        type: string
      checkout_ref:
        required: false
        type: string
        default: ""
      checkout_repository:
        required: false
        type: string
        default: ""
      checkout_persist_credentials:
        required: false
        type: boolean
        default: true
      include_firmware_bin:
        required: false
        type: boolean
        default: false
      include_factory_bin:
        required: false
        type: boolean
        default: true
      project_version:
        required: false
        type: string
        default: ""
      release_channel:
        required: false
        type: string
        default: ""
      release_manifest_tag:
        required: false
        type: string
        default: ""

jobs:
  target-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.checkout_repository || github.repository }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: ${{ inputs.checkout_persist_credentials }}

      - name: Build target matrix
        id: targets
        run: |
          MATRIX="$(python3 scripts/build_targets.py github-matrix --status enabled)"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  compile-profiles:
    runs-on: ubuntu-latest
    needs: target-matrix
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.target-matrix.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.checkout_repository || github.repository }}
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: ${{ inputs.checkout_persist_credentials }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install web build dependencies
        run: npm ci

      - name: Build embedded web bundles
        run: npm run build:web

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-esphome.txt

      - name: Install ESPHome
        run: |
          ESPHOME_VERSION="$(cat .github/requirements-esphome.txt | sed 's/^esphome==//')"
          pip install --upgrade "esphome==${ESPHOME_VERSION}"
          esphome version

      - name: Resolve ESP-IDF version for cache key
        id: idf_version
        run: |
          IDF_VERSION="$(python -c 'from esphome.components.esp32 import ESP_IDF_FRAMEWORK_VERSION_LOOKUP as versions; print(versions["recommended"])')"
          echo "version=${IDF_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Cache native ESP-IDF toolchain
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/cache@v5
        with:
          path: ~/.cache/esphome/idf
          key: ${{ runner.os }}-${{ runner.arch }}-esphome-idf-${{ steps.idf_version.outputs.version }}

      - name: Restore native ESP-IDF toolchain
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/esphome/idf
          key: ${{ runner.os }}-${{ runner.arch }}-esphome-idf-${{ steps.idf_version.outputs.version }}

      - name: Make ccache available
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ccache
          fi
          ccache --version

      - name: Cache compiler outputs
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/cache@v5
        with:
          path: ~/.cache/openquatt/ccache/${{ matrix.target.id }}
          key: ${{ runner.os }}-${{ runner.arch }}-openquatt-ccache-${{ matrix.target.id }}-${{ steps.idf_version.outputs.version }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-openquatt-ccache-${{ matrix.target.id }}-${{ steps.idf_version.outputs.version }}-

      - name: Restore compiler outputs
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/openquatt/ccache/${{ matrix.target.id }}
          key: ${{ runner.os }}-${{ runner.arch }}-openquatt-ccache-${{ matrix.target.id }}-${{ steps.idf_version.outputs.version }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-openquatt-ccache-${{ matrix.target.id }}-${{ steps.idf_version.outputs.version }}-

      - name: Compile firmware
        run: |
          export ESPHOME_ESP_IDF_PREFIX="${HOME}/.cache/esphome/idf"
          export IDF_CCACHE_ENABLE=1
          export CCACHE_DIR="${HOME}/.cache/openquatt/ccache/${{ matrix.target.id }}"
          export CCACHE_MAXSIZE=2G
          export CCACHE_NOHASHDIR=true
          export CCACHE_DEPEND=1
          export CCACHE_BASEDIR="${GITHUB_WORKSPACE}/${{ matrix.target.build_path }}"
          SOURCE_REPOSITORY="${{ inputs.checkout_repository || github.repository }}"
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          EXTRA_ARGS=(
            -s build_source_repository "${SOURCE_REPOSITORY}"
            -s build_source_commit "${SOURCE_COMMIT}"
            -s build_target "${{ matrix.target.config }}"
          )
          if [[ -n "${{ inputs.project_version }}" ]]; then
            EXTRA_ARGS+=(-s project_version "${{ inputs.project_version }}")
          fi
          if [[ -n "${{ inputs.release_channel }}" ]]; then
            EXTRA_ARGS+=(-s release_channel "${{ inputs.release_channel }}")
          fi
          if [[ -n "${{ inputs.release_manifest_tag }}" ]]; then
            RELEASE_MANIFEST_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ inputs.release_manifest_tag }}/${{ matrix.target.manifest_name }}"
            EXTRA_ARGS+=(-s release_manifest_url "${RELEASE_MANIFEST_URL}")
          fi
          esphome "${EXTRA_ARGS[@]}" compile "${{ matrix.target.config }}"

      - name: Show ccache statistics
        if: ${{ always() }}
        run: |
          export CCACHE_DIR="${HOME}/.cache/openquatt/ccache/${{ matrix.target.id }}"
          export CCACHE_MAXSIZE=2G
          ccache --show-stats

      - name: Validate and normalize firmware artifacts
        run: python3 scripts/repair_factory_bin.py "${{ matrix.target.build_path }}/build" --normalize-app

      - name: Upload firmware artifacts
        if: ${{ inputs.include_firmware_bin }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target.artifact_name }}-${{ inputs.artifact_suffix }}
          if-no-files-found: error
          path: |
            ${{ matrix.target.build_path }}/build/firmware.bin
            ${{ matrix.target.build_path }}/build/firmware.ota.bin
            ${{ matrix.target.build_path }}/build/firmware.factory.bin

      - name: Upload OTA/factory artifacts
        if: ${{ !inputs.include_firmware_bin && inputs.include_factory_bin }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target.artifact_name }}-${{ inputs.artifact_suffix }}
          if-no-files-found: error
          path: |
            ${{ matrix.target.build_path }}/build/firmware.ota.bin
            ${{ matrix.target.build_path }}/build/firmware.factory.bin

      - name: Upload OTA artifacts
        if: ${{ !inputs.include_firmware_bin && !inputs.include_factory_bin }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target.artifact_name }}-${{ inputs.artifact_suffix }}
          if-no-files-found: error
          path: ${{ matrix.target.build_path }}/build/firmware.ota.bin
