name: PR512 final cleanup

on:
  push:
    branches:
      - codex/issue-461-ipwm-diagnostics

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-461-ipwm-diagnostics
          fetch-depth: 0
      - name: Remove cleanup artifact and workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('openquatt/oq_HP_io.yaml')
          s = p.read_text()
          old = '\n\n# Per-HP compressor level exclusions are modeled as up to two explicit blocked levels.'
          new = '\n# Per-HP compressor level exclusions are modeled as up to two explicit blocked levels.'
          if old not in s:
              raise SystemExit('expected cleanup-only blank line not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/pr512-final-cleanup.yml
      - name: Commit final cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove PR512 cleanup artifact"
          git push origin HEAD:codex/issue-461-ipwm-diagnostics
