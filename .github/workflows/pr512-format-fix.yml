name: PR512 format fix

on:
  push:
    branches:
      - codex/issue-461-ipwm-diagnostics

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/issue-461-ipwm-diagnostics
      - name: Apply project clang-format
        run: |
          version="$(tr -d '[:space:]' < .clang-format-version)"
          python3 -m pip install --disable-pip-version-check "clang-format==${version}"
          clang-format -i components/openquatt_incident_manager/OpenQuattIncidentManager.cpp
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add components/openquatt_incident_manager/OpenQuattIncidentManager.cpp
            git commit -m "Fix incident manager formatting"
            git push origin HEAD:codex/issue-461-ipwm-diagnostics
          fi
