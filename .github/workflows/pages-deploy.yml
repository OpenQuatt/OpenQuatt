name: Pages Deploy

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "build_targets.yaml"
      - "docs/**"
      - "openquatt/web/**"
      - "scripts/dev.py"
      - "scripts/build_targets.py"
      - "scripts/build_pages_docs.py"
      - "scripts/check_docs_consistency.py"
      - "scripts/check_web_docs_sync.mjs"
      - "scripts/prepare_pages_site.sh"
      - ".github/docs-impact.json"
      - ".github/workflows/pages-deploy.yml"
  workflow_run:
    workflows: ["Release Build"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  resolve-stable-release:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      tag: ${{ steps.stable_release.outputs.tag }}

    steps:
      - name: Checkout site source
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Resolve latest complete stable release
        id: stable_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected="$(python3 scripts/build_targets.py factory-files --status enabled | jq -R . | jq -s .)"
          releases="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --slurp)"
          release_tag="$(jq -r --argjson expected "${expected}" '
              add
              | map(
                  select(.draft == false and .prerelease == false)
                  | . as $release
                  | select(($expected - ($release.assets | map(.name)) | length) == 0)
                )
              | first
              | .tag_name // empty
            ' <<< "${releases}")"
          if [[ -z "${release_tag}" ]]; then
            if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
              echo "No complete stable release matches the current target matrix; waiting for Release Build."
              exit 0
            fi
            echo "No complete stable release with all expected factory binaries was found." >&2
            exit 1
          fi
          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"

  build-pages:
    runs-on: ubuntu-latest
    needs: resolve-stable-release
    if: ${{ needs.resolve-stable-release.outputs.tag != '' }}

    steps:
      - name: Checkout site source
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Check documentation contracts
        run: npm run check:docs

      - name: Download stable factory binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-stable-release.outputs.tag }}
        run: |
          mkdir -p .tmp/pages-firmware
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "*.firmware.factory.bin" \
            --dir .tmp/pages-firmware \
            --clobber

      - name: Capture latest stable release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-stable-release.outputs.tag }}
        run: |
          VERSION="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)"
          RELEASE_URL="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json url --jq .url)"
          mkdir -p .tmp/pages-metadata
          cat > .tmp/pages-metadata/version.json <<EOF
          {
            "version": "${VERSION}",
            "release_url": "${RELEASE_URL}"
          }
          EOF

      - name: Install web build dependencies
        run: npm ci

      - name: Assemble Pages site
        run: python3 scripts/dev.py prepare-pages-site site .tmp/pages-firmware

      - name: Add mirrored release metadata
        run: install -m 0644 .tmp/pages-metadata/version.json site/firmware/main/version.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    runs-on: ubuntu-latest
    needs: build-pages

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
