name: Dev Build

on:
  push:
    branches: [dev]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-release
  cancel-in-progress: true

jobs:
  compute-meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.dev_meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute dev version
        id: dev_meta
        run: |
          BASE_VERSION="$(awk -F'\"' '/^project_version: / { print $2 }' openquatt/oq_substitutions_common.yaml)"
          SHORT_SHA="${GITHUB_SHA::7}"
          DEV_VERSION="${BASE_VERSION}-dev.${GITHUB_RUN_NUMBER}+${SHORT_SHA}"
          echo "version=${DEV_VERSION}" >> "$GITHUB_OUTPUT"

  compile-profiles:
    needs: compute-meta
    uses: ./.github/workflows/esphome-build.yml
    with:
      artifact_suffix: dev-release
      include_debug_symbols: true
      project_version: ${{ needs.compute-meta.outputs.version }}
      release_channel: dev
      release_manifest_tag: dev-latest

  publish-dev-release:
    runs-on: ubuntu-latest
    needs: [compute-meta, compile-profiles]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download firmware artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: openquatt-*-dev-release
          path: dist

      - name: Download Q debug symbol staging artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: q-debug-stage-*-dev-release
          path: q-debug-symbols-staging
          merge-multiple: true

      - name: Prepare dev release assets and manifests
        run: |
          TAG="dev-latest"
          REPO="${GITHUB_REPOSITORY}"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"
          RELEASE_URL="https://github.com/${REPO}/releases/tag/${TAG}"
          ./scripts/prepare_release_assets.sh "${{ needs.compute-meta.outputs.version }}" "${BASE_URL}" "${RELEASE_URL}"

      - name: Prepare Q debug symbol artifact
        run: |
          ESPHOME_VERSION="$(sed -n 's/^esphome==//p' .github/requirements-esphome.txt)"
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          if [[ -z "${ESPHOME_VERSION}" ]]; then
            echo "Could not resolve ESPHome version from .github/requirements-esphome.txt" >&2
            exit 1
          fi
          python3 scripts/prepare_q_debug_symbols.py \
            "${{ needs.compute-meta.outputs.version }}" \
            "${SOURCE_COMMIT}" \
            "${ESPHOME_VERSION}" \
            --artifact-root q-debug-symbols-staging \
            --output-dir q-debug-symbols

      # Dev builds are frequent, so retain exact symbols for 7 days. The unique
      # version/SHA name keeps older dev symbol sets available after dev-latest moves.
      - name: Upload Q debug symbol artifact
        uses: actions/upload-artifact@v6
        with:
          name: openquatt-q-debug-symbols-${{ needs.compute-meta.outputs.version }}
          if-no-files-found: error
          retention-days: 7
          path: q-debug-symbols

      - name: Move dev release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa dev-latest -m "Development channel" "${GITHUB_SHA}"
          git push origin refs/tags/dev-latest --force

      - name: Create or update dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(cat <<EOF
          Mutable development-channel release for the \`dev\` branch.

          Commit: \`${GITHUB_SHA}\`
          Version: \`${{ needs.compute-meta.outputs.version }}\`
          EOF
          )

          if gh release view dev-latest >/dev/null 2>&1; then
            gh release edit dev-latest \
              --title "Development Channel" \
              --notes "$NOTES" \
              --prerelease
          else
            gh release create dev-latest \
              --title "Development Channel" \
              --notes "$NOTES" \
              --prerelease
          fi

      - name: Upload dev release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload dev-latest \
            ./*-ota.manifest.json \
            dist/*.firmware.ota.bin \
            dist/*.firmware.factory.bin \
            --clobber

      - name: Prune unexpected dev release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t expected < <(python3 scripts/build_targets.py release-files --status enabled)
          declare -A keep=()
          for asset in "${expected[@]}"; do
            keep["$asset"]=1
          done

          mapfile -t published < <(gh release view dev-latest --json assets --jq '.assets[].name')
          for asset in "${published[@]}"; do
            if [[ -z "${keep[$asset]+x}" ]]; then
              echo "Removing unexpected release asset: $asset"
              gh release delete-asset dev-latest "$asset" --yes
            fi
          done
