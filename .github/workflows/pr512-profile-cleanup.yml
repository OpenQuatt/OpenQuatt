name: PR512 profile cleanup

on:
  push:
    branches:
      - codex/issue-461-ipwm-diagnostics

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-461-ipwm-diagnostics
          fetch-depth: 0
      - name: Remove obsolete pump profile abstraction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def edit(path, fn):
              p = Path(path)
              old = p.read_text()
              new = fn(old)
              if new == old:
                  print(f"unchanged: {path}")
              else:
                  p.write_text(new)
                  print(f"updated: {path}")

          # Incident manager public/internal API: no profile parameter or stored profile.
          edit('components/openquatt_incident_manager/OpenQuattIncidentManager.h', lambda s: s
              .replace('  void observe_pump_context(uint8_t hp_index, oq_pump_ipwm::Profile profile, bool flow_valid, float flow_lph,\n                            uint32_t now_ms, uint32_t raw_max_age_ms);',
                       '  void observe_pump_context(uint8_t hp_index, bool flow_valid, float flow_lph, uint32_t now_ms);')
              .replace('    oq_pump_ipwm::Profile profile{oq_pump_ipwm::Profile::UNKNOWN};\n', ''))

          def clean_manager_cpp(s):
              s = s.replace('void OpenQuattIncidentManager::observe_pump_context(uint8_t hp_index, oq_pump_ipwm::Profile profile, bool flow_valid,\n                                                    float flow_lph, uint32_t now_ms, uint32_t raw_max_age_ms) {',
                            'void OpenQuattIncidentManager::observe_pump_context(uint8_t hp_index, bool flow_valid, float flow_lph,\n                                                    uint32_t now_ms) {')
              s = s.replace('.consume_if_fresh(now_ms, raw_max_age_ms, request_raw)', '.read_if_fresh(now_ms, request_raw)')
              s = s.replace('.consume_if_fresh(now_ms, raw_max_age_ms, relay_raw)', '.read_if_fresh(now_ms, relay_raw)')
              s = s.replace('.consume_if_fresh(now_ms, raw_max_age_ms, flow_switch_raw)', '.read_if_fresh(now_ms, flow_switch_raw)')
              s = s.replace('unit->pump_raw_observations[3U].consume_if_fresh(now_ms, raw_max_age_ms, context.feedback_raw)',
                            'unit->pump_raw_observations[3U].read_if_fresh(now_ms, context.feedback_raw)')
              s = s.replace('  context.profile = profile;\n', '')
              s = s.replace('oq_pump_ipwm::decode(profile, context.feedback_raw)', 'oq_pump_ipwm::decode(context.feedback_raw)')
              s = re.sub(r'\n\s*write_raw\(req, R"\(,"ipwm_profile":\)"\) &&\n\s*write_json_string\(req, oq_pump_ipwm::profile_name\(snapshot\.units\[slot\]\.pump_context\.profile\)\) &&', '', s)
              return s
          edit('components/openquatt_incident_manager/OpenQuattIncidentManager.cpp', clean_manager_cpp)

          # YAML: remove selector and decode R2137 directly with the fixed mapping.
          def clean_hp_io(s):
              s = re.sub(r'\n  - platform: template\n    id: \$\{hp_id\}_pump_ipwm_profile\n    name: "\$\{prefix\}Pump iPWM profile"\n    icon: mdi:pump\n    entity_category: config\n    disabled_by_default: true\n    optimistic: true\n    restore_value: true\n    initial_option: "Unknown / other"\n    options:\n      - "Unknown / other"\n      - "Wilo flow feedback"\n      - "Wilo 5-75 W feedback"\n', '\n', s)
              s = s.replace('      if (isnan(raw) || !id(${hp_id}_pump_ipwm_profile).has_state()) return NAN;\n      const auto profile = oq_pump_ipwm::profile_from_option(\n          id(${hp_id}_pump_ipwm_profile).current_option().c_str());\n      const auto feedback = oq_pump_ipwm::decode(\n          profile, static_cast<uint16_t>(lroundf(raw)));',
                            '      if (isnan(raw)) return NAN;\n      const auto feedback = oq_pump_ipwm::decode(static_cast<uint16_t>(lroundf(raw)));')
              s = re.sub(r'            // R2138 closes the pump telemetry range\.[\s\S]*?            id\(oq_incident_manager\)\.observe_pump_context\(\n                \$\{hp_index\}, profile, !isnan\(x\), x, now_ms, raw_max_age_ms\);',
                         '            // R2138 closes the pump telemetry snapshot. Pump-register context\n            // may be reused for up to 20 s because this is diagnostic information.\n            id(oq_incident_manager).observe_pump_context(\n                ${hp_index}, !isnan(x), x, now_ms);', s, count=1)
              s = s.replace('      if (id(${hp_id}_is_online) && !isnan(pump_feedback_raw) &&\n          id(${hp_id}_pump_ipwm_profile).has_state()) {\n        const auto pump_profile = oq_pump_ipwm::profile_from_option(\n            id(${hp_id}_pump_ipwm_profile).current_option().c_str());\n        const auto pump_feedback = oq_pump_ipwm::decode(\n            pump_profile, static_cast<uint16_t>(lroundf(pump_feedback_raw)));',
                            '      if (id(${hp_id}_is_online) && !isnan(pump_feedback_raw)) {\n        const auto pump_feedback = oq_pump_ipwm::decode(\n            static_cast<uint16_t>(lroundf(pump_feedback_raw)));')
              s = s.replace('      if (isnan(raw) || !id(${hp_id}_pump_ipwm_profile).has_state()) {\n        return std::string("unknown");\n      }\n      const auto profile = oq_pump_ipwm::profile_from_option(\n          id(${hp_id}_pump_ipwm_profile).current_option().c_str());\n      return std::string(oq_pump_ipwm::status_name(oq_pump_ipwm::decode(\n          profile, static_cast<uint16_t>(lroundf(raw))).status));',
                            '      if (isnan(raw)) return std::string("unknown");\n      return std::string(oq_pump_ipwm::status_name(oq_pump_ipwm::decode(\n          static_cast<uint16_t>(lroundf(raw))).status));')
              return s
          edit('openquatt/oq_HP_io.yaml', clean_hp_io)

          # Web incident JSON/UI: profile is no longer part of pump context.
          def clean_incident_js(s):
              s = re.sub(r'const PUMP_IPWM_PROFILE_LABELS = Object\.freeze\(\{[\s\S]*?\}\);\n', '', s)
              s = re.sub(r'  if \(pumpContext\.ipwmProfile && pumpContext\.ipwmProfile !== "unknown"\) \{\n    rows\.push\(\["iPWM-profiel", PUMP_IPWM_PROFILE_LABELS\[pumpContext\.ipwmProfile\] \|\| pumpContext\.ipwmProfile\]\);\n  \}\n', '', s)
              s = s.replace('    ipwmProfile: String(raw.ipwm_profile || "unknown"),\n', '')
              return s
          edit('openquatt/web/js/src/core/incident-monitoring.js', clean_incident_js)

          # Settings UI/config/sync: remove the profile entity completely.
          edit('openquatt/web/js/src/settings/core.js', lambda s: s
              .replace(', renderSettingsPumpIpwmSection', '')
              .replace('          renderSettingsPumpIpwmSection(),\n', ''))

          def clean_installation(s):
              s = re.sub(r'\n  export function renderSettingsPumpIpwmSection\(\) \{[\s\S]*?\n  \}\n\n  export function renderBoilerCvFields',
                         '\n  export function renderBoilerCvFields', s, count=1)
              return s
          edit('openquatt/web/js/src/settings/installation.js', clean_installation)

          def clean_config(s):
              s = re.sub(r'\n    hp1PumpIpwmProfile: \{ domain: "select", name: "HP1 - Pump iPWM profile" \},', '', s)
              s = re.sub(r'\n    hp2PumpIpwmProfile: \{ domain: "select", name: "HP2 - Pump iPWM profile", optional: true \},', '', s)
              s = re.sub(r'\n  export const PUMP_IPWM_PROFILE_KEYS = \["hp1PumpIpwmProfile", "hp2PumpIpwmProfile"\];', '', s)
              s = s.replace('    ...PUMP_IPWM_PROFILE_KEYS,\n', '')
              return s
          edit('openquatt/web/js/src/core/config.js', clean_config)

          def clean_sync(s):
              s = s.replace(', PUMP_IPWM_PROFILE_KEYS', '')
              s = s.replace('      ...PUMP_IPWM_PROFILE_KEYS,\n', '')
              return s
          edit('openquatt/web/js/src/core/entity-sync.js', clean_sync)

          # Mocks and scenarios.
          edit('openquatt/web/js/mock-device.js', lambda s: re.sub(
              r'\n  const PUMP_IPWM_PROFILE_OPTIONS = mockFixtures\.pumpIpwmProfileOptions;|\n    setEntity\("select", "HP1 - Pump iPWM profile", \{\n      value: "Unknown / other",\n      state: "Unknown / other",\n      option: PUMP_IPWM_PROFILE_OPTIONS,\n    \}\);', '', s))

          def clean_fixtures(s):
              s = re.sub(r'\n  const pumpIpwmProfileOptions = \[[\s\S]*?\n  \];\n', '\n', s, count=1)
              s = re.sub(r'\n    \["select", "HP2 - Pump iPWM profile", \{[^\n]*\}\],', '', s)
              s = s.replace('    pumpIpwmProfileOptions,\n', '')
              return s
          edit('openquatt/web/js/mock-fixtures.js', clean_fixtures)
          edit('openquatt/web/js/mock-incident-scenarios.js', lambda s: re.sub(r'\n\s*ipwm_profile: "[^"]+",', '', s))

          # Docs: remove profile guidance entirely.
          edit('docs/instellingen-en-meetwaarden.md', lambda s: s
              .replace('- `Pump iPWM profile` (per warmtepomp, geavanceerde diagnose)\n', '')
              .replace('\n`Pump iPWM profile` bepaalt hoe de ruwe R2137-feedback wordt geïnterpreteerd. Laat dit op `Unknown / other` staan zolang het feedbacktype van de gemonteerde pomp niet is bevestigd; diagnostische codes worden dan nooit als pompvermogen meegerekend.\n', ''))
          edit('docs/web-app.md', lambda s: re.sub(r'\nVoor iedere warmtepomp staat hier ook het `iPWM feedbackprofiel`\.[^\n]*\n', '\n', s))

          # Tests: remove profile-specific assertions/fixtures while retaining incident tests.
          def clean_incident_test(s):
              s = re.sub(r'\n\s*ipwm_profile: "[^"]+",', '', s)
              s = s.replace('    ["iPWM-profiel", "Wilo flow-feedback"],\n', '')
              s = s.replace('    ).length,\n    6,', '    ).length,\n    5,')
              return s
          edit('openquatt/web/tests/incident-monitoring.test.mjs', clean_incident_test)
          edit('openquatt/web/tests/mock-incident-scenarios.test.mjs', lambda s: s)

          # Remove now-obsolete profile backup/sync test.
          def clean_install_test(s):
              s = s.replace('const { PUMP_IPWM_PROFILE_KEYS, SETTINGS_BACKUP_SECTIONS, SETTINGS_KEYS } = await import("../js/src/core/config.js");\n', '')
              s = re.sub(r'\n+test\("pomp-iPWM-profielen zijn per HP gesynchroniseerd en worden meegenomen in backup", \(\) => \{[\s\S]*?\n\}\);\n?', '\n', s)
              return s
          edit('openquatt/web/tests/installation-monitoring.test.mjs', clean_install_test)

          # UI contract file retains only the incident-detail test.
          def clean_ui_contract(s):
              s = re.sub(r'const settingsCoreSource =[\s\S]*?const entitySyncSource = await readFile\(new URL\("\.\./js/src/core/entity-sync\.js", import\.meta\.url\), "utf8"\);\n', '', s)
              s = re.sub(r'\n+test\("per-HP iPWM-profiel[\s\S]*?\n\}\);\n?', '\n', s)
              return s
          edit('openquatt/web/tests/pump-ipwm-ui-contract.test.mjs', clean_ui_contract)

          # Host tests / contract: fixed mapping has no Profile type.
          def clean_host_test(s):
              s = s.replace('decode(Profile::UNKNOWN, raw)', 'decode(raw)')
              s = re.sub(r'  for \(Profile profile : \{Profile::UNKNOWN, Profile::WILO_FLOW, Profile::WILO_POWER_5_75_W\}\) \{\n', '', s)
              s = s.replace('    const DecodedFeedback running = decode(profile, 500U);', '  const DecodedFeedback running = decode(500U);')
              s = s.replace('    const DecodedFeedback diagnostic = decode(profile, 950U);', '  const DecodedFeedback diagnostic = decode(950U);')
              s = s.replace('    assert(running.status', '  assert(running.status').replace('    assert(running.power_valid', '  assert(running.power_valid').replace('    assert(running.power_w', '  assert(running.power_w').replace('    assert(power_contribution_w', '  assert(power_contribution_w').replace('    assert(diagnostic.status', '  assert(diagnostic.status').replace('    assert(!diagnostic.power_valid', '  assert(!diagnostic.power_valid')
              s = re.sub(r'\n  \}\n\}\n\nvoid test_raw_observation', '\n}\n\nvoid test_raw_observation', s, count=1)
              s = s.replace('consume_if_fresh(15100U, 5000U, raw)', 'read_if_fresh(15100U, raw)')
              s = s.replace('consume_if_fresh(20100U, 5000U, raw)', 'read_if_fresh(20100U, raw)')
              s = s.replace('consume_if_fresh(3U, 5000U, raw)', 'read_if_fresh(3U, raw)')
              return s
          edit('tests/host/oq_pump_ipwm_feedback_test.cpp', clean_host_test)

          def clean_contract(s):
              s = s.replace('        self.assertNotIn("if (profile == Profile::WILO_POWER_5_75_W)", PUMP_IPWM_HEADER)\n        self.assertNotIn("if (profile == Profile::UNKNOWN) return result", PUMP_IPWM_HEADER)\n',
                            '        self.assertNotIn("Profile", PUMP_IPWM_HEADER)\n')
              s = s.replace('        self.assertNotIn("this->pending = false", PUMP_IPWM_HEADER)\n', '        self.assertIn("read_if_fresh", PUMP_IPWM_HEADER)\n')
              return s
          edit('scripts/tests/test_pump_ipwm_contract.py', clean_contract)

          # Budget comment wording only.
          edit('openquatt/web/web-budgets.mjs', lambda s: s.replace('profile-aware pump/ODU incident diagnostics', 'pump/ODU incident diagnostics'))

          # Guard against any remaining obsolete user-facing/profile abstraction references.
          forbidden = [
              'pump_ipwm_profile', 'Pump iPWM profile', 'PUMP_IPWM_PROFILE_KEYS',
              'Wilo flow feedback', 'Unknown / other', 'ipwm_profile',
              'oq_pump_ipwm::Profile', 'profile_from_option', 'profile_name(',
          ]
          roots = [Path('components'), Path('openquatt'), Path('docs'), Path('scripts'), Path('tests')]
          leftovers = []
          for root in roots:
              for p in root.rglob('*'):
                  if not p.is_file() or p.suffix.lower() not in {'.h','.cpp','.yaml','.yml','.js','.mjs','.py','.md'}:
                      continue
                  text = p.read_text(errors='ignore')
                  for needle in forbidden:
                      if needle in text:
                          leftovers.append(f'{p}: {needle}')
          if leftovers:
              raise SystemExit('obsolete profile references remain:\n' + '\n'.join(leftovers))
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes"
            exit 0
          fi
          git commit -m "Remove obsolete pump profile abstraction"
          git push origin HEAD:codex/issue-461-ipwm-diagnostics
