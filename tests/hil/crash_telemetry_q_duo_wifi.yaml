# Test-only Heatpump Controller Q / Duo / Wi-Fi firmware for issue #488.
# Never include this package in a release target: every button below deliberately
# crashes or stalls the controller.

packages:
  oq_crash_test_base: !include ../../configs/heatpump_controller_q/duo_wifi.yaml

esphome:
  build_path: ../../.esphome/build/hil_crash_telemetry_q_duo_wifi

button:
  - platform: template
    id: oq_hil_crash_abort
    name: "HIL crash: abort"
    entity_category: diagnostic
    disabled_by_default: true
    on_press:
      - lambda: |-
          std::abort();

  - platform: template
    id: oq_hil_crash_invalid_write
    name: "HIL crash: invalid pointer write"
    entity_category: diagnostic
    disabled_by_default: true
    on_press:
      - lambda: |-
          auto *invalid = reinterpret_cast<volatile uint32_t *>(static_cast<uintptr_t>(0x1U));
          *invalid = 0x4F514849U;

  - platform: template
    id: oq_hil_crash_loop_watchdog
    name: "HIL crash: loop watchdog"
    entity_category: diagnostic
    disabled_by_default: true
    on_press:
      - lambda: |-
          for (;;) {
            asm volatile("nop");
          }
