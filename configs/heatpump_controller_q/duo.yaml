# ==============================================================================
# OpenQuatt - Electropaultje Heatpump Controller Q-edition / Duo
# ==============================================================================
substitutions:
  # Topology is hard-pinned by the release target; hardware/network ownership lives in their packages.
  oq_topology_build_flag: "-DOQ_TOPOLOGY_DUO=1"

esphome:
  build_path: ../../../.esphome/build/heatpump_controller_q_duo

packages:
  openquatt_substitutions_common: !include ../../openquatt/oq_substitutions_common_package.yaml
  openquatt_profile_heatpump_controller_q: !include ../../openquatt/profiles/heatpump_controller_q.yaml
  openquatt_profile_heatpump_controller_q_cic_compatibility_duo: !include ../../openquatt/profiles/heatpump_controller_q/cic_compatibility_duo.yaml
  openquatt_base_common: !include ../../openquatt/base/common.yaml
  openquatt_connection_wifi_eth: !include ../../openquatt/connection/wifi_eth.yaml
  openquatt_packages_common: !include ../../openquatt/oq_packages_common.yaml
  openquatt_topology_duo: !include ../../openquatt/topology/duo.yaml
