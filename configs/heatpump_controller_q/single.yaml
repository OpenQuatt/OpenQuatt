# ==============================================================================
# OpenQuatt - Electropaultje Heatpump Controller Q-edition / Single
# ==============================================================================
substitutions:
  oq_hardware_profile: "heatpump_controller_q"
  oq_connection: "auto"
  oq_connection_text_internal: "false"
  oq_artifact_connection_suffix: ""
  oq_hardware_build_flag: "-DOQ_HARDWARE_HEATPUMP_CONTROLLER_Q=1"
  oq_local_supply_temp_sensor_id: "water_supply_temp_pt1000"
  oq_local_supply_temp_selector_id: "oq_local_supply_temp_source"
  oq_controller_flow_sensor_id: "flow_rate_controller"
  oq_q_flow_source_selector_id: "oq_q_flow_source"
  oq_topology_build_flag: "-DOQ_TOPOLOGY_DUO=0"
  main_release_manifest_url: "https://github.com/OpenQuatt/OpenQuatt/releases/latest/download/openquatt-heatpump-controller-q-single-ota.manifest.json"
  dev_release_manifest_url: "https://github.com/OpenQuatt/OpenQuatt/releases/download/dev-latest/openquatt-heatpump-controller-q-single-ota.manifest.json"
  release_manifest_url: "https://github.com/OpenQuatt/OpenQuatt/releases/latest/download/openquatt-heatpump-controller-q-single-ota.manifest.json"
  alternate_topology: "duo"
  alternate_topology_main_release_manifest_url: "https://github.com/OpenQuatt/OpenQuatt/releases/latest/download/openquatt-heatpump-controller-q-duo-ota.manifest.json"
  alternate_topology_dev_release_manifest_url: "https://github.com/OpenQuatt/OpenQuatt/releases/download/dev-latest/openquatt-heatpump-controller-q-duo-ota.manifest.json"
  alternate_build_main_release_manifest_url: "https://github.com/OpenQuatt/OpenQuatt/releases/latest/download/openquatt-heatpump-controller-q-duo-ota.manifest.json"
  alternate_build_dev_release_manifest_url: "https://github.com/OpenQuatt/OpenQuatt/releases/download/dev-latest/openquatt-heatpump-controller-q-duo-ota.manifest.json"

esphome:
  build_path: ../../../.esphome/build/heatpump_controller_q_single

packages:
  openquatt_substitutions_common: !include ../../openquatt/oq_substitutions_common_package.yaml
  openquatt_topology_single_substitutions: !include ../../openquatt/topology/single_package.yaml
  openquatt_profile_heatpump_controller_q: !include ../../openquatt/profiles/heatpump_controller_q.yaml
  openquatt_base_common: !include ../../openquatt/base/common.yaml
  openquatt_connection_wifi_eth: !include ../../openquatt/connection/wifi_eth.yaml
  openquatt_packages_common: !include ../../openquatt/oq_packages_common.yaml
