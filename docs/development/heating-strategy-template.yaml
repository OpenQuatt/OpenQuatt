# ==============================================================================
# OpenQuatt - Example Heating Strategy Template
# ==============================================================================
# Documentation skeleton only; not loaded by any firmware package.
# Integrate selection/reset, supervisory and request consumers before use.
# See heating-strategy-development.md for the complete contract.
#
# Package registry: openquatt/packages/20_strategies.yaml
# Pure decisions: openquatt/includes/control/oq_<your_strategy>_logic.h
# Stateful ESPHome adapter: openquatt/includes/control/oq_<your_strategy>_runtime.h
# Shared request decisions: openquatt/includes/control/oq_thermal_request_logic.h
#
# Example strategy code 5 is not supported by existing consumers automatically.
# Request strategy code 4 is already reserved for STRATEGY_MANUAL_HP.
# The manager must select it, including while idle to prepare heating intent.
# Do not send HP writes here; request control and the actuator retain their guards.
# ==============================================================================

globals:
  - id: oq_my_strategy_request_hp1_level
    type: int
    restore_value: false
    initial_value: '0'

  - id: oq_my_strategy_request_hp2_level
    type: int
    restore_value: false
    initial_value: '0'

  - id: oq_my_strategy_request_owner_hp
    type: int
    restore_value: false
    initial_value: '0'

  - id: oq_my_strategy_request_reason_code
    type: int
    restore_value: false
    initial_value: '0'

interval:
  - interval: ${oq_heat_loop_tick_s}s
    startup_delay: 4000ms
    then:
      - lambda: |-
          // 1) Own local state only when selected by the extended manager.
          constexpr uint8_t strategy_code = 5;
          const bool active = id(oq_strategy_active_code) == strategy_code;
          if (!active) {
            id(oq_my_strategy_request_hp1_level) = 0;
            id(oq_my_strategy_request_hp2_level) = 0;
            id(oq_my_strategy_request_owner_hp) = 0;
            id(oq_my_strategy_request_reason_code) = 0;
            // Invalidate only our old output; never clear another producer.
            if (id(oq_strategy_output_source_code) == strategy_code) {
              id(oq_strategy_output_valid) = false;
              id(oq_strategy_output_source_code) = 0;
              id(oq_strategy_output_updated_ms) = 0;
            }
            return;
          }

          // 2) Replace this blocked skeleton with input validation and decisions.
          const bool inputs_valid = false;
          const int raw = 0;
          const float requested_w = NAN;
          const float supply_target_c = NAN;
          const int hp1_request = 0;
          const int hp2_request = 0;
          const int owner_hp = 0;
          const int reason_code = 0;
          // Keep invalid/default output incapable of creating heating intent.
          const bool output_valid = inputs_valid;
          id(oq_strategy_output_valid) = false;

          // 3) Publish local intent; these fields are not hardware writes.
          id(oq_my_strategy_request_hp1_level) = output_valid ? hp1_request : 0;
          id(oq_my_strategy_request_hp2_level) = output_valid ? hp2_request : 0;
          id(oq_my_strategy_request_owner_hp) = output_valid ? owner_hp : 0;
          id(oq_my_strategy_request_reason_code) = reason_code;

          // 4) Publish coherent shared metadata; validity becomes true last.
          id(oq_demand_raw) = output_valid ? std::max(0, std::min((int) ${oq_strategy_demand_max_f}, raw)) : 0;
          id(oq_strategy_phase_code) = 0;
          id(oq_strategy_requested_power_w) = output_valid ? requested_w : NAN;
          id(oq_strategy_supply_target_temp) = output_valid ? supply_target_c : NAN;
          id(oq_strategy_heat_request_active) = output_valid && raw > 0;
          id(oq_strategy_hp_expected_power_w) = NAN;
          id(oq_strategy_hp_max_power_w) = NAN;
          id(oq_strategy_hp_saturated) = false;
          id(oq_strategy_output_source_code) = strategy_code;
          id(oq_strategy_output_updated_ms) = (uint32_t) millis();
          id(oq_strategy_phase_text).publish_state(output_valid ? "idle" : "invalid_inputs");
          id(oq_strategy_output_valid) = output_valid;
